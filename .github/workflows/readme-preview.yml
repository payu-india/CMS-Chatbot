name: ReadMe Preview Deploy

on:
  push:
    branches-ignore:
      - v1

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Push docs to ReadMe preview version
        uses: readmeio/rdme@v9
        with:
          rdme: docs ./docs --version 4.0 --create-categories
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}