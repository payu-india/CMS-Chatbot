        - Valid designations: Director, Partner, Designated Partner, CEO, CFO,
        Senior Management, Trustee, Secretary

        - Remove entries from the array if fewer members are needed

        - All PAN numbers are validated against the PAN registry


        ## Next Step

        Proceed to **Step 14** — Fetch required KYC documents.
