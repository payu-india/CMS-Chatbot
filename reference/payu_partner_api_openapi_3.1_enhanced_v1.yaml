openapi: 3.1.0
info:
  title: Partner API - Public Entity Copy 2
  version: 1.0.0
  description: >
    # PayU Partner Onboarding APIs — Complete 16-Step Specification


    A complete set of white-label APIs that let partners onboard merchants onto
    PayU entirely from their own platform. Partners call APIs, PayU validates,
    verifies, and activates. PayU remains the system of record.


    ## Architecture


    ```

    MERCHANT ──(browser/app)──> PARTNER BACKEND ──(API)──> PAYU BACKEND
                                                   <──(webhook)──
    ```


    All API calls are **server-to-server**. Never expose your bearer token to
    the browser.


    ## Environments


    | Environment | Auth URL | Partner API URL |

    |-------------|----------|-----------------|

    | Test | `https://test-accounts.payu.in` | `https://test-partner.payu.in` |

    | Production | `https://accounts.payu.in` | `https://partner.payu.in` |


    ## Authentication


    All requests require a bearer token obtained via OAuth (`POST
    /oauth/token`).


    | Header | Value |

    |--------|-------|

    | `Authorization` | `Bearer {token}` |

    | `Content-Type` | `application/json` or `multipart/form-data` (file
    uploads) |


    ## The 16-Step Onboarding Sequence


    This sequence **must be followed exactly**. Each step depends on the
    previous one.


    | Step | Name | Endpoint | Entities | Notes |

    |------|------|----------|----------|-------|

    | 01 | Create Merchant | `POST /api/v3/merchants` | All | Returns `mid` +
    `uuid`. Entity type set here. |

    | 02 | Update: PAN + DOB | `PUT /api/v1/merchants/{uuid}/update` | All |
    PAN, DOB/DOI |

    | 03 | CKYC Verification | `POST .../send_ckyc_otp` or `.../ckyc_data` | All
    | OTP for Individual/Sole Prop; Fetch for others |

    | 04 | Update: Business Details | `PUT /api/v1/merchants/{uuid}/update` |
    All | Category, GST, CIN (if eligible) |

    | 05 | Update: Bank Details | `PUT /api/v1/merchants/{uuid}/update` | All |
    Auto-verification attempted |

    | 06 | Upload Bank Proof | `POST /api/v3/merchants/{mid}/kyc_document` | All
    (conditional) | Only if bank auto-verification fails |

    | 07 | Update: Website Details | `PUT /api/v1/merchants/{uuid}/update` | All
    | Website, Android, iOS URLs |

    | 08 | Add Signatory Details | `POST
    /api/v1/merchants/{uuid}/add_bank_detail` | All | Prerequisite for
    DigiLocker |

    | 09 | DigiLocker Verification | `POST .../generate_digilocker_link` |
    Conditional | See branching rules below |

    | 10 | Update: Addresses | `PUT /api/v1/merchants/{uuid}/update` | All |
    Registration + Operating |

    | 11 | Video KYC | `POST .../create_vkyc_profile` | All | Can be skipped |

    | 12 | Add/Update UBO | `POST /api/v1/merchants/{uuid}/add_bank_detail` |
    Pvt Ltd, Public Ltd, Partnership, Trust, LLP, Society | Not for
    Individual/Sole Prop |

    | 13 | Business Members & KMP | `PUT
    /api/v1/merchants/{uuid}/submit_business_members` | Pvt Ltd, Public Ltd,
    Partnership, LLP | Not for Individual/Sole Prop/Trust/Society |

    | 14 | Fetch Required KYC Docs | `GET
    /api/v3/merchants/{mid}/kyc_document/required_docs` | All | Response feeds
    into Step 15 |

    | 15 | Upload KYC Documents | `POST /api/v3/merchants/{mid}/kyc_document` |
    All | One call per required doc category |

    | 16 | E-Sign Agreement | `GET .../generate_merged_document_for_esign` | All
    | Final step — merchant activated |


    ## Entity-Step Applicability Matrix


    | Step | Individual | Sole Prop | Partnership | Pvt Ltd | Public Ltd | LLP |
    Trust | Society | One Person Co |

    |------|-----------|-----------|-------------|---------|------------|-----|-------|---------|---------------|

    | 01-02 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |

    | 03 CKYC | OTP flow | OTP flow | Fetch flow | Fetch flow | Fetch flow |
    Fetch flow | Fetch flow | Fetch flow | Fetch flow |

    | 04-05 | Yes | Yes | Yes | Yes (+ CIN) | Yes (+ CIN) | Yes | Yes | Yes |
    Yes (+ CIN) |

    | 06 | If bank fails | If bank fails | If bank fails | If bank fails | If
    bank fails | If bank fails | If bank fails | If bank fails | If bank fails |

    | 07-08 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |

    | 08 CIN field | No | No | No | Yes | Yes | No | No | No | Yes |

    | 09 DigiLocker | Skip if CKYC ok | Skip if CKYC ok | Required | Required |
    Required | Required | Required | Required | Required |

    | 10-11 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |

    | 12 UBO | No | No | Yes | Yes | Yes | Yes | Yes | Yes | No |

    | 13 Biz Members | No | No | Yes | Yes | Yes | Yes | No | No | No |

    | 14-16 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |


    ## DigiLocker Branching Rules (Step 09)


    ```

    IF entity_type IN (Individual, Sole Proprietorship):
        IF CKYC (Step 03) succeeded:
            DigiLocker = OPTIONAL (can skip)
        ELSE IF CKYC was skipped:
            DigiLocker = REQUIRED
    ELSE (all other entity types):
        DigiLocker = ALWAYS REQUIRED (even if CKYC succeeded)

    PREREQUISITE: Step 08 (Signatory Details) must be completed before
    DigiLocker.

    ```


    ## Key Identifiers


    | Identifier | Source | Format | Used In Steps |

    |------------|--------|--------|---------------|

    | `mid` | Step 01 response | Numeric (e.g., `8390925`) | 06, 09, 14, 15 (KYC
    doc APIs) |

    | `uuid` | Step 01 response | UUID (e.g.,
    `11ef-d968-6b042d6c-9b94-02975f21d323`) | 02, 04, 05, 07, 08, 10, 12, 13, 16
    |

    | `product_account_uuid` | Step 01 response | UUID | 16 (E-Sign) |


    ## Error Codes Reference


    | Code | Meaning | Recovery |

    |------|---------|----------|

    | `200` | Success | Process response |

    | `201` | Created | Resource created |

    | `204` | No Content | Deletion successful |

    | `400` | Bad Request | Check parameters |

    | `401` | Unauthorized | Token invalid/expired — call Step 00 again |

    | `403` | Forbidden | No access to this merchant |

    | `404` | Not Found | Check `uuid`, `mid`, or `merchant_id` |

    | `422` | Validation Failed | Read error message — it says exactly what's
    wrong |

    | `429` | Rate Limited | Back off and retry |

    | `500` | Server Error | Retry with exponential backoff |


    ## Utilities


    The **GetMerchant** API (`GET /api/v1/merchants/{merchant_id}`) can be
    called **at any point** between steps to check internal statuses: PAN
    verification, bank verification, CKYC status, DigiLocker status, VKYC
    status, document verification, agreement status, and overall onboarding
    stage. See the Utilities folder.


    ## References


    - [PayU Partner Program
    Overview](https://docs.payu.in/docs/payu-partner-program-overview)

    - [Onboarding APIs
    Reference](https://docs.payu.in/reference/onboarding-apis)

    - [Documents
    Checklist](https://docs.payu.in/docs/documents-checklist-for-account-activation)



    ## Discovered During Live Testing (March 2026)


    1. **CreateMerchant requires `merchant[product]=PayUbiz`** — without it, a
    MySQL duplicate entry error occurs. The `business_entity_type` is also
    required at creation time (despite initial assumption it could be deferred
    to Step 02). The entity type can be changed in Step 02 via the Update API.

    3. **VKYC requires signatory details** — calling VKYC before adding
    signatory returns: `Please complete (Signing authority details captured
    step) before initiating VKYC`.



    ## Learnings from Live Merchant (mid: 760070179, Private Limited, status:
    live)


    ### Successful API Responses Captured

    - **VKYC**: Returns `capture_link` even for already-approved merchants
    (generates new VCIP link)

    - **DigiLocker**: Returns `"Digilocker KYC is already completed"` if already
    done — idempotent check

    - **Required Docs**: For a live Private Limited, returns 5 remaining
    categories (some already `Approved`). The `kyc_document` field is `null` for
    pending, or contains `{"status": "Approved"}` for uploaded docs.

    - **Show KYC Document**: Returns full document details including `doc_url`
    (signed S3 URL), `document_category_name`, `document_type_name`, `status`

    - **Upload KYC Document (no file)**: Returns `{"error": {"document": "must
    be present"}}` — file is mandatory

    - **GetMerchant (live)**: Shows `status: live`, all verifications
    `Success`/`approved`, `settlement_status: Active`, `agreement_status:
    Approved`


    ### API Constraints Discovered


    ### E-Sign Correct Endpoint (Discovered March 2026)

    - **URL:** `GET /api/v1/merchants/{uuid}/generate_merged_document_for_esign`
    on `test-partner.payu.in`

    - **Scope:** `refer_merchant` + at least one of (`client_manage_agreement`
    or `client_manage_kyc_details`). `refer_merchant` alone returns `401`.
servers:
  - url: https://test-accounts.payu.in
    description: Authentication Server (Test)
  - url: https://test-partner.payu.in
    description: Test/Sandbox Environment
  - url: https://partner.payu.in
    description: Production Environment
paths:
  /oauth/token:
    post:
      summary: GetToken
      operationId: GetToken
      tags:
        - Step 00 — Authentication
      security:
        - BearerAuth: []
      description: >
        # GetToken — Obtain Bearer Token


        **Step 0 of 16** — Always call this first.


        ## Endpoint


        `POST /oauth/token`


        ## Request Body (x-www-form-urlencoded)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `client_id` | string | Yes | 64-char hex | Partner OAuth client ID |

        | `client_secret` | string | Yes | 64-char hex | Partner OAuth client
        secret |

        | `grant_type` | string | Yes | Must be `client_credentials` | OAuth
        grant type |

        | `scope` | string | Yes | Space-separated | Required scopes |


        ## Response (200 OK)


        ```json

        {
            "access_token": "7b5843b39e5532bc...",
            "token_type": "Bearer",
            "expires_in": 7199,
            "scope": "refer_merchant",
            "created_at": 1723498499
        }

        ```


        ## Response-to-Request Mapping


        | Response Field | Used As | In Steps |

        |---------------|---------|----------|

        | `access_token` | `Authorization: Bearer {access_token}` header | All
        subsequent steps |

        | `expires_in` | Token validity in seconds | Refresh before expiry |


        ## Error Handling


        | Error | Cause | Recovery |

        |-------|-------|----------|

        | `401` | Invalid client_id or client_secret | Verify credentials with
        PayU KAM |

        | `400` | Invalid grant_type or scope | Check parameter values |


        ## Next Step


        Use the `access_token` in Step 01 to create a merchant.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                grant_type:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants:
    post:
      summary: CreateMerchant
      operationId: CreateMerchant
      tags:
        - Step 01 — Create Merchant
      security:
        - BearerAuth: []
      description: >
        # CreateMerchant — Step 01 of 16


        Creates a new merchant shell account on PayU.


        ## Endpoint


        `POST /api/v3/merchants`


        ## Prerequisite Steps

        - Step 00: Valid bearer token with `refer_merchant` scope


        ## Entity Applicability

        **All entities**


        ## Request Body (form-data)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant[display_name]` | string | Yes | Non-empty | Business or
        display name |

        | `merchant[email]` | string | Yes | Valid email, unique across PayU |
        Merchant email |

        | `merchant[mobile]` | string | Yes | Exactly 10 digits | Indian mobile
        number |

        | `merchant[business_details][business_entity_type]` | string | Yes |
        From allowed list | Business entity type |

        | `merchant[business_details][business_entity_type]` | string | Yes |
        From allowed list | Entity type — determines downstream flow |

        | `merchant[product]` | string | Yes | Must be `PayUbiz` | PayU product
        type — **required to avoid backend error** |


        **IMPORTANT: `merchant[product]=PayUbiz` is REQUIRED.** Omitting it
        causes a backend MySQL duplicate entry error in the test environment.


        ## Response (200 OK)


        ```json

        {
            "mid": 12345678,
            "uuid": "11ef-d968-6b042d6c-9b94-02975f21d323",
            "product_account_uuid": "11ef-d968-6b042d6c-9b94-02975f21d323"
        }

        ```


        ## Response-to-Request Mapping


        | Response Field | Format | Used In Steps |

        |---------------|--------|---------------|

        | `mid` | Numeric (e.g., `12345678`) | Steps 06, 09, 14, 15 — KYC
        document APIs use `{mid}` in URL path |

        | `uuid` | UUID string | Steps 02, 04, 05, 07, 08, 10, 12 —
        Update/signatory APIs use `{uuid}` in URL path |

        | `product_account_uuid` | UUID string | Step 16 — E-Sign API uses this
        in URL path |


        ## Error Handling


        | Error Code | Cause | Recovery |

        |------------|-------|----------|

        | `422` - "Email has already been taken" | Duplicate email | Use a
        different email or retrieve existing merchant |

        | `422` - "Mobile is invalid" | Not 10 digits | Fix mobile format |

        | `401` | Token expired or invalid | Re-authenticate via Step 00 |




        ## Response Fields (200 OK)


        | Field | Type | Description | Used In |

        |-------|------|-------------|---------|

        | `merchant.mid` | integer | Numeric merchant ID | Steps 06, 09, 14, 15
        (URL path `{mid}`) |

        | `merchant.uuid` | string | Merchant UUID | Steps 02, 04, 05, 07, 08,
        10, 12 (URL path `{uuid}`) |

        | `merchant.email` | string | Registered email | — |

        | `merchant.registered_mobile` | string | Registered mobile | — |

        | `merchant.product` | string | PayU product (`PayUbiz`) | — |

        | `merchant.business_type` | string | Business classification
        (`LongTail`) | — |

        | `merchant.business_entity` | string | Entity type set at creation |
        Determines downstream flow |

        | `merchant.status` | string | Onboarding status: `account_created`
        initially | Poll via GetMerchant |

        | `merchant.partner_source` | string | Always `Create Merchant API` for
        API-created merchants | — |

        | `merchant.pan_verification_status` | string | `Pending` initially →
        `Success` / `Failed` after Step 02 | Check before Step 03 |

        | `merchant.bank_verification_status` | string | `null` initially → set
        after Step 05 | Determines Step 06 |

        | `merchant.kyc_status.kyc_status` | string | `LOCKED` initially →
        `COMPLETED` after KYC done | — |

        | `merchant.kyc_status.ckyc_status` | string | `PENDING` initially →
        `COMPLETED` after Step 03 | Determines Step 09 |

        | `merchant.agreement_status` | string | `Not Generated` initially →
        `Approved` after Step 16 | — |

        | `merchant.vkyc_status` | string | `pending` → `link_generated` →
        `approved` / `declined` | — |

        | `merchant.digilocker_status` | string | `null` → `link_generated` →
        `approved` | — |

        | `merchant.document_status` | string | `Pending` → tracks KYC document
        upload progress | — |

        | `merchant.settlement_status` | string | `null` → `Active` once
        merchant is live | — |

        | `merchant.is_authorisation_letter_required` | boolean | `true` for
        non-individual entities | Affects Step 14 docs |

        | `merchant.blocked` | boolean | Whether merchant is blocked | — |

        | `merchant.skip_vkyc_eligible` | boolean | Whether VKYC can be skipped
        | Step 11 |

        | `merchant.ckyc_skipped` | boolean | Whether CKYC was skipped | Affects
        Step 09 DigiLocker |

        | `merchant.service_intent` | string | Service intent (`default`) | — |


        ## Next Step

        Proceed to **Step 02** — Update merchant with PAN, DOB, and business
        entity type.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[display_name]:
                  type: string
                merchant[email]:
                  type: string
                merchant[mobile]:
                  type: string
                merchant[product]:
                  type: string
                merchant[business_details][business_entity_type]:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v1/merchants/{uuid}/update:
    put:
      summary: UpdateMerchant_Addresses
      operationId: UpdateMerchant_Addresses
      tags:
        - 'Step 10 — Update: Addresses'
      security:
        - BearerAuth: []
      description: >
        # UpdateMerchant: Addresses — Step 10 of 16


        ## Endpoint


        `PUT /api/v1/merchants/{uuid}/update`


        ## Request Body (form-data)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant[registration_address][address_line]` | string | Yes |
        Non-empty | Registered address |

        | `merchant[registration_address][city]` | string | Yes | Non-empty |
        City |

        | `merchant[registration_address][state]` | string | Yes | Valid Indian
        state | State |

        | `merchant[registration_address][pincode]` | string | Yes | 6 digits |
        Pincode |

        | `merchant[operating_address][address_line]` | string | Yes | Non-empty
        | Operating address |

        | `merchant[operating_address][city]` | string | Yes | Non-empty | City
        |

        | `merchant[operating_address][state]` | string | Yes | Valid Indian
        state | State |

        | `merchant[operating_address][pincode]` | string | Yes | 6 digits |
        Pincode |


        ## Next Step

        Proceed to **Step 11** — Video KYC.
      parameters:
