  /api/v3/merchants/{mid}/kyc_document/required_docs:
    get:
      summary: FetchRequiredDocs
      operationId: FetchRequiredDocs
      tags:
        - Step 14 — Fetch Required KYC Documents
      security:
        - BearerAuth: []
      description: >
        # Fetch Required KYC Documents — Step 14 of 16


        Returns the list of document categories and types the merchant must
        upload.


        ## Endpoint


        `GET /api/v3/merchants/{mid}/kyc_document/required_docs`


        ## How to Use the Response in Step 15


        For each item in `response.document_categories[]`:

        1. Read `name` → this becomes `merchant[document_category]` in Step 15

        2. Choose one from `document_types[].name` → this becomes
        `merchant[document_type]` in Step 15

        3. Upload the file via Step 15


        **Example mapping:**

        ```

        Response:
          document_categories[0].name = "PAN Card of Signing Authority"
          document_categories[0].document_types[0].name = "PAN Card"

        Step 15 Request:
          merchant[document_category] = "PAN Card of Signing Authority"
          merchant[document_type] = "PAN Card"
          merchant[processed_document] = @pan_card.jpg
        ```


        ## See folder description for complete UUID-to-name reference tables and
        per-entity document requirements.




        ## Response Fields (200 OK)


        | Field | Type | Description |

        |-------|------|-------------|

        | `business_entity` | string | Entity type (e.g., `"Private Limited"`) |

        | `eligible_for_br_exemption` | boolean | Whether Board Resolution
        exemption applies |

        | `document_categories` | array | Required document categories |

        | `document_categories[].id` | integer | Internal category ID |

        | `document_categories[].name` | string | Category name — **use this as
        `merchant[document_category]` in Step 15** |

        | `document_categories[].uuid` | string | Category UUID — maps to YML
        reference tables |

        | `document_categories[].name_on_frontend` | string | Frontend key for
        the category |

        | `document_categories[].re_fetch` | boolean | Whether re-fetch is
        needed |

        | `document_categories[].kyc_document_status` | string | `"required"` =
        needs upload |

        | `document_categories[].document_types` | array | Accepted document
        types for this category |

        | `document_categories[].document_types[].name` | string | Type name —
        **use this as `merchant[document_type]` in Step 15** |

        | `document_categories[].document_types[].id` | integer | Internal type
        ID |

        | `document_categories[].document_types[].uuid` | string | Type UUID —
        maps to YML reference tables |

        | `document_categories[].document_types[].name_on_frontend` | string |
        Frontend key |

        | `document_categories[].document_types[].issue_date_req` | boolean |
        `true` = issue date field required during upload |

        | `document_categories[].document_types[].expiry_date_req` | boolean |
        `true` = expiry date field required during upload |

        | `document_categories[].kyc_document` | object/null | `null` = not yet
        uploaded; object with `status` if uploaded |


        ## Next Step

        For each required category, call **Step 15** — Upload KYC Document.
      parameters:
