  /api/v3/merchants/{mid}/kyc_document:
    post:
      summary: UploadKYCDocument
      operationId: UploadKYCDocument
      tags:
        - Step 15 — Upload KYC Documents
      security:
        - BearerAuth: []
      description: >
        # Upload KYC Document — Step 15 of 16


        Call this **once per required document category** from Step 14.


        ## Endpoint


        `POST /api/v3/merchants/{mid}/kyc_document`


        ## Request Body (multipart/form-data)


        | Parameter | Type | Required | Source | Description |

        |-----------|------|----------|--------|-------------|

        | `merchant[document_category]` | string | Yes | Step 14 →
        `document_categories[i].name` | Exact category name |

        | `merchant[document_type]` | string | Yes | Step 14 →
        `document_categories[i].document_types[j].name` | Exact type name |

        | `merchant[processed_document]` | file | Yes | Merchant upload |
        JPG/PNG/PDF, max 5 MB |


        ## Response (200 OK)


        ```json

        {
            "merchant": {
                "mid": "8390925",
                "kyc_document_name": "PAN Card of Signing Authority",
                "kyc_document_uuid": "11ef-587e-4383...",
                "kyc_document_status": "DOCUMENT_SUBMITTED",
                "error_message": null,
                "created_at": "2024-08-12T07:41:19.000Z"
            }
        }

        ```


        ## Error Handling


        | Error Code | Cause | Recovery |

        |------------|-------|----------|

        | `422` - "Invalid document category" | category doesn't match Step 14 |
        Re-fetch Step 14, use exact `name` |

        | `422` - "File too large" | Exceeds 5 MB | Compress before uploading |

        | `422` - "Unsupported format" | Not JPG/PNG/PDF | Convert to accepted
        format |


        ## Next Step

        After all documents uploaded, proceed to **Step 16** — E-Sign Agreement.
