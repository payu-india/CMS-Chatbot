  /api/v1/merchants/{merchant_id}:
    get:
      summary: GetMerchant
      operationId: GetMerchant
      tags:
        - Utilities
      security:
        - BearerAuth: []
      description: >
        # GetMerchant — Status Polling (Utility)


        Retrieves the complete merchant profile and all internal verification
        statuses. Call this **between any steps** to check progress.


        ## Endpoint


        `GET /api/v1/merchants/{merchant_id}`


        Replace `{merchant_id}` with the numeric `mid` from Step 01.


        ## Key Status Fields to Check


        | Field | After Step | Values | Decision |

        |-------|-----------|--------|----------|

        | `pan_verification_status` | Step 02 | `verified` / `failed` /
        `pending` | Wait for verification before Step 03 |

        | `bank_verification_status` | Step 05 | `verified` / `failed` /
        `pending` | `verified` → skip Step 06; else → do Step 06 |

        | `ckyc_status` | Step 03 | `success` / `failed` / `pending` |
        Determines DigiLocker requirement (Step 09) |

        | `digilocker_status` | Step 09 | `verified` / `pending` / `failed` |
        Track completion |

        | `vkyc_status` | Step 11 | `not_initiated` / `in_progress` / `approved`
        / `declined` | Track VKYC |

        | `kyc_document_status` | Step 15 | Per-document status | Check
        approvals/rejections |

        | `agreement_status` | Step 16 | `pending` / `signed` / `expired` |
        Track e-sign |

        | `activation_status` | Final | `active` / `pending` / `rejected` |
        Merchant ready |


        ## Usage Pattern


        ```

        After each step:
          1. Call GetMerchant
          2. Check relevant status field
          3. IF status = expected → proceed to next step
          4. IF status = failed → handle error (retry, re-upload, etc.)
          5. IF status = pending → poll again after delay
        ```
      parameters:
        - name: merchant_id
          in: path
          required: true
          schema:
            type: string
            example: 8390925 or 11ef-d968-6b042d6c-9b94-02975f21d323
          description: '`string` — Numeric `mid` (or UUID where supported) from Step 01'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token obtained via OAuth 2.0 (POST /oauth/token)
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://test-accounts.payu.in/oauth/token
          scopes:
            refer_merchant: Merchant referral operations
            client_manage_agreement: Manage merchant agreements
            client_manage_kyc_details: Manage KYC details
      description: OAuth 2.0 authentication flow
  schemas: {}
security:
  - BearerAuth: []
tags:
  - name: Step 00 — Authentication
    description: >
      # Step 00 — Authentication (OAuth Token)


      Before calling any onboarding API, obtain a bearer token from PayU's OAuth
      endpoint.


      ## Environments


      | Environment | URL |

      |-------------|-----|

      | Test | `https://test-accounts.payu.in/oauth/token` |

      | Production | `https://accounts.payu.in/oauth/token` |


      ## Token Lifecycle


      - Tokens expire after `expires_in` seconds (typically 7200 = 2 hours)

      - Implement refresh logic — do not request a new token per API call

      - Store tokens server-side only


      ## Scopes


      | Scope | Purpose |

      |-------|---------|

      | `refer_merchant` | Create and manage merchant accounts (Steps 01-13) |

      | `client_manage_kyc_details` | KYC documents and verification (Steps 03,
      06, 09, 11, 14, 15) |

      | `client_manage_agreement` | Agreement management (Step 16) |
  - name: Step 01 — Create Merchant
    description: >
      # Step 01 — Create Merchant


      Creates a new merchant account on PayU. Returns `mid` and `uuid`
      identifiers used in all subsequent steps.


      ## Prerequisite Steps

      - Step 00 (Authentication) — valid bearer token required


      ## Entity Applicability

      **All entities** — this is always the first onboarding step.


      ## Important

      - Only `display_name`, `email`, and `mobile` are sent here

      - **Do NOT send `business_entity_type` in this step** — it is set in Step
      02

      - `email` must be unique across PayU — duplicate emails are rejected

      - Store both `mid` and `uuid` from the response — different APIs require
      different identifiers
  - name: 'Step 02 — Update: PAN + DOB'
    description: >
      # Step 02 — Update Merchant: PAN + DOB


      Sets the merchant's PAN details and date of birth/incorporation. The
      entity type is already set in Step 01 (Create Merchant) — determining
      which steps are required, which CKYC method to use, and which documents to
      upload.


      ## Prerequisite Steps

      - Step 01 (Create Merchant) — `uuid` required from response


      ## Entity Applicability

      **All entities**


      ## Allowed Entity Types


      | Entity Type | CKYC Method | CIN Required | UBO Required | Business
      Members | DigiLocker |

      |-------------|-------------|--------------|--------------|------------------|------------|

      | Individual | OTP | No | No | No | Skip if CKYC ok |

      | Sole Proprietorship | OTP | No | No | No | Skip if CKYC ok |

      | Partnership | Fetch | No | Yes | Yes | Always |

      | Pvt Ltd | Fetch | **Yes** | Yes | Yes | Always |

      | Public Limited | Fetch | **Yes** | Yes | Yes | Always |

      | LLP | Fetch | No | Yes | Yes | Always |

      | Trust | Fetch | No | Yes | No | Always |

      | Society | Fetch | No | Yes | No | Always |

      | One Person Company | Fetch | **Yes** | No | No | Always |

      | Government | Fetch | No | No | No | Always |

      | NGO | Fetch | No | No | No | Always |

      | Hindu Undivided Family | Fetch | No | No | No | Always |
  - name: Step 03 — CKYC Verification
    description: >
      # Step 03 — CKYC (Central KYC) Verification


      Central KYC verification using data from the CKYC registry (CERSAI). The
      method depends on entity type.


      ## Prerequisite Steps

      - Step 02 (PAN + Entity) — PAN must be submitted and entity type set


      ## Entity Applicability

      **All entities** — but the method differs:


      ## Branching Logic


      ```

      IF entity_type IN (Individual, Sole Proprietorship):
          1. Call "Send CKYC OTP" (Sub-request A) — consent: true + mobile required
          2. Merchant receives OTP on mobile
          3. Call "Verify CKYC OTP" (Sub-request B) — with the OTP
      ELSE (Partnership, Pvt Ltd, Public Limited, LLP, Trust, Society, One
      Person Company, etc.):
          1. Call "Fetch CKYC Data" (Sub-request C) — consent: true, fetches directly via PAN
      ```


      ## Skip CKYC


      > **COMING SOON:** A dedicated "Skip CKYC" API is being developed and will
      be available shortly. Until then, CKYC must be attempted for all
      merchants.

      >

      > **Impact of skipping CKYC:** If CKYC is skipped (once the API is
      available), DigiLocker (Step 09) becomes **mandatory even for
      Individual/Sole Prop** entities. If CKYC succeeds for Individual/Sole
      Prop, DigiLocker can be skipped.


      ## CKYC Response Data (on success)

      - Name

      - Date of Birth / Date of Incorporation

      - Address (city, state, pincode)

      - Masked mobile number


      ## Downstream Impact


      | CKYC Outcome | Entity Type | DigiLocker (Step 09) |

      |-------------|-------------|---------------------|

      | Succeeded | Individual / Sole Prop | **Optional** (can skip) |

      | Succeeded | All others | **Required** |

      | Skipped | Individual / Sole Prop | **Required** |

      | Skipped | All others | **Required** |
  - name: 'Step 04 — Update: Business Details'
    description: >
      # Step 04 — Update Merchant: Business Details


      Adds business category, sub-category, expected volume, GST, business name,
      and CIN (for eligible entities).


      ## Prerequisite Steps

      - Step 02 (PAN + Entity) — entity type must be set

      - Step 03 (CKYC) — should be attempted before this step


      ## Entity Applicability

      **All entities.** CIN is conditional:

      - `cin_number` required for: **Pvt Ltd, Public Limited, One Person
      Company**

      - `cin_number` NOT required for: Individual, Sole Prop, Partnership, LLP,
      Trust, Society
  - name: 'Step 05 — Update: Bank Details'
    description: >
      # Step 05 — Update Merchant: Bank Details


      Adds bank account details for settlement. PayU attempts
      **auto-verification** of the bank account. If auto-verification fails,
      proceed to Step 06 to upload bank proof manually.


      ## Prerequisite Steps

      - Step 04 (Business Details)


      ## Entity Applicability

      **All entities**


      ## Auto-Verification

      After this call, PayU automatically verifies the bank account via penny
      drop or IFSC validation. Check the result using **GetMerchant**
      (Utilities) → look for `bank_verification_status`.


      - If `bank_verification_status` = `verified` → skip Step 06, proceed to
      Step 07

      - If `bank_verification_status` = `failed` or `pending` → proceed to Step
      06 (upload bank proof)
  - name: Step 06 — Upload Bank Proof (Conditional)
    description: >
      # Step 06 — Upload Bank Proof (Conditional)


      Upload bank account proof document if auto-verification from Step 05
      failed.


      ## Prerequisite Steps

      - Step 05 (Bank Details) — bank auto-verification must have failed

      - Check via GetMerchant → `bank_verification_status` = `failed` or
      `pending`


      ## Entity Applicability

      **All entities** — but only if bank auto-verification fails.


      ## Accepted Bank Proof Documents


      | Document Type | UUID |

      |---------------|------|

      | Cancelled Cheque | `ca0a-9047-28d705a1-7e97-b530fbec4c41` |

      | Bank Verification Letter | `f912-b658-610ce46f-796b-14a515e41ad7` |

      | Bank Statement | `11eb-d01a-8322997a-adc5-0242a53cdb42` |

      | Passbook | `11eb-d01a-456b15f8-adc5-0242a53cdb42` |


      Document Category: **Bank Account Proof** (UUID:
      `11e8-748f-297c6048-9081-020aca9875be`)
  - name: 'Step 07 — Update: Website Details'
    description: |
      # Step 07 — Update Merchant: Website Details

      Adds the merchant's website URL and/or mobile app store URLs.

      ## Prerequisite Steps
      - Step 05 (Bank Details) or Step 06 (Bank Proof)

      ## Entity Applicability
      **All entities**
  - name: Step 08 — Add Signatory Details
    description: >
      # Step 08 — Add Signatory Details


      Adds the authorised signatory who will sign the merchant agreement (Step
      16).


      ## Prerequisite Steps

      - Step 07 (Website Details)


      ## Entity Applicability

      **All entities**


      ## Important


      - This step is a **prerequisite for DigiLocker** (Step 09) — DigiLocker
      cannot succeed without signatory details

      - The **CIN field** in signatory details is **only for CIN-eligible
      entities**: Pvt Ltd, Public Limited, One Person Company

      - Do NOT send CIN in signatory details for other entity types
  - name: Step 09 — DigiLocker Verification
    description: >
      # Step 09 — DigiLocker Verification


      Aadhaar-based identity verification via DigiLocker (MeitY). Generates an
      authentication URL; merchant authenticates with Aadhaar OTP, and documents
      flow to PayU.


      ## Prerequisite Steps

      - **Step 08 (Signatory Details) — MUST be completed.** DigiLocker will
      fail without signatory details.


      ## Entity Applicability & Branching


      ```

      IF entity_type IN (Individual, Sole Proprietorship):
          IF CKYC (Step 03) succeeded:
              DigiLocker = OPTIONAL — can be SKIPPED
          ELSE (CKYC was skipped or failed):
              DigiLocker = REQUIRED
      ELSE (Partnership, Pvt Ltd, Public Limited, LLP, Trust, Society, One
      Person Company, etc.):
          DigiLocker = ALWAYS REQUIRED — even if CKYC succeeded
      ```


      ## How to Determine if DigiLocker is Needed

      Call **GetMerchant** (Utilities) and check:

      - `entity_type` — Individual/Sole Prop or other

      - `ckyc_status` — whether CKYC succeeded


      ## Flow

      1. Partner calls this API with `consent: true`

      2. PayU returns a DigiLocker authentication URL

      3. Partner redirects merchant to that URL

      4. Merchant authenticates on DigiLocker with Aadhaar OTP

      5. Documents flow from DigiLocker directly to PayU

      6. Merchant is redirected back to partner's pre-configured URL
  - name: 'Step 10 — Update: Addresses'
    description: |
      # Step 10 — Update Merchant: Registration & Operating Addresses

      Adds both the registered business address and operating/office address.

      ## Prerequisite Steps
      - Step 09 (DigiLocker) or skipped per branching rules

      ## Entity Applicability
      **All entities**
  - name: Step 11 — Video KYC (VKYC)
    description: >
      # Step 11 — Video KYC


      Creates a VKYC (Video Customer Identification Process) profile and
      generates a video call link.


      ## Prerequisite Steps

      - Step 10 (Addresses)


      ## Entity Applicability

      **All entities** — VKYC is triggered by PayU based on entity type and risk
      profile. Merchants can opt to skip.


      ## VKYC Statuses

      `not_initiated` → `in_progress` → `approved` | `declined`
  - name: Step 12 — Add/Update UBO
    description: >
      # Step 12 — Add/Update UBO (Ultimate Beneficial Owner)


      Submits UBO details. UBOs are individuals who own or control 25%+ of the
      business.


      ## Prerequisite Steps

      - Step 11 (VKYC)


      ## Entity Applicability

      **ONLY for:** Private Limited, Public Limited, Partnership, Trust, LLP,
      Society


      **NOT required for:** Individual, Sole Proprietorship, One Person Company,
      Government, NGO, Hindu Undivided Family


      Multiple UBOs can be submitted using array indexing: `ubo[0]`, `ubo[1]`,
      etc.
