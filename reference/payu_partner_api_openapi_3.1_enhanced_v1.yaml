      description: >-
        # Delete KYC Document API


        Deletes an already uploaded KYC document for a merchant.


        ## Endpoint

        `DELETE
        /api/v3/merchants/{merchant_id}/kyc_document/{kyc_document_uuid}`


        ## Base URL

        - Test: `https://test-partner.payu.in`

        - Production: `https://partner.payu.in`


        ## Auth

        - Header: `Authorization: Bearer {access_token}`

        - Required scope: `client_manage_kyc_details`


        ## Path Parameters

        - `merchant_id` (required): MID

        - `kyc_document_uuid` (required): UUID returned by Create KYC Document
        API response at `merchant.kyc_document_uuid`


        ## Success Response

        - `204 No Content`


        ## Error Responses

        - `404` when document UUID does not exist for the merchant (example:
        `{"document":"does not exist"}`)

        - `401/403` auth or permission issues


        ## Integration Sequence

        1. Call `required_docs` to identify valid category/type.

        2. Upload via Create KYC Document API.

        3. Persist `merchant.kyc_document_uuid`.

        4. Use that UUID in Delete KYC Document API when document removal is
        needed.
