  - name: Step 14 — Fetch Required KYC Documents
    description: >
      # Step 14 — Fetch Required KYC Documents


      Retrieves the list of document categories and accepted document types
      required for this merchant. **The response from this API is the input for
      Step 15 (Upload KYC Documents).**


      ## Prerequisite Steps

      - All prior steps relevant to the entity type


      ## Entity Applicability

      **All entities** — but the required document list differs per entity type.


      ## How to Use the Response


      1. Call this API → get list of `document_categories[]`

      2. Each category has a `uuid`, `name`, and `document_types[]` array

      3. Each document_type has a `uuid` and `name`

      4. In **Step 15**, use the category `name` as
      `merchant[document_category]` and the type `name` as
      `merchant[document_type]`

      5. Upload one document per required category


      ## Response → Step 15 Mapping


      ```

      Step 14 Response:                          Step 15 Request:

      ─────────────────                          ────────────────

      document_categories[i].name           →    merchant[document_category]

      document_categories[i].document_types[j].name  →  merchant[document_type]

      ```


