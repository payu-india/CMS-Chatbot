        |-------|------|----------|------------|-------------|

        | `name` | string | Yes | Non-empty | Full name |

        | `designation` | string | Yes | Director, Partner, Designated Partner,
        etc. | Role |

        | `doj` | string | Yes | `MM/YYYY` | Date of joining |

        | `dob` | string | Yes | `DD/MM/YYYY` | Date of birth |

        | `pincode` | string | Yes | 6 digits | Pincode |

        | `pan_number` | string | Yes | `ABCDE1234F` | PAN number |




        ## Response Fields (200 OK)


