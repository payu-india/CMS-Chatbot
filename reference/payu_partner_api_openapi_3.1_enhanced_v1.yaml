        Returns all currently persisted business members for a merchant.


        ## Endpoint

        `GET /api/v1/merchants/{product_account_uuid}/list_business_members`


        ## Base URL

        - Test: `https://test-partner.payu.in`

        - Production: `https://partner.payu.in`


        ## Auth

        - Header: `Authorization: Bearer {access_token}`

        - Required scope: `refer_merchant`


        ## Path Parameter

        - `product_account_uuid` (string, required): Merchant UUID.


        ## Success Response

        - `200 OK`


        ```json

        {
          "data": [
            {
              "id": 3471,
              "uuid": "11f1-28f2-7068d69c-879e-02f4a48620c1",
              "name": "Test CEO Flow",
              "designation": "CEO",
              "date_of_birth": "1990-08-15",
              "pan_number": "AVGPL0693P",
              "date_of_joining": "03/2026",
              "active": true
            }
          ]
        }

        ```


        ## Empty State

        - `200 OK` with `data: []` when no members exist.


        ## Common Errors

        - `404` when UUID is invalid or reseller is not allowed to access that
        merchant.

        - `401/403` auth or permission issues.


        ## Recommended Usage

        Use this API as the source of truth after every submit/delete member
        action.
