openapi: 3.1.0
info:
  title: Partner API - Public Entity Copy 2
  version: 1.0.0
  description: >
    # PayU Partner Onboarding APIs — Complete 16-Step Specification


    A complete set of white-label APIs that let partners onboard merchants onto
    PayU entirely from their own platform. Partners call APIs, PayU validates,
    verifies, and activates. PayU remains the system of record.


    ## Architecture


    ```

    MERCHANT ──(browser/app)──> PARTNER BACKEND ──(API)──> PAYU BACKEND
                                                   <──(webhook)──
    ```


    All API calls are **server-to-server**. Never expose your bearer token to
    the browser.


    ## Environments


    | Environment | Auth URL | Partner API URL |

    |-------------|----------|-----------------|

    | Test | `https://test-accounts.payu.in` | `https://test-partner.payu.in` |

    | Production | `https://accounts.payu.in` | `https://partner.payu.in` |


    ## Authentication


    All requests require a bearer token obtained via OAuth (`POST
    /oauth/token`).


    | Header | Value |

    |--------|-------|

    | `Authorization` | `Bearer {token}` |

    | `Content-Type` | `application/json` or `multipart/form-data` (file
    uploads) |


    ## The 16-Step Onboarding Sequence


    This sequence **must be followed exactly**. Each step depends on the
    previous one.


    | Step | Name | Endpoint | Entities | Notes |

    |------|------|----------|----------|-------|

    | 01 | Create Merchant | `POST /api/v3/merchants` | All | Returns `mid` +
    `uuid`. Entity type set here. |

    | 02 | Update: PAN + DOB | `PUT /api/v1/merchants/{uuid}/update` | All |
    PAN, DOB/DOI |

    | 03 | CKYC Verification | `POST .../send_ckyc_otp` or `.../ckyc_data` | All
    | OTP for Individual/Sole Prop; Fetch for others |

    | 04 | Update: Business Details | `PUT /api/v1/merchants/{uuid}/update` |
    All | Category, GST, CIN (if eligible) |

    | 05 | Update: Bank Details | `PUT /api/v1/merchants/{uuid}/update` | All |
    Auto-verification attempted |

    | 06 | Upload Bank Proof | `POST /api/v3/merchants/{mid}/kyc_document` | All
    (conditional) | Only if bank auto-verification fails |

    | 07 | Update: Website Details | `PUT /api/v1/merchants/{uuid}/update` | All
    | Website, Android, iOS URLs |

    | 08 | Add Signatory Details | `POST
    /api/v1/merchants/{uuid}/add_bank_detail` | All | Prerequisite for
    DigiLocker |

    | 09 | DigiLocker Verification | `POST .../generate_digilocker_link` |
    Conditional | See branching rules below |

    | 10 | Update: Addresses | `PUT /api/v1/merchants/{uuid}/update` | All |
    Registration + Operating |

    | 11 | Video KYC | `POST .../create_vkyc_profile` | All | Can be skipped |

    | 12 | Add/Update UBO | `POST /api/v1/merchants/{uuid}/add_bank_detail` |
    Pvt Ltd, Public Ltd, Partnership, Trust, LLP, Society | Not for
    Individual/Sole Prop |

    | 13 | Business Members & KMP | `PUT
    /api/v1/merchants/{uuid}/submit_business_members` | Pvt Ltd, Public Ltd,
    Partnership, LLP | Not for Individual/Sole Prop/Trust/Society |

    | 14 | Fetch Required KYC Docs | `GET
    /api/v3/merchants/{mid}/kyc_document/required_docs` | All | Response feeds
    into Step 15 |

    | 15 | Upload KYC Documents | `POST /api/v3/merchants/{mid}/kyc_document` |
    All | One call per required doc category |

    | 16 | E-Sign Agreement | `GET .../generate_merged_document_for_esign` | All
    | Final step — merchant activated |


    ## Entity-Step Applicability Matrix


    | Step | Individual | Sole Prop | Partnership | Pvt Ltd | Public Ltd | LLP |
    Trust | Society | One Person Co |

    |------|-----------|-----------|-------------|---------|------------|-----|-------|---------|---------------|

    | 01-02 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |

    | 03 CKYC | OTP flow | OTP flow | Fetch flow | Fetch flow | Fetch flow |
    Fetch flow | Fetch flow | Fetch flow | Fetch flow |

    | 04-05 | Yes | Yes | Yes | Yes (+ CIN) | Yes (+ CIN) | Yes | Yes | Yes |
    Yes (+ CIN) |

    | 06 | If bank fails | If bank fails | If bank fails | If bank fails | If
    bank fails | If bank fails | If bank fails | If bank fails | If bank fails |

    | 07-08 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |

    | 08 CIN field | No | No | No | Yes | Yes | No | No | No | Yes |

    | 09 DigiLocker | Skip if CKYC ok | Skip if CKYC ok | Required | Required |
    Required | Required | Required | Required | Required |

    | 10-11 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |

    | 12 UBO | No | No | Yes | Yes | Yes | Yes | Yes | Yes | No |

    | 13 Biz Members | No | No | Yes | Yes | Yes | Yes | No | No | No |

    | 14-16 | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes | Yes |


    ## DigiLocker Branching Rules (Step 09)


    ```

    IF entity_type IN (Individual, Sole Proprietorship):
        IF CKYC (Step 03) succeeded:
            DigiLocker = OPTIONAL (can skip)
        ELSE IF CKYC was skipped:
            DigiLocker = REQUIRED
    ELSE (all other entity types):
        DigiLocker = ALWAYS REQUIRED (even if CKYC succeeded)

    PREREQUISITE: Step 08 (Signatory Details) must be completed before
    DigiLocker.

    ```


    ## Key Identifiers


    | Identifier | Source | Format | Used In Steps |

    |------------|--------|--------|---------------|

    | `mid` | Step 01 response | Numeric (e.g., `8390925`) | 06, 09, 14, 15 (KYC
    doc APIs) |

    | `uuid` | Step 01 response | UUID (e.g.,
    `11ef-d968-6b042d6c-9b94-02975f21d323`) | 02, 04, 05, 07, 08, 10, 12, 13, 16
    |

    | `product_account_uuid` | Step 01 response | UUID | 16 (E-Sign) |


    ## Error Codes Reference


    | Code | Meaning | Recovery |

    |------|---------|----------|

    | `200` | Success | Process response |

    | `201` | Created | Resource created |

    | `204` | No Content | Deletion successful |

    | `400` | Bad Request | Check parameters |

    | `401` | Unauthorized | Token invalid/expired — call Step 00 again |

    | `403` | Forbidden | No access to this merchant |

    | `404` | Not Found | Check `uuid`, `mid`, or `merchant_id` |

    | `422` | Validation Failed | Read error message — it says exactly what's
    wrong |

    | `429` | Rate Limited | Back off and retry |

    | `500` | Server Error | Retry with exponential backoff |


    ## Utilities


    The **GetMerchant** API (`GET /api/v1/merchants/{merchant_id}`) can be
    called **at any point** between steps to check internal statuses: PAN
    verification, bank verification, CKYC status, DigiLocker status, VKYC
    status, document verification, agreement status, and overall onboarding
    stage. See the Utilities folder.


    ## References


    - [PayU Partner Program
    Overview](https://docs.payu.in/docs/payu-partner-program-overview)

    - [Onboarding APIs
    Reference](https://docs.payu.in/reference/onboarding-apis)

    - [Documents
    Checklist](https://docs.payu.in/docs/documents-checklist-for-account-activation)



    ## Discovered During Live Testing (March 2026)


    1. **CreateMerchant requires `merchant[product]=PayUbiz`** — without it, a
    MySQL duplicate entry error occurs. The `business_entity_type` is also
    required at creation time (despite initial assumption it could be deferred
    to Step 02). The entity type can be changed in Step 02 via the Update API.

    3. **VKYC requires signatory details** — calling VKYC before adding
    signatory returns: `Please complete (Signing authority details captured
    step) before initiating VKYC`.



    ## Learnings from Live Merchant (mid: 760070179, Private Limited, status:
    live)


    ### Successful API Responses Captured

    - **VKYC**: Returns `capture_link` even for already-approved merchants
    (generates new VCIP link)

    - **DigiLocker**: Returns `"Digilocker KYC is already completed"` if already
    done — idempotent check

    - **Required Docs**: For a live Private Limited, returns 5 remaining
    categories (some already `Approved`). The `kyc_document` field is `null` for
    pending, or contains `{"status": "Approved"}` for uploaded docs.

    - **Show KYC Document**: Returns full document details including `doc_url`
    (signed S3 URL), `document_category_name`, `document_type_name`, `status`

    - **Upload KYC Document (no file)**: Returns `{"error": {"document": "must
    be present"}}` — file is mandatory

    - **GetMerchant (live)**: Shows `status: live`, all verifications
    `Success`/`approved`, `settlement_status: Active`, `agreement_status:
    Approved`


    ### API Constraints Discovered


    ### E-Sign Correct Endpoint (Discovered March 2026)

    - **URL:** `GET /api/v1/merchants/{uuid}/generate_merged_document_for_esign`
    on `test-partner.payu.in`

    - **Scope:** `refer_merchant` + at least one of (`client_manage_agreement`
    or `client_manage_kyc_details`). `refer_merchant` alone returns `401`.
servers:
  - url: https://test-accounts.payu.in
    description: Authentication Server (Test)
  - url: https://test-partner.payu.in
    description: Test/Sandbox Environment
  - url: https://partner.payu.in
    description: Production Environment
paths:
  /api/v3/merchants:
    post:
      summary: Create Merchant API
      operationId: CreateMerchant
      tags:
        - Step 01 — Create Merchant
      security:
        - BearerAuth: []
      description: ''
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[display_name]:
                  type: string
                  description: '`string` — Business or display name'
                merchant[email]:
                  type: string
                  description: '`string` — Unique merchant email across PayU'
                merchant[mobile]:
                  type: string
                  description: '`string` — Exactly 10-digit Indian mobile number'
                merchant[product]:
                  type: string
                  description: >-
                    `string` — Must be `PayUbiz` (required to avoid backend
                    errors)
                merchant[business_details][business_entity_type]:
                  type: string
                  description: >-
                    `string` — Entity type; determines CKYC method and later
                    steps
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v1/merchants/{uuid_pan}/update:
    put:
      summary: Update Merchant Details API
      operationId: UpdateMerchant_PAN_DOB_Entity
      tags:
        - 'Step 02 — Update: PAN + DOB'
      security:
        - BearerAuth: []
      description: ''
      parameters:
        - name: uuid_pan
          in: path
          required: true
          schema:
            type: string
            example: 11ef-d968-6b042d6c-9b94-02975f21d323
          description: >-
            Merchant UUID from Step 01. Runtime path is
            `/api/v1/merchants/{uuid}/update`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[pancard_number]:
                  type: string
                  description: '`string` — PAN in `ABCDE1234F` format'
                merchant[pancard_name]:
                  type: string
                  description: '`string` — Name on PAN card (must match registry)'
                merchant[dob]:
                  type: string
                  description: >-
                    `string` — DOB (Individual) or date of incorporation
                    (`YYYY-MM-DD`)
            example:
              merchant[pancard_number]: ABCDE1234F
              merchant[pancard_name]: MERCHANT LEGAL NAME
              merchant[dob]: '2000-01-06'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants/kyc_document/send_ckyc_otp:
    post:
      summary: A. Send CKYC OTP API (Individual / Sole Prop)
      operationId: SendCkycOtp
      tags:
        - Step 03 — CKYC Verification
      security:
        - BearerAuth: []
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              merchant_id: '{{mid}}'
              mobile: '{{merchant_mobile}}'
              consent: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants/kyc_document/verify_ckyc_otp:
    post:
      summary: B. Verify CKYC OTP API (Individual / Sole Prop)
      operationId: VerifyCkycOtp
      tags:
        - Step 03 — CKYC Verification
      security:
        - BearerAuth: []
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              merchant_id: '{{mid}}'
              otp: '123456'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants/kyc_document/ckyc_data:
    post:
      summary: C. Fetch CKYC Data API (Non-Individual Entities)
      operationId: FetchCkycData
      tags:
        - Step 03 — CKYC Verification
      security:
        - BearerAuth: []
      description: ''
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              merchant_id: '{{mid}}'
              consent: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v1/merchants/{uuid_business}/update:
    put:
      summary: Update Business Details API
      operationId: UpdateMerchant_BusinessDetails
      tags:
        - 'Step 04 — Update: Business Details'
      security:
        - BearerAuth: []
      description: ''
      parameters:
        - name: uuid_business
          in: path
          required: true
          schema:
            type: string
            example: 11ef-d968-6b042d6c-9b94-02975f21d323
          description: >-
            Merchant UUID from Step 01. Runtime path is
            `/api/v1/merchants/{uuid}/update`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[business_category]:
                  type: string
                  description: '`string` — Business category'
                merchant[business_sub_category]:
                  type: string
                  description: '`string` — Business sub-category'
                merchant[monthly_expected_volume]:
                  type: string
                  description: '`string` — Expected monthly volume'
                merchant[gst_number]:
                  type: string
                  description: '`string` — GSTIN when available'
                merchant[gst_consent]:
                  type: string
                  description: '`string` — GST consent (`true` / `false`)'
                merchant[business_name]:
                  type: string
                  description: '`string` — Legal / business name'
                merchant[cin_number]:
                  type: string
                  description: '`string` — Required for Pvt Ltd, Public Ltd, OPC'
            example:
              merchant[business_category]: Arts, Gifts & Stationery
              merchant[business_sub_category]: Art Dealers and Galleries
              merchant[monthly_expected_volume]: '500000'
              merchant[gst_number]: 29ABCDE1234F1Z5
              merchant[gst_consent]: 'true'
              merchant[business_name]: MERCHANT BUSINESS NAME
              merchant[cin_number]: U74999KA2020PTC123456
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v1/merchants/{uuid_bank}/update:
    put:
      summary: Update Bank Details API
      operationId: UpdateMerchant_BankDetails
      tags:
        - 'Step 05 — Update: Bank Details'
      security:
        - BearerAuth: []
      description: >
        # UpdateMerchant: Bank Details — Step 05 of 16


        Adds bank account for settlements. Auto-verification is attempted.


        ## Endpoint


        `PUT /api/v1/merchants/{uuid}/update`


        ## Request Body (form-data)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant[bank_detail][bank_account_number]` | string | Yes | Numeric
        string | Bank account number |

        | `merchant[bank_detail][holder_name]` | string | Yes | Non-empty |
        Account holder name |

        | `merchant[bank_detail][ifsc_code]` | string | Yes | Regex:
        `^[A-Z]{4}0[A-Z0-9]{6}$` | 11-character IFSC code |


        ## Post-Call: Check Bank Verification


        Call **GetMerchant** (Utilities folder) to check
        `bank_verification_status`:

        - `verified` → **Skip Step 06**, proceed to Step 07

        - `failed` / `pending` → Proceed to **Step 06** (upload bank proof)


        ## Error Handling


        | Error Code | Cause | Recovery |

        |------------|-------|----------|

        | `422` - "IFSC is invalid" | Not valid 11-char IFSC | Verify IFSC code
        |

        | `422` - "Account number is invalid" | Bad format | Check account
        number |


        ## Next Step

        - If bank verified → **Step 07** (Website Details)

        - If bank NOT verified → **Step 06** (Upload Bank Proof)



        > **API path:** `PUT /api/v1/merchants/{uuid}/update` — use the merchant
        `uuid` from Step 01 in the path. (OpenAPI uses a distinct path-parameter
        name on this page so ReadMe can import multiple Update-Merchant step
        groups that share the same HTTP method and path.)
      parameters:
        - name: uuid_bank
          in: path
          required: true
          schema:
            type: string
            example: 11ef-d968-6b042d6c-9b94-02975f21d323
          description: >-
            Merchant UUID from Step 01. Runtime path is
            `/api/v1/merchants/{uuid}/update`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[bank_detail][bank_account_number]:
                  type: string
                  description: '`string` — Settlement account number'
                merchant[bank_detail][holder_name]:
                  type: string
                  description: '`string` — Account holder name'
                merchant[bank_detail][ifsc_code]:
                  type: string
                  description: '`string` — Bank IFSC code'
            example:
              merchant[bank_detail][bank_account_number]: '1234567890'
              merchant[bank_detail][holder_name]: ACCOUNT HOLDER NAME
              merchant[bank_detail][ifsc_code]: SBIN0001234
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants/{mid_bank_proof}/kyc_document:
    post:
      summary: Upload Bank Proof API
      operationId: UploadBankProof
      tags:
        - Step 06 — Upload Bank Proof (Conditional)
      security:
        - BearerAuth: []
      description: ''
      parameters:
        - name: mid_bank_proof
          in: path
          required: true
          schema:
            type: string
            example: '8390925'
          description: >-
            Numeric merchant ID (`mid`) from Step 01. Runtime path is
            `/api/v3/merchants/{mid}/kyc_document`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[document_category]:
                  type: string
                  description: '`string` — Use `Bank Account Proof`'
                merchant[document_type]:
                  type: string
                  description: >-
                    `string` — e.g. `Cancelled Cheque`, `Bank Statement`,
                    `Passbook`
                merchant[processed_document]:
                  type: string
                  format: binary
                  description: '`file` — JPG/PNG/PDF, max 5 MB'
            example:
              merchant[document_category]: Bank Account Proof
              merchant[document_type]: Cancelled Cheque
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v1/merchants/{uuid_website}/update:
    put:
      summary: Update Website Details API
      operationId: UpdateMerchant_WebsiteDetails
      tags:
        - 'Step 07 — Update: Website Details'
      security:
        - BearerAuth: []
      description: ''
      parameters:
        - name: uuid_website
          in: path
          required: true
          schema:
            type: string
            example: 11ef-d968-6b042d6c-9b94-02975f21d323
          description: >-
            Merchant UUID from Step 01. Runtime path is
            `/api/v1/merchants/{uuid}/update`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                merchant[website_details][website_url]:
                  type: string
                  description: '`string` — Merchant website URL'
                merchant[website_details][android_url]:
                  type: string
                  description: '`string` — Android app store URL'
                merchant[website_details][ios_url]:
                  type: string
                  description: '`string` — iOS App Store URL'
            example:
              merchant[website_details][website_url]: https://www.example.com
              merchant[website_details][android_url]: https://play.google.com/store/apps/details?id=com.example
              merchant[website_details][ios_url]: https://apps.apple.com/app/example/id123456
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v1/merchants/{uuid_signatory}/signatory_details:
    put:
      summary: Add Signatory Details API
      operationId: AddSignatoryDetails
      tags:
        - Step 08 — Add Signatory Details
      security:
        - BearerAuth: []
      description: >
        # Add Signatory Details — Step 08 of 16


        Submits the authorised signatory for the merchant agreement.


        ## Endpoint


        `PUT /api/v1/merchants/{uuid}/signatory_details`


        ## Prerequisite Steps

        - Step 07: Website details submitted


        ## Entity Applicability

        **All entities**


        ## Request Body (x-www-form-urlencoded)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant[signatory_...[0][authorised_signatory]]` | string | Yes |
        `"true"` | Marks as authorised signatory |

        | `merchant[signatory_...[0][name]]` | string | Yes | Non-empty | Full
        legal name |

        | `merchant[signatory_...[0][pancard_number]]` | string | Yes |
        `ABCDE1234F` | Signatory PAN |

        | `merchant[signatory_...[0][email]]` | string | Yes | Valid email |
        E-sign OTPs sent here |

        | `merchant[signatory_...[0][contact_detail_type]]` | string | Yes |
        `"Signing Authority"` | Contact type |

        | `merchant[signatory_...[0][cin_number]]` | string | Conditional | 21
        chars | **ONLY for: Pvt Ltd, Public Limited, One Person Company** |


        ## CIN Field Eligibility in Signatory


        | Entity Type | Send CIN? |

        |-------------|-----------|

        | Pvt Ltd | **Yes** |

        | Public Limited | **Yes** |

        | One Person Company | **Yes** |

        | All others | **No** — omit this field entirely |


        ## Critical: Prerequisite for Step 09


        **DigiLocker (Step 09) will fail if signatory details are not
        submitted.** Always complete this step before attempting DigiLocker.




        ## Response Fields (200 OK — when successful via Postman)


        Returns full merchant object including `signing_authority_details[]`
        array with the added signatory.


        ## Error Response Fields


        | Field | Type | Description |

        |-------|------|-------------|

        | `error` | string | `"param is missing or the value is empty:
        bank_detail"` — bank_detail params must be included (see note above) |




        ## Multiple Signatories


        Up to 4 signatories can be submitted in a single request using array
        indexing `[0]`, `[1]`, `[2]`, `[3]`. 


        - **Only one** signatory should have `authorised_signatory = true` —
        this is the person who signs the merchant agreement

        - Additional signatories (index 1-3) are disabled by default in this
        collection — enable them as needed

        - Each signatory requires: name, PAN, email, contact_detail_type

        - CIN is only needed for CIN-eligible entities (Pvt Ltd, Public Limited,
        One Person Company)


        ## Next Step

        Proceed to **Step 09** — DigiLocker Verification.



        > **API path:** `PUT /api/v1/merchants/{uuid}/signatory_details` — use
        the merchant `uuid` from Step 01. (OpenAPI uses a distinct
        path-parameter name on this page so ReadMe can import Step 08 separately
        from Step 12, which share the same HTTP method and path.)
      parameters:
        - name: uuid_signatory
          in: path
          required: true
          schema:
            type: string
            example: 11ef-d968-6b042d6c-9b94-02975f21d323
          description: >-
            Merchant UUID from Step 01. Runtime path is
            `/api/v1/merchants/{uuid}/signatory_details`.
      requestBody:
