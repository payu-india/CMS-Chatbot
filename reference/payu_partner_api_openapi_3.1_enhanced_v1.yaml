  - name: Step 15 — Upload KYC Documents
    description: >
      # Step 15 — Upload KYC Documents


      Uploads KYC documents for each required category from Step 14. **Call this
      API once per required document category.**


      ## Prerequisite Steps

      - Step 14: Fetch required docs to know what to upload


      ## Response-to-Request Mapping from Step 14


      ```

      Step 14 response.document_categories[i].name       →
      merchant[document_category]

      Step 14 response.document_categories[i].document_types[j].name →
      merchant[document_type]

      Actual file from merchant                           →
      merchant[processed_document]

      ```


      ## File Constraints

      - Formats: JPG, PNG, PDF

      - Max size: 5 MB per file


      ## Document Statuses (check via GetMerchant or Show KYC Document)

      - `DOCUMENT_SUBMITTED` — Uploaded, pending review

      - `DOCUMENT_APPROVED` — Verified successfully

      - `DOCUMENT_REJECTED` — Rejected — delete and re-upload
  - name: Step 16 — E-Sign Agreement
    description: >
      # Step 16 — E-Sign Agreement


      Final step. Generates the merchant agreement for digital signing.


      ## Prerequisite Steps

      - **All prior steps** must be complete


      ## Entity Applicability

      **All entities**


      ## Correct Endpoint & Auth


      | | Value |

      |---|---|

      | **URL** | `GET
      /api/v1/merchants/{uuid}/generate_merged_document_for_esign` |

      | **Base** | `test-partner.payu.in` (Test) / `partner.payu.in` (Prod) |

      | **Scope** | Must include BOTH `refer_merchant` AND
      `client_manage_agreement` |


      ## After Success

      Merchant activated. Day-0 flags: S2S, tokenisation, callbacks, refunds.
  - name: Utilities
    description: >
      # Utilities — Status Polling


      The GetMerchant API can be called **at any point between steps** to check
      the merchant's internal statuses. Use it to:


      - Verify PAN verification completed (after Step 02)

      - Check bank auto-verification result (after Step 05 — determines if Step
      06 is needed)

      - Check CKYC status (after Step 03 — determines DigiLocker requirement in
      Step 09)

      - Check DigiLocker, VKYC status

      - Check KYC document verification status per document

      - Check agreement/E-sign status

      - Check overall onboarding stage and activation readiness
