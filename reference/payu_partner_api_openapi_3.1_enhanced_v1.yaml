  /api/v3/merchants/kyc_document/send_ckyc_otp:
    post:
      summary: A. Send CKYC OTP (Individual / Sole Prop)
      operationId: A._Send_CKYC_OTP_Individual_/_Sole_Prop
      tags:
        - Step 03 — CKYC Verification
      security:
        - BearerAuth: []
      description: >
        # Send CKYC OTP — Step 03A of 16


        Sends OTP to merchant's mobile for CKYC verification. **Only for
        Individual / Sole Proprietorship entities.**


        ## Endpoint


        `POST /api/v3/merchants/kyc_document/send_ckyc_otp`


        ## Prerequisite Steps

        - Step 01: `mid` from CreateMerchant response

        - Step 02: PAN submitted and entity type = Individual or Sole
        Proprietorship


        ## Entity Applicability

        **Individual and Sole Proprietorship only.** For all other entities, use
        Sub-request C (Fetch CKYC Data).


        ## Request Body (JSON)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant_id` | string | Yes | Numeric `mid` from Step 01 | Merchant
        ID |

        | `mobile` | string | Yes | 10-digit mobile | Same mobile used in Step
        01 |

        | `consent` | boolean | Yes | **Must be `true`** | Merchant consent for
        CKYC — mandatory for compliance |


        ## Error Handling


        | Error Code | Cause | Recovery |

        |------------|-------|----------|

        | `422` - "Consent is required" | `consent` not `true` | Set consent to
        `true` |

        | `422` - "Mobile is invalid" | Bad mobile format | Use 10-digit number
        |

        | `422` - "PAN not found" | PAN from Step 02 not yet verified | Wait for
        PAN verification, retry |


        ## Next Step

        After merchant receives OTP, call **Sub-request B (Verify CKYC OTP)**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              merchant_id: '{{mid}}'
              mobile: '{{merchant_mobile}}'
              consent: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants/kyc_document/verify_ckyc_otp:
    post:
      summary: B. Verify CKYC OTP (Individual / Sole Prop)
      operationId: B._Verify_CKYC_OTP_Individual_/_Sole_Prop
      tags:
        - Step 03 — CKYC Verification
      security:
        - BearerAuth: []
      description: >
        # Verify CKYC OTP — Step 03B of 16


        Verifies the OTP sent in Step 03A and returns CKYC identity data.


        ## Endpoint


        `POST /api/v3/merchants/kyc_document/verify_ckyc_otp`


        ## Prerequisite Steps

        - Step 03A: OTP sent successfully, merchant has received OTP


        ## Entity Applicability

        **Individual and Sole Proprietorship only.**


        ## Request Body (JSON)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant_id` | string | Yes | Numeric `mid` from Step 01 | Merchant
        ID |

        | `otp` | string | Yes | Exactly 6 digits | OTP received by merchant on
        mobile. **Must be sent as a string** to preserve leading zeros (e.g.
        `"014645"`, not `14645`). |


        ## Response (200 OK)


        Returns CKYC data: name, DOB, address (city, state, pincode), masked
        mobile.


        ## Response-to-Request Mapping


        CKYC success status affects **Step 09 (DigiLocker)**:

        - If this succeeds → DigiLocker is optional for Individual/Sole Prop

        - Track via GetMerchant → `ckyc_status`


        ## Error Handling


        | Error Code | Cause | Recovery |

        |------------|-------|----------|

        | `422` - "OTP should be of 6 digits" | OTP was sent as a number
        (stripping leading zeros) or is not 6 digits | Ensure OTP is sent as a
        string, not parsed with parseInt() |

        | `422` - "OTP is invalid" | Wrong OTP | Ask merchant to re-check;
        resend OTP via Step 03A |

        | `422` - "OTP expired" | OTP validity window passed | Resend OTP via
        Step 03A |


        ## Next Step

        Proceed to **Step 04** — Update merchant with business details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              merchant_id: '{{mid}}'
              otp: '123456'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '401':
          description: Unauthorized - Invalid or expired token
        '403':
          description: Forbidden - No access to this resource
        '404':
          description: Not Found
        '422':
          description: Validation Failed
        '500':
          description: Internal Server Error
  /api/v3/merchants/kyc_document/ckyc_data:
    post:
      summary: C. Fetch CKYC Data (Non-Individual Entities)
      operationId: C._Fetch_CKYC_Data_Non_Individual_Entities
      tags:
        - Step 03 — CKYC Verification
      security:
        - BearerAuth: []
      description: >
        # Fetch CKYC Data — Step 03C of 16


        Fetches CKYC identity data directly using PAN (no OTP needed). **For all
        non-Individual/non-Sole Prop entities.**


        ## Endpoint


        `POST /api/v3/merchants/kyc_document/ckyc_data`


        ## Prerequisite Steps

        - Step 01: `mid` from CreateMerchant response

        - Step 02: PAN submitted and entity type set (not Individual/Sole Prop)


        ## Entity Applicability

        **Partnership, Pvt Ltd, Public Limited, LLP, Trust, Society, One Person
        Company, Government, NGO, Hindu Undivided Family, Local Authority,
        Artificial Juridical Person**


        ## Request Body (JSON)


        | Parameter | Type | Required | Validation | Description |

        |-----------|------|----------|------------|-------------|

        | `merchant_id` | string | Yes | Numeric `mid` | Merchant ID |

        | `consent` | boolean | Yes | **Must be `true`** | Merchant consent —
        mandatory for CKYC compliance |


        ## Response (200 OK)


        Returns CKYC data: name, date of incorporation, address, masked mobile.


        ## Error Handling


        | Error Code | Cause | Recovery |

        |------------|-------|----------|

        | `422` - "Consent is required" | `consent` not `true` | Set consent to
        `true` |

        | `422` - "CKYC record not found" | No CKYC record for this PAN |
        Merchant may need additional verification |




        ## Response Fields (200 OK)


        | Field | Type | Description |

        |-------|------|-------------|

        | `ckyc_number` | string | CKYC identification number from CERSAI
        registry |

        | `name` | string | Entity name as registered in CKYC |

        | `father_name` | string | Father's name (empty for companies) |

        | `dob` | string | Date of birth/incorporation (format: `DD-MM-YYYY`) |

        | `address` | string | Registered address from CKYC |

        | `pincode` | string | Pincode from CKYC |

        | `state` | string | State from CKYC |

        | `city` | string | City from CKYC |

        | `related_persons_data` | array | Related persons (directors, partners)
        — may be empty |


        This data can be displayed to the merchant for confirmation. The
        `ckyc_status` in GetMerchant changes to `success` after this call.


        ## Next Step

        Proceed to **Step 04** — Update merchant with business details.
