openapi: 3.0.0
info:
  title: Collect Payment API — PayU Hosted Checkout
  description: >-
    Initiate a payment using PayU Hosted Checkout. Your server constructs the
    signed `_payment` request and submits it as a form POST. PayU handles
    payment method selection, bank authentication, and redirects the customer
    back to your `surl` (success) or `furl` (failure) URL after the transaction
    completes.
  version: 1.0.0
servers:
  - url: https://secure.payu.in
    description: Production Environment
  - url: https://test.payu.in
    description: Test Environment
paths:
  /_payment:
    post:
      summary: Collect Payment — PayU Hosted Checkout
      description: >-
        Submit a payment initiation request to PayU's Hosted Checkout. On
        receiving the request, PayU validates the hash and redirects the
        customer to the PayU payment page where they select their payment method
        and complete authentication. After payment, PayU POSTs the transaction
        result to the merchant's `surl` or `furl`.
      tags:
        - Collect Payment
      operationId: CollectPayment-PayUHostedCheckout
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - key
                - txnid
                - amount
                - productinfo
                - firstname
                - email
                - surl
                - furl
                - hash
              properties:
                key:
                  type: string
                  description: >-
                    Merchant key provided by PayU during onboarding. Know how to
                    generate the
                    [test](https://docs.payu.in/docs/generate-test-merchant-key-and-salt)
                    and
                    [live](https://docs.payu.in/docs/generate-merchant-key-and-salt-on-payu-dashboard)
                    keys from the dashboard.
                  example: JPM7Fg
                txnid:
                  type: string
                  description: >-
                    Unique transaction ID generated by the merchant for this
                    order. Character limit: 25. If a transaction with this ID
                    has already succeeded at PayU, reuse will fail with a
                    duplicate order ID error.
                  example: txn_hosted_001
                amount:
                  type: string
                  description: >-
                    Payment amount for the transaction. Pass as a string in
                    decimal format (e.g. `100.00`). Minimum value is ₹1.00 for
                    most payment methods.
                  example: '100.00'
                productinfo:
                  type: string
                  description: >-
                    Brief description of the product or service. Character
                    limit: 100.
                  example: iPhone
                firstname:
                  type: string
                  description: 'First name of the customer. Character limit: 60.'
                  example: Ashish
                email:
                  type: string
                  description: >-
                    Email address of the customer. Used for fraud detection,
                    chargeback handling, and transaction MIS reports. Character
                    limit: 50.
                  example: ashish@example.com
                phone:
                  type: string
                  description: >-
                    Phone number of the customer. Used for fraud detection and
                    MIS reporting. Character limit: 50.
                  example: '9876543210'
                lastname:
                  type: string
                  description: 'Last name of the customer. Character limit: 20.'
                  example: Kumar
                surl:
                  type: string
                  description: >-
                    Success URL. PayU redirects the customer to this URL and
                    POSTs the transaction response if the payment succeeds. Must
                    be a publicly reachable HTTPS endpoint in production.
                  example: https://your-domain.com/payment/success
                furl:
                  type: string
                  description: >-
                    Failure URL. PayU redirects the customer to this URL and
                    POSTs the transaction response if the payment fails or is
                    cancelled. Must be a publicly reachable HTTPS endpoint in
                    production.
                  example: https://your-domain.com/payment/failure
                curl:
                  type: string
                  description: >-
                    Cancel URL. PayU redirects to this URL if the customer
                    cancels the transaction on the PayU payment page. If not
                    provided, PayU uses `furl` for cancellations.
                  example: https://your-domain.com/payment/cancel
                hash:
                  type: string
                  description: >-
                    SHA-512 hash used to verify the integrity of the request.
                    Formula:
                    `sha512(key|txnid|amount|productinfo|firstname|email|udf1|udf2|udf3|udf4|udf5||||||SALT)`.
                    The five empty pipe-delimited fields between `udf5` and
                    `SALT` must be present. The salt must only be used
                    server-side and must never be exposed in frontend code.
                  example: >-
                    eabec285da28fd0e3054d41a4d24fe9f7599c9d0b66646f7a9984303fd6124044b6206daf831e9a8bda28a6200d318293a13d6c193109b60bd4b4f8b09c90972
                pg:
                  type: string
                  description: >-
                    Payment category to pre-select on the PayU payment page.
                    Optional — if not passed, PayU shows all enabled payment
                    methods. Pass to restrict the payment page to a specific
                    method (e.g. `CC` for cards only).
                  example: CC
                bankcode:
                  type: string
                  description: >-
                    Payment option code to pre-select a specific bank or wallet
                    on the PayU payment page. Used in combination with `pg`.
                    Optional.
                  example: HDFCB
                address1:
                  type: string
                  description: >-
                    Customer billing address line 1. Recommended for fraud
                    detection and chargeback handling.
                  example: 123 Main Street
                address2:
                  type: string
                  description: Customer billing address line 2.
                  example: Apt 4B
                city:
                  type: string
                  description: Customer billing city.
                  example: Bangalore
                state:
                  type: string
                  description: Customer billing state.
                  example: Karnataka
                country:
                  type: string
                  description: Customer billing country.
                  example: India
                zipcode:
                  type: string
                  description: 'Customer billing ZIP or postal code. Character limit: 20.'
                  example: '560001'
                udf1:
                  type: string
                  description: >-
                    User-defined field 1. Store any additional information for
                    this transaction. Reflected back in the callback response.
                    Character limit: 255.
                udf2:
                  type: string
                  description: 'User-defined field 2. Character limit: 255.'
                udf3:
                  type: string
                  description: 'User-defined field 3. Character limit: 255.'
                udf4:
                  type: string
                  description: 'User-defined field 4. Character limit: 255.'
                udf5:
                  type: string
                  description: 'User-defined field 5. Character limit: 255.'
                buyer_type_business:
                  type: string
                  description: >-
                    Pass `1` to flag this as a B2B transaction. Used for
                    business buyer identification in MIS reports.
                  example: '1'
                si_details:
                  type: string
                  description: >-
                    JSON string containing subscription/mandate registration
                    details. Required only for recurring payment (SI)
                    transactions. See the [Recurring
                    Payments](https://docs.payu.in/docs/introduction-to-recurring-payments)
                    guide for the full schema.
                  example: >-
                    {"billingCycle":"MONTHLY","billingInterval":"1","billingAmount":500,"billingCurrency":"INR","paymentStartDate":"2024-01-01","paymentEndDate":"2025-01-01","remarks":"Monthly
                    subscription"}
            examples:
              basic_request:
                summary: Basic Payment Request
                value:
                  key: JPM7Fg
                  txnid: txn_hosted_001
                  amount: '100.00'
                  productinfo: iPhone
                  firstname: Ashish
                  email: ashish@example.com
                  phone: '9876543210'
                  surl: https://your-domain.com/payment/success
                  furl: https://your-domain.com/payment/failure
                  hash: >-
                    eabec285da28fd0e3054d41a4d24fe9f7599c9d0b66646f7a9984303fd6124044b6206daf831e9a8bda28a6200d318293a13d6c193109b60bd4b4f8b09c90972
              request_with_address:
                summary: Payment Request with Billing Address
                value:
                  key: JPM7Fg
                  txnid: txn_hosted_002
                  amount: '500.00'
                  productinfo: Electronics
                  firstname: Ashish
                  lastname: Kumar
                  email: ashish@example.com
                  phone: '9876543210'
                  address1: 123 Main Street
                  city: Bangalore
                  state: Karnataka
                  country: India
                  zipcode: '560001'
                  surl: https://your-domain.com/payment/success
                  furl: https://your-domain.com/payment/failure
                  hash: >-
                    eabec285da28fd0e3054d41a4d24fe9f7599c9d0b66646f7a9984303fd6124044b6206daf831e9a8bda28a6200d318293a13d6c193109b60bd4b4f8b09c90972
      responses:
        '200':
          description: >-
            PayU accepts the request and redirects the customer to the PayU
            payment page. The actual transaction result is delivered
            asynchronously via POST to your `surl` (success) or `furl` (failure)
            after the customer completes or abandons payment.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  Callback response POSTed by PayU to `surl` or `furl` after
                  payment completes.
                properties:
                  mihpayid:
                    type: string
                    description: PayU's unique transaction reference ID.
                    example: '403993715529787'
                  txnid:
                    type: string
                    description: The merchant transaction ID passed in the request.
                    example: txn_hosted_001
                  status:
                    type: string
                    description: >-
                      Transaction status. Values: `success`, `failure`,
                      `pending`.
                    example: success
                  amount:
                    type: string
                    description: Transaction amount.
                    example: '100.00'
                  mode:
                    type: string
                    description: >-
                      Payment mode used. Examples: `CC` (credit card), `NB` (net
                      banking), `UPI`, `CASH` (wallet).
                    example: CC
                  hash:
                    type: string
                    description: >-
                      Reverse hash for response verification. Formula:
                      `sha512(SALT|status||||||udf5|udf4|udf3|udf2|udf1|email|firstname|productinfo|amount|txnid|key)`.
                      Always verify this before fulfilling the order.
                  bank_ref_num:
                    type: string
                    description: Bank reference number for the transaction.
                  unmappedstatus:
                    type: string
                    description: Raw status string from PayU's payment processor.
              examples:
                success:
                  summary: Successful Payment Callback
                  value:
                    mihpayid: '403993715529787'
                    txnid: txn_hosted_001
                    status: success
                    amount: '100.00'
                    mode: CC
                    bank_ref_num: '12345678'
                    hash: >-
                      a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
                failure:
                  summary: Failed Payment Callback
                  value:
                    mihpayid: '403993715529788'
                    txnid: txn_hosted_001
                    status: failure
                    amount: '100.00'
                    mode: CC
                    hash: >-
                      a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
        '400':
          description: >
            Validation failure. PayU rejects the request before the customer is
            redirected. Common causes and fixes are listed below.


            <details>

            <summary>Key is empty</summary>


            - **Cause:** The `key` field was not included in the request.

            - **Recommended fix:** Send the merchant key from the PayU dashboard
            for the correct environment (test vs live).


            </details>


            <details>

            <summary>Hash is empty / Invalid Hash</summary>


            - **Cause:** The `hash` field is missing or the computed digest does
            not match.

            - **Recommended fix:** Recompute the SHA-512 hash server-side using
            the exact formula:
            `sha512(key|txnid|amount|productinfo|firstname|email|udf1|udf2|udf3|udf4|udf5||||||SALT)`.
            Ensure the five empty pipe-delimited fields between `udf5` and
            `SALT` are present, and that you are using the correct salt for the
            environment (test salt vs live salt).


            </details>


            <details>

            <summary>Invalid txnid / Duplicate Order ID</summary>


            - **Cause:** The `txnid` has already been used for a successful
            transaction.

            - **Recommended fix:** Generate a new unique `txnid` for every new
            payment attempt. Do not reuse transaction IDs across attempts.


            </details>


            <details>

            <summary>Amount is invalid</summary>


            - **Cause:** `amount` is missing, zero, or not a valid decimal
            string.

            - **Recommended fix:** Send `amount` as a positive decimal string
            (e.g. `"100.00"`). Minimum value is ₹1.00 for most payment methods.


            </details>


            <details>

            <summary>Mandatory parameter missing</summary>


            - **Cause:** One or more required fields (`key`, `txnid`, `amount`,
            `productinfo`, `firstname`, `email`, `surl`, `furl`, `hash`) are
            absent from the request.

            - **Recommended fix:** Ensure all required fields are included and
            non-empty in the form POST body.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: 0 indicates failure.
                    example: 0
                  message:
                    type: string
                    description: Human-readable error message.
                    example: Invalid Hash
              examples:
                invalidHash:
                  summary: Invalid Hash
                  value:
                    status: 0
                    message: Invalid Hash
                missingKey:
                  summary: Missing Merchant Key
                  value:
                    status: 0
                    message: Key is empty
                duplicateTxnid:
                  summary: Duplicate Transaction ID
                  value:
                    status: 0
                    message: Duplicate Order ID
      x-internal: true
components:
  schemas:
    siparameterdetail:
      title: SI Parameter Detail
      description: >-
        Subscription/mandate registration parameters. Passed as a JSON string in
        the `si_details` field of the `_payment` request for recurring payment
        setup.
      type: object
      required:
        - billingCycle
        - billingInterval
        - billingAmount
        - billingCurrency
        - paymentStartDate
        - paymentEndDate
        - remarks
      properties:
        billingCycle:
          type: string
          description: >-
            Frequency of billing. Determines whether the customer is charged on
            a daily, weekly, monthly, yearly, or one-time basis.
          enum:
            - DAILY
            - WEEKLY
            - MONTHLY
            - YEARLY
            - ONCE
            - ADHOC
          example: MONTHLY
        billingInterval:
          type: string
          description: >-
            Interval coupled with `billingCycle`. For example,
            `billingCycle=MONTHLY` and `billingInterval=1` charges monthly;
            `billingCycle=DAILY` and `billingInterval=3` charges every 3 days.
          example: '1'
        billingAmount:
          type: number
          description: >-
            Billing amount in `XX.XX` decimal format. For `ADHOC` billing
            cycles, this is the maximum debit amount per cycle. For UPI, must
            not exceed ₹15,000 (NPCI limit).
          example: 500
        billingCurrency:
          type: string
          description: Transaction currency. Must be `INR` for India.
          enum:
            - INR
          default: INR
        paymentStartDate:
          type: string
          format: date
          description: Start date of the billing plan in `YYYY-MM-DD` format.
          example: '2024-01-01'
        paymentEndDate:
          type: string
          format: date
          description: End date of the billing plan in `YYYY-MM-DD` format.
          example: '2025-01-01'
        remarks:
          type: string
          description: >-
            Remarks shown on PSP applications during UPI mandate registration.
            No significance for card or net banking mandates. Character limit:
            50.
          example: Monthly subscription
        billingLimit:
          type: string
          description: >-
            UPI mandates only. Defines the period window within which the
            recurring debit from the mandate date can occur.
          example: ON = 2024-02-20
        billingRule:
          type: string
          description: >-
            UPI mandates only. Defines the maximum debit amount constraint
            relative to the mandate amount.
          example: MAX = 5000
        billingDate:
          type: string
          description: >-
            UPI mandates only. Specifies the day/date for recurring debit within
            each cycle. If omitted, debit follows the `paymentStartDate` cycle.
          example: FORTNIGHTLY = 7
        siTokenRequestor:
          type: string
          description: >-
            Optional. Controls card tokenisation during mandate setup. `1` =
            PayU tokenises the card and shares it with the issuer for mandate
            setup. `2` = PayU authorises using the plain card.
          enum:
            - '1'
            - '2'
        authpayuid:
          type: string
          description: >-
            PayU mandate ID. Pass only when modifying an existing subscription —
            to update billing details such as start/end date, cycle, interval,
            or amount.
        action:
          type: string
          description: >-
            Action on an existing mandate. Pass when modifying (`MODIFY`) or
            deleting (`DELETE`) a subscription.
          enum:
            - MODIFY
            - DELETE
