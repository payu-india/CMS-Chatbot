openapi: 3.0.0
info:
  title: Resend card OTP
  description: ResendCardOtpDTO requires merchant_id, reseller_id, hash, and reference_id.
    On success the message is "OTP resent successfully".
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/resendCardOtp:
    post:
      summary: Resend a card OTP
      description: ResendCardOtpDTO requires merchant_id, reseller_id, hash, and reference_id.
        On success the message is "OTP resent successfully".
      tags:
        - Partner Payment APIs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchant_id
                - reseller_id
                - hash
                - reference_id
              properties:
                merchant_id:
                  type: integer
                  description: merchant id
                  example: 8739528
                reseller_id:
                  type: string
                  description: reseller id
                  example: YOUR_RESELLER_UUID
                hash:
                  type: string
                  description: hash
                  example: YOUR_HASH
                reference_id:
                  type: string
                  description: reference id
                  example: REFERENCE_ID
            examples:
              request:
                summary: Sample request
                value:
                  merchant_id: 8739528
                  reseller_id: YOUR_RESELLER_UUID
                  hash: YOUR_HASH
                  reference_id: REFERENCE_ID
      responses:
        '200':
          description: OTP resent.
          content:
            application/json:
              examples:
                success:
                  summary: Successful Response
                  value:
                    status: success
                    message: OTP resent successfully
                    attemptsLeft: 2
                    isSupported: true
        '400':
          description: Validation failed or the resend was rejected.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    errors:
                      - reference_id is mandatory.
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: Invalid Auth token
      operationId: partnerResendCardOtp
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Partner access token. Send as Authorization Bearer token.
