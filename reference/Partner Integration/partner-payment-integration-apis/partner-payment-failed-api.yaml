openapi: 3.0.0
info:
  title: Payment Failure Redirect Callback
  description: PayU receives the hosted-checkout result on this route when the payment fails.
    error and error_Message carry the gateway reason. The customer is then sent to furl.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/paymentFailed:
    post:
      summary: Payment Failure Redirect Callback
      description: PayU receives the hosted-checkout result on this route when the payment
        fails. error and error_Message carry the gateway reason. The customer is then sent
        to furl.
      tags:
        - Partner Payment APIs
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mihpayid:
                  type: string
                  description: PayU payment id.
                  example: '403993715521855092'
                txnid:
                  type: string
                  description: Merchant transaction id. The handler also accepts `txnId`.
                  example: TXN1001
                amount:
                  type: string
                  description: amount
                  example: '1000.00'
                status:
                  type: string
                  description: status
                  enum:
                    - failure
                  example: failure
                mode:
                  type: string
                  description: mode
                productinfo:
                  type: string
                  description: productinfo
                  example: Order
                firstname:
                  type: string
                  description: firstname
                  example: John
                email:
                  type: string
                  description: email
                  example: customer@example.com
                phone:
                  type: string
                  description: phone
                  example: '9999999999'
                hash:
                  type: string
                  description: Response hash. Verify with SHA-512 before trusting the postback.
                    See custom_blocks/HashingSample.md for the payment hash preimage.
                  example: YOUR_HASH
                bankcode:
                  type: string
                  description: bankcode
                  example: HDFC
                bank_ref_num:
                  type: string
                  description: bank ref num
                udf1:
                  type: string
                  description: udf1
                udf2:
                  type: string
                  description: udf2
                udf3:
                  type: string
                  description: udf3
                udf4:
                  type: string
                  description: udf4
                udf5:
                  type: string
                  description: udf5
                error:
                  type: string
                  description: error
                error_Message:
                  type: string
                  description: error Message
                net_amount_debit:
                  type: string
                  description: net amount debit
                PG_TYPE:
                  type: string
                  description: PG TYPE
                unmappedstatus:
                  type: string
                  description: Read by PartnerService.paymentCallback when verifying status.
                key:
                  type: string
                  description: Merchant key. Used to look up the partner transaction.
                  example: YOUR_MERCHANT_KEY
            examples:
              request:
                summary: Sample request
                value:
                  mihpayid: '403993715521855092'
                  txnid: TXN1001
                  amount: '1000.00'
                  status: failure
                  mode: CC
                  productinfo: Order
                  firstname: John
                  email: 'customer@example.com'
                  phone: '9999999999'
                  hash: YOUR_HASH
                  bankcode: HDFC
                  bank_ref_num: '1234567890'
                  udf1: custom_value_1
                  udf2: custom_value_2
                  udf3: custom_value_3
                  udf4: custom_value_4
                  udf5: web
                  error: E000
                  error_Message: No Error
                  net_amount_debit: '1000.00'
                  PG_TYPE: CC-PG
                  unmappedstatus: captured
                  key: YOUR_MERCHANT_KEY
      responses:
        '302':
          description: >
            processPaymentCompletion and processPaymentCancelled write the HTTP response and
            redirect the customer. They do not return a JSON body.
      operationId: partnerPaymentFailed
