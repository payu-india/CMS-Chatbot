openapi: 3.0.0
servers:
  - url: https://api.payu.in
    description: Production
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: UAT
info:
  title: Payment Failure Redirect Callback
  version: "1.0.0"
  description: >
    PayU receives the hosted-checkout result on this route when the payment fails. error and error_Message carry the gateway reason. The customer is then sent to furl.
paths:
  /partner/paymentFailed:
    post:
      operationId: partnerPaymentFailed
      summary: Payment Failure Redirect Callback
      description: >
        PayU receives the hosted-checkout result on this route when the payment fails. error and error_Message carry the gateway reason. The customer is then sent to furl.
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mihpayid:
                  type: string
                  description: PayU payment id.
                txnid:
                  type: string
                  description: Merchant transaction id. The handler also accepts `txnId`.
                amount:
                  type: string
                status:
                  type: string
                  enum: [failure]
                mode:
                  type: string
                productinfo:
                  type: string
                firstname:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                hash:
                  type: string
                  description: Response hash. Verify with SHA-512 before trusting the postback. See custom_blocks/HashingSample.md for the payment hash preimage.
                bankcode:
                  type: string
                bank_ref_num:
                  type: string
                udf1:
                  type: string
                udf2:
                  type: string
                udf3:
                  type: string
                udf4:
                  type: string
                udf5:
                  type: string
                error:
                  type: string
                error_Message:
                  type: string
                net_amount_debit:
                  type: string
                PG_TYPE:
                  type: string
                unmappedstatus:
                  type: string
                  description: Read by PartnerService.paymentCallback when verifying status.
                key:
                  type: string
                  description: Merchant key. Used to look up the partner transaction.

      responses:
        '302':
          description: >
            processPaymentCompletion and processPaymentCancelled write the HTTP
            response and redirect the customer. They do not return a JSON body.
