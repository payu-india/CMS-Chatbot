openapi: 3.0.0
info:
  title: Static QR callback
  description: POST /partner/staticQrCallback is received by PayU. The handler rejects a
    blank field4 (merchant VPA) or a blank key. txnid is used only to detect a duplicate
    callback. A blank txnid is not rejected. The hash is the standard PayU response hash
    checked with validatePayUBizResponseHash and the merchant salt.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/staticQrCallback:
    post:
      summary: Static QR payment callback
      description: POST /partner/staticQrCallback is received by PayU. The handler rejects
        a blank field4 (merchant VPA) or a blank key. txnid is used only to detect a duplicate
        callback. A blank txnid is not rejected. The hash is the standard PayU response hash
        checked with validatePayUBizResponseHash and the merchant salt.
      tags:
        - Partner Payment APIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - field4
                - key
              properties:
                txnid:
                  type: string
                  description: Used to detect a duplicate callback. A blank value is not rejected.
                  example: TXN1001
                field4:
                  type: string
                  description: Merchant VPA. The handler rejects the call when this is blank.
                  example: merchant@payu
                key:
                  type: string
                  description: Merchant key used to load the salt for hash verification.
                  example: YOUR_MERCHANT_KEY
                mihpayid:
                  type: string
                  description: mihpayid
                  example: '403993715521855092'
                amount:
                  type: string
                  description: amount
                  example: '1000.00'
                status:
                  type: string
                  description: status
                  example: success
                mode:
                  type: string
                  description: mode
                hash:
                  type: string
                  description: hash
                  example: YOUR_HASH
                bank_ref_num:
                  type: string
                  description: bank ref num
            examples:
              request:
                summary: Sample request
                value:
                  txnid: TXN1001
                  field4: 'merchant@payu'
                  key: YOUR_MERCHANT_KEY
                  mihpayid: '403993715521855092'
                  amount: '1000.00'
                  status: success
                  mode: CC
                  hash: YOUR_HASH
                  bank_ref_num: '1234567890'
      responses:
        '200':
          description: Accepted, including a duplicate txnid. Empty body.
        '400':
          description: field4 or key is missing, or no static QR is registered for the VPA.
          content:
            text/plain:
              examples:
                error:
                  summary: Error Response
                  value: field4 (merchantVpa) is required
      operationId: partnerStaticQrCallback
