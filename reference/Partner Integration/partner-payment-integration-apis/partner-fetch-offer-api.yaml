openapi: 3.0.0
servers:
  - url: https://api.payu.in
    description: Production
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: UAT
info:
  title: Fetch offers
  version: "1.0.0"
  description: >
    Fetch payment offers for a merchant. Request fields are FetchOfferDTO.
    Required fields are merchant_id, reseller_id, and hash.
    amount, offerKeys, paymentId, userToken, and skusDetail are optional.
    The handler forwards the body to the PayU Offers service and returns that JSON.
    Hash input in PartnerUtils.getWhatsappOfferRequestHashSequence is merchant_id, then the client secret is appended (`merchant_id|` + client secret), SHA-512.
paths:
  /partner/fetchOffer:
    post:
      operationId: partnerFetchOffer
      summary: Fetch available payment offers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchant_id, reseller_id, hash]
              properties:
                merchant_id:
                  type: integer
                reseller_id:
                  type: string
                hash:
                  type: string
                amount:
                  type: string
                offerKeys:
                  type: array
                  items:
                    type: string
                paymentId:
                  type: integer
                  format: int64
                userToken:
                  type: string
                skusDetail:
                  type: array
                  items:
                    type: object
                    required: [skuId]
                    properties:
                      skuId:
                        type: string
                      skuAmount:
                        type: string
                      quantity:
                        type: string
                      offerKeys:
                        type: array
                        items:
                          type: string
      responses:
        '200':
          description: Offers service JSON, passed through. The partner layer does not define an offers array schema.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation failed. Body is `errors`, a list of bean-validation messages.
          content:
            application/json:
              example:
                errors:
                  - merchant_id is mandatory
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              example:
                error: Invalid Auth token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Partner access token. Send as Authorization Bearer token."
