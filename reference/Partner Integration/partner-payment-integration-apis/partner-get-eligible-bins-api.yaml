openapi: 3.0.0
info:
  title: Get eligible EMI bins
  description: PartnerService.getEligibleBins requires merchant_id, type, and var2. pg and
    offer_type are not read by this method. The map is forwarded to the eligible-bins service.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/getEligibleBins:
    post:
      summary: Get EMI bins eligible for a merchant
      description: PartnerService.getEligibleBins requires merchant_id, type, and var2. pg
        and offer_type are not read by this method. The map is forwarded to the eligible-bins
        service.
      tags:
        - Partner Payment APIs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchant_id
                - type
                - var2
              properties:
                merchant_id:
                  type: string
                  description: Digits only.
                  example: '8739528'
                type:
                  type: string
                  description: Required by PartnerService. Forwarded to the eligible-bins
                    service.
                  example: bin
                var2:
                  type: string
                  description: Required by PartnerService. Forwarded to the eligible-bins
                    service.
                  example: EMI
            examples:
              request:
                summary: Sample request
                value:
                  merchant_id: '8739528'
                  type: bin
                  var2: EMI
      responses:
        '200':
          description: Eligible-bins service JSON, passed through.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: merchant_id, type, or var2 is missing.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: merchant_id, type and var2 param are mandatory params
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: Invalid Auth token
      operationId: partnerGetEligibleBins
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Partner access token. Send as Authorization Bearer token.
