openapi: 3.0.0
servers:
  - url: https://api.payu.in
    description: Production
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: UAT
info:
  title: Payment link payment
  version: "1.0.0"
  description: >
    POST /partner/payment-link/payment. PartnerPaymentLinkTxnDTO fields are
    payment_link_id, phone_number, and redirect_url.
    validatePaymentLinkRequest requires payment_link_id and phone_number.
    phone_number must match (^$|[0-9]{5,16}).
    merchant_id, txnid, pg, bankcode, and card fields are not on this DTO.
paths:
  /partner/payment-link/payment:
    post:
      operationId: partnerPaymentLinkPayment
      summary: Start a payment-link transaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_link_id, phone_number]
              properties:
                payment_link_id:
                  type: string
                phone_number:
                  type: string
                  description: 5 to 16 digits, or empty. Empty is rejected by the required check.
                redirect_url:
                  type: string
                  description: Optional in the DTO. When present, the domain is validated.
      responses:
        '200':
          description: Downstream payment-link transaction response, after processTxnDataResponseAndInitiatePayment.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              example:
                error: Invalid Auth token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Partner access token. Send as Authorization Bearer token."
