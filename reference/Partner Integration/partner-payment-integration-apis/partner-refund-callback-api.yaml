openapi: 3.0.0
info:
  title: Partner Refund Callback
  description: PayU receives the refund notification at POST /partner/refundCallback. PartnerController
    accepts a JSON object. RefundCallbackDTO is the non-migrated shape. RefundCallbackMigratedDTO
    is the migrated shape (paymentId, refundId, refundAmount, refundStatus). Both sets are
    listed. No field is required by the controller.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/refundCallback:
    post:
      summary: Refund status callback
      description: PayU receives the refund notification at POST /partner/refundCallback.
        PartnerController accepts a JSON object. RefundCallbackDTO is the non-migrated shape.
        RefundCallbackMigratedDTO is the migrated shape (paymentId, refundId, refundAmount,
        refundStatus). Both sets are listed. No field is required by the controller.
      tags:
        - Partner Payment APIs
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mihpayid:
                  type: string
                  description: mihpayid
                  example: '403993715521855092'
                request_id:
                  type: string
                  description: request id
                amt:
                  type: string
                  description: Refunded amount on the non-migrated payload.
                status:
                  type: string
                  description: Non-migrated status. PartnerService treats success, queued,
                    and failure.
                  example: success
                token:
                  type: string
                  description: token
                  example: refund_token_001
                bank_ref_num:
                  type: string
                  description: bank ref num
                bank_arn:
                  type: string
                  description: bank arn
                refund_mode:
                  type: string
                  description: refund mode
                action:
                  type: string
                  description: action
                merchantTxnId:
                  type: string
                  description: merchantTxnId
                partnerName:
                  type: string
                  description: partnerName
                remark:
                  type: string
                  description: remark
                key:
                  type: string
                  description: key
                  example: YOUR_MERCHANT_KEY
                additionalValue1:
                  type: string
                  description: additionalValue1
                additionalValue2:
                  type: string
                  description: additionalValue2
                paymentId:
                  type: string
                  description: Migrated payload. Same role as mihpayid.
                refundId:
                  type: string
                  description: Migrated payload. Same role as request_id.
                refundAmount:
                  type: string
                  description: refundAmount
                refundStatus:
                  type: string
                  description: Migrated payload. Code comment says the value is Refund Completed.
                notificationId:
                  type: string
                  description: notificationId
                completedOn:
                  type: string
                  description: completedOn
                addedOn:
                  type: string
                  description: addedOn
            examples:
              request:
                summary: Sample request
                value:
                  mihpayid: '403993715521855092'
                  request_id: REQ1001
                  amt: '100.00'
                  status: success
                  token: refund_token_001
                  bank_ref_num: '1234567890'
                  bank_arn: ARN1001
                  refund_mode: CC
                  action: refund
                  merchantTxnId: TXN1001
                  partnerName: Partner
                  remark: Refund completed
                  key: YOUR_MERCHANT_KEY
                  additionalValue1: value1
                  additionalValue2: value2
                  paymentId: '403993715521855092'
                  refundId: REF1001
                  refundAmount: '100.00'
                  refundStatus: Refund Completed
                  notificationId: NOTIF1001
                  completedOn: '2026-11-25T10:00:00'
                  addedOn: '2026-11-25T09:00:00'
      responses:
        '200':
          description: processRefundCallbackResponse returns void. PayU does not document
            a JSON acknowledgement body.
      operationId: partnerRefundCallback
