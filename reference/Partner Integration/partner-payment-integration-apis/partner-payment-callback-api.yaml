openapi: 3.0.0
info:
  title: Payment S2S Callback
  description: Server-to-server postback to PayU at POST /partner/paymentCallback. PartnerService.paymentCallback
    returns HTTP 200 with an empty body after it notifies the partner webhook. The partner
    webhook URL is configured for the reseller. It is not this path.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/paymentCallback:
    post:
      summary: Payment S2S Callback
      description: Server-to-server postback to PayU at POST /partner/paymentCallback. PartnerService.paymentCallback
        returns HTTP 200 with an empty body after it notifies the partner webhook. The partner
        webhook URL is configured for the reseller. It is not this path.
      tags:
        - Partner Payment APIs
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                mihpayid:
                  type: string
                  description: PayU payment id.
                  example: '403993715521855092'
                txnid:
                  type: string
                  description: Merchant transaction id. The handler also accepts `txnId`.
                  example: TXN1001
                amount:
                  type: string
                  description: amount
                  example: '1000.00'
                status:
                  type: string
                  description: Payment status posted by PayU, such as success or failure.
                  example: success
                mode:
                  type: string
                  description: mode
                productinfo:
                  type: string
                  description: productinfo
                  example: Order
                firstname:
                  type: string
                  description: firstname
                  example: John
                email:
                  type: string
                  description: email
                  example: customer@example.com
                phone:
                  type: string
                  description: phone
                  example: '9999999999'
                hash:
                  type: string
                  description: Response hash. Verify with SHA-512 before trusting the postback.
                    See custom_blocks/HashingSample.md for the payment hash preimage.
                  example: YOUR_HASH
                bankcode:
                  type: string
                  description: bankcode
                  example: HDFC
                bank_ref_num:
                  type: string
                  description: bank ref num
                udf1:
                  type: string
                  description: udf1
                udf2:
                  type: string
                  description: udf2
                udf3:
                  type: string
                  description: udf3
                udf4:
                  type: string
                  description: udf4
                udf5:
                  type: string
                  description: udf5
                error:
                  type: string
                  description: error
                error_Message:
                  type: string
                  description: error Message
                net_amount_debit:
                  type: string
                  description: net amount debit
                PG_TYPE:
                  type: string
                  description: PG TYPE
                unmappedstatus:
                  type: string
                  description: Read by PartnerService.paymentCallback when verifying status.
                key:
                  type: string
                  description: Merchant key. Used to look up the partner transaction.
                  example: YOUR_MERCHANT_KEY
      responses:
        '200':
          description: PayU accepted the postback. paymentCallback returns an empty 200 body.
        '400':
          description: paymentCallback returns this when payment status validation fails.
          content:
            text/plain:
              examples:
                error:
                  summary: Error Response
                  value: payment status validation failed
      operationId: partnerPaymentCallback
