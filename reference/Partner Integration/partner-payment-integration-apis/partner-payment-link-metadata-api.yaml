openapi: 3.0.0
info:
  title: Payment link metadata
  description: GET /partner/payment-link/metadata. The query parameter PartnerService reads
    is payment_link. merchant_id and txnid are not read. The JSON returned to the partner
    is amount, currency, description, payment_link_id, payment_link_status, and expiry_time.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/payment-link/metadata:
    get:
      summary: Get payment link metadata
      description: GET /partner/payment-link/metadata. The query parameter PartnerService
        reads is payment_link. merchant_id and txnid are not read. The JSON returned to the
        partner is amount, currency, description, payment_link_id, payment_link_status, and
        expiry_time.
      tags:
        - Partner Payment APIs
      parameters:
        - name: payment_link
          in: query
          required: true
          schema:
            type: string
          description: Payment link URL. Empty values raise a bad-request MetaException.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metadata mapped by processMetaDataResponse.
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: number
                    description: amount
                    example: '1000.00'
                  currency:
                    type: string
                    description: currency
                    example: INR
                  description:
                    type: string
                    description: description
                  payment_link_id:
                    type: string
                    description: payment link id
                    example: https://u.payu.in/PAYUID
                  payment_link_status:
                    type: string
                    description: payment link status
                  expiry_time:
                    type: integer
                    description: Expiry converted to epoch by convertStringDateToEpoch.
              examples:
                success:
                  summary: Successful Response
                  value:
                    amount: 1000.0
                    currency: INR
                    description: Order 1001
                    payment_link_id: https://u.payu.in/PAYUID
                    payment_link_status: active
                    expiry_time: 1735689600
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: Invalid Auth token
      operationId: partnerPaymentLinkMetadata
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Partner access token. Send as Authorization Bearer token.
