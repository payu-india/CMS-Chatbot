openapi: 3.0.0
info:
  title: Dynamic Bharat QR
  description: POST /partner/dbqr. Headers match verifyStatus. PartnerService does not
    reject a missing body field. updateOmniChannelTransactionForDbqr reads vendorTransactionId,
    soundBoxTerminalId, expiryTime, and mihpayId when they are present, and swallows a parse
    error. The body is forwarded to POST /v1/partner/qr/dbqr.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/dbqr:
    post:
      summary: Generate a dynamic Bharat QR
      description: POST /partner/dbqr. Headers match verifyStatus. PartnerService does not
        reject a missing body field. updateOmniChannelTransactionForDbqr reads vendorTransactionId,
        soundBoxTerminalId, expiryTime, and mihpayId when they are present, and swallows a
        parse error. The body is forwarded to POST /v1/partner/qr/dbqr.
      tags:
        - Partner Payment APIs
      parameters:
        - name: X-PayU-Merchant-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-PayU-Merchant-ID
          in: header
          required: false
          schema:
            type: string
        - name: date
          in: header
          required: false
          schema:
            type: string
      security:
        - resellerUuid: []
          partnerToken: []
          hmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mihpayId:
                  type: string
                  description: mihpayId
                  example: '403993715529984752'
                vendorTransactionId:
                  type: string
                  description: vendorTransactionId
                  example: PARTNER_TXN_001
                transactionAmount:
                  type: string
                  description: Decimal rupee string, for example "100.00".
                  example: '100.00'
                expiryTime:
                  type: string
                  description: QR validity in seconds.
                  example: '3600'
                soundBoxTerminalId:
                  type: string
                  description: soundBoxTerminalId
                  example: ABCD1234
            examples:
              request:
                summary: Sample request
                value:
                  mihpayId: '403993715529984752'
                  vendorTransactionId: PARTNER_TXN_001
                  transactionAmount: '100.00'
                  expiryTime: '3600'
                  soundBoxTerminalId: ABCD1234
      responses:
        '200':
          description: Dynamic QR payload. The published page returns status and result.qrString.
          content:
            application/json:
              examples:
                success:
                  summary: Successful Response
                  value:
                    status: success
                    result:
                      qrString: 000201010212...
      operationId: partnerDbqr
components:
  securitySchemes:
    resellerUuid:
      type: apiKey
      in: header
      name: X-PayU-Reseller-UUID
    partnerToken:
      type: apiKey
      in: header
      name: X-Partner-Token
      description: Partner access token. The Partner QR guides send this as `Bearer <token>`.
    hmacAuth:
      type: apiKey
      in: header
      name: Authorization
      description: HMAC value. Partner QR guides use `hmac username="<client_id>", algorithm="sha512",
        headers="date", signature="<signature>"`.
