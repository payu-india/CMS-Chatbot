openapi: 3.0.0
servers:
  - url: https://api.payu.in
    description: Production
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: UAT
info:
  title: Dynamic Bharat QR
  version: "1.0.0"
  description: >
    POST /partner/dbqr. Generates a dynamic Bharat QR for one transaction.
    Headers match verifyStatus. PartnerUtils.updateOmniChannelTransactionForDbqr reads
    vendorTransactionId, soundBoxTerminalId, expiryTime, and optional mihpayId.
    Those names match the published Generate Dynamic QR page. The response on that page
    includes result.qrString. The body is forwarded to POST /v1/partner/qr/dbqr.
paths:
  /partner/dbqr:
    post:
      operationId: partnerDbqr
      summary: Generate a dynamic Bharat QR
      security:
        - resellerUuid: []
          partnerToken: []
          hmacAuth: []
      parameters:
        - name: X-PayU-Merchant-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-PayU-Merchant-ID
          in: header
          required: false
          schema:
            type: string
        - name: date
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mihpayId, vendorTransactionId, transactionAmount, expiryTime, soundBoxTerminalId]
              properties:
                mihpayId:
                  type: string
                vendorTransactionId:
                  type: string
                transactionAmount:
                  type: string
                  description: Decimal rupee string, for example "100.00".
                expiryTime:
                  type: string
                  description: QR validity in seconds.
                soundBoxTerminalId:
                  type: string
      responses:
        '200':
          description: Dynamic QR payload. The published page returns status and result.qrString.
          content:
            application/json:
              example:
                status: success
                result:
                  qrString: "000201010212..."
components:
  securitySchemes:
    resellerUuid:
      type: apiKey
      in: header
      name: X-PayU-Reseller-UUID
    partnerToken:
      type: apiKey
      in: header
      name: X-Partner-Token
      description: Partner access token. The Partner QR guides send this as `Bearer <token>`.
    hmacAuth:
      type: apiKey
      in: header
      name: Authorization
      description: HMAC value. Partner QR guides use `hmac username="<client_id>", algorithm="sha512", headers="date", signature="<signature>"`.
