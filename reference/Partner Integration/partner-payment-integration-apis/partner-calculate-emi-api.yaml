openapi: 3.0.0
info:
  title: Calculate EMI
  description: PartnerService.calculateEmi requires merchant_id (digits). reseller_id is removed
    before the downstream call. Other fields are forwarded after merchant_id is removed. amount
    and bankcode are not validated here.
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/calculateEmi:
    post:
      summary: Calculate EMI options
      description: PartnerService.calculateEmi requires merchant_id (digits). reseller_id
        is removed before the downstream call. Other fields are forwarded after merchant_id
        is removed. amount and bankcode are not validated here.
      tags:
        - Partner Payment APIs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchant_id
              properties:
                merchant_id:
                  type: string
                  description: merchant id
                  example: '8739528'
                amount:
                  type: string
                  description: Forwarded. Not validated in PartnerService.calculateEmi.
                  example: '1000.00'
                bankcode:
                  type: string
                  description: Forwarded. Not validated in PartnerService.calculateEmi.
                  example: HDFC
                reseller_id:
                  type: string
                  description: Removed before the downstream EMI call.
                  example: YOUR_RESELLER_UUID
            examples:
              request:
                summary: Sample request
                value:
                  merchant_id: '8739528'
      responses:
        '200':
          description: EMI calculator JSON, passed through.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: merchant_id is missing or not digits.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: merchant_id param is missing in the body
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: Invalid Auth token
      operationId: partnerCalculateEmi
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Partner access token. Send as Authorization Bearer token.
