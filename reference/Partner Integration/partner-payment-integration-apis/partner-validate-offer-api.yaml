openapi: 3.0.0
info:
  title: Validate offer
  description: 'Validate an offer. Fields are ValidateOfferDTO. Required: merchant_id, reseller_id,
    hash, paymentDetail (category is required inside it), and userDetail (userToken is required
    inside it). txnid, offerKey, and bankcode are not fields on this DTO. Offer keys are offerKeys.
    The response is the Offers validate endpoint JSON, passed through.'
  version: 1.0.0
servers:
  - url: https://api.payu.in
    description: Production Environment
  - url: https://test-partnerapilayer.payu.in/apilayer
    description: Test Environment
tags:
  - name: Partner Payment APIs
    description: Partner payment, refund, offer, EMI, payment link, OTP, QR, and Checkout
      Plus APIs.
paths:
  /partner/validateOffer:
    post:
      summary: Validate a payment offer
      description: 'Validate an offer. Fields are ValidateOfferDTO. Required: merchant_id,
        reseller_id, hash, paymentDetail (category is required inside it), and userDetail
        (userToken is required inside it). txnid, offerKey, and bankcode are not fields on
        this DTO. Offer keys are offerKeys. The response is the Offers validate endpoint JSON,
        passed through.'
      tags:
        - Partner Payment APIs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - merchant_id
                - reseller_id
                - hash
                - paymentDetail
                - userDetail
              properties:
                merchant_id:
                  type: integer
                  description: merchant id
                  example: 8739528
                reseller_id:
                  type: string
                  description: reseller id
                  example: YOUR_RESELLER_UUID
                hash:
                  type: string
                  description: hash
                  example: YOUR_HASH
                amount:
                  type: string
                  description: amount
                  example: '1000.00'
                autoApply:
                  type: boolean
                  description: autoApply
                merchantNceParamActive:
                  type: boolean
                  description: merchantNceParamActive
                offerKeys:
                  type: array
                  items:
                    type: string
                paymentId:
                  type: integer
                  description: paymentId
                paymentDetail:
                  type: object
                  required:
                    - category
                  properties:
                    category:
                      type: string
                      description: category
                    paymentCode:
                      type: string
                      description: paymentCode
                    cardNumber:
                      type: integer
                      description: cardNumber
                    cardHash:
                      type: string
                      description: cardHash
                    cardToken:
                      type: string
                      description: cardToken
                    cardTokenType:
                      type: integer
                      description: cardTokenType
                    cardMask:
                      type: integer
                      description: cardMask
                    vpa:
                      type: string
                      description: vpa
                userDetail:
                  type: object
                  required:
                    - userToken
                  properties:
                    userToken:
                      type: string
                      description: userToken
                    email:
                      type: string
                      description: email
                      example: customer@example.com
                    phoneNo:
                      type: string
                      description: phoneNo
                skusDetail:
                  type: object
                  properties:
                    skus:
                      type: array
                      items:
                        type: object
                        required:
                          - skuId
                        properties:
                          skuId:
                            type: string
                            description: skuId
                          skuAmount:
                            type: string
                            description: skuAmount
                          quantity:
                            type: string
                            description: quantity
                          offerKeys:
                            type: array
                            items:
                              type: string
                          autoApply:
                            type: boolean
                            description: autoApply
            examples:
              request:
                summary: Sample request
                value:
                  merchant_id: 8739528
                  reseller_id: YOUR_RESELLER_UUID
                  hash: YOUR_HASH
                  amount: '1000.00'
                  autoApply: false
                  merchantNceParamActive: false
                  offerKeys:
                    - OFFER_KEY_1
                  paymentId: 403993715521855092
                  paymentDetail:
                    category: creditcard
                    paymentCode: CC
                    cardNumber: 411111
                    cardHash: CARD_HASH
                    cardToken: CARD_TOKEN
                    cardTokenType: 0
                    cardMask: 1111
                    vpa: 'customer@upi'
                  userDetail:
                    userToken: USER_TOKEN
                    email: 'customer@example.com'
                    phoneNo: '9999999999'
                  skusDetail:
                    skus:
                      - skuId: SKU1
                        skuAmount: '100.00'
                        quantity: '1'
                        offerKeys:
                          - OFFER_KEY_1
                        autoApply: false
      responses:
        '200':
          description: Offers validate JSON, passed through.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bean validation failed.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    errors:
                      - paymentDetail is mandatory
        '401':
          description: Invalid bearer token.
          content:
            application/json:
              examples:
                error:
                  summary: Error Response
                  value:
                    error: Invalid Auth token
      operationId: partnerValidateOffer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Partner access token. Send as Authorization Bearer token.
