openapi: 3.1.0
info:
  title: PayU Merchant Hosted — _payment
  version: 1.0.0
  x-derivedFrom:
    - >-
      reference/Collect
      Payment/_payment_merchant_hosted/_payment_merchant_hosted_cards-with-transaction-biller-name.md
    - API Collection/Merchant Hosted Checkout.postman_collection_9th_June.json
  description: >
    OpenAPI **3.1** for PayU merchant-hosted **`POST /_payment`**.


    Parameter descriptions and card examples follow PayU **Cards with
    Transaction Biller Name** where applicable

    (`additional_info` / `txnBillerName`). The **`pg`** enum aggregates every
    **`pg`** value used across the

    **Merchant Hosted Checkout** Postman collection (Net Banking, Cards, EMI,
    UPI, BNPL, and the same collection’s

    wallet flow sample, which posts **`pg=UPI`** — use **`bankcode`** and
    checkout APIs per your PayU **Key Account Manager (KAM)** for
    wallet-specific codes).


    Hash rules (including **api_version=19**) and response verification:
    [merchant-hosted
    checkout](https://docs.payu.in/docs/custom-checkout-merchant-hosted).
servers:
  - url: https://test.payu.in
    description: Sandbox
  - url: https://secure.payu.in
    description: Production
paths: {}
components:
  schemas:
    PaymentGateway:
      type: string
      description: >
        Payment gateway (**`pg`**) — closed enum matching the **Merchant Hosted
        Checkout** Postman collection’s `_payment` samples.


        | `pg` | Postman folder / use |

        |------|----------------------|

        | **CC** | Cards — credit card (**default** in PayU card docs if
        omitted) |

        | **DC** | Cards — debit card (same collection variables; use with debit
        **bankcode**) |

        | **EMI** | EMI — card instalment |

        | **UPI** | UPI (and the collection’s **Wallets** sample, which used
        **`pg=UPI`**) |

        | **BNPL** | BNPL (e.g. **LAZYPAY** **bankcode** in Postman) |

        | **TESTPG** | Net Banking — **sandbox** test PG (**TESTPGNB**
        **bankcode** in Postman) |


        Production net banking often uses other **`pg`/`bankcode`** pairs from
        PayU docs or **`getNetBankingStatus`** — confirm with your **KAM** if
        **`TESTPG`** is sandbox-only.
      enum:
        - BNPL
        - CC
        - DC
        - EMI
        - TESTPG
        - UPI
    AdditionalInfoTxnBiller:
      type: object
      description: >-
        JSON object carried in the **`additional_info`** form field (serialized
        as a JSON string in the POST body).
      properties:
        txnBillerName:
          type: string
          description: Sub-merchant or transaction biller name for the card transaction.
          example: Airtel Recharge Payment
    MerchantHostedPaymentForm:
      type: object
      additionalProperties: true
      description: >
        Merchant-hosted **`_payment`** form. **Always required:** `key`,
        `txnid`, `amount`, `productinfo`, `firstname`, `email`, `phone`, `surl`,
        `furl`, `hash`, `pg`, `bankcode`.


        **Conditional (per `pg` / instrument):** send **`ccnum`**,
        **`ccexpmon`**, **`ccexpyr`**, **`ccvv`**, **`ccname`** for card and EMI
        card flows; send **`vpa`** for UPI. Use **`additional_info`** (e.g.
        **`txnBillerName`**) when using the card biller-name feature.


        **Note:** Some PayU tables place name-on-card wording beside **`ccvv`**;
        CVV belongs in **`ccvv`**, cardholder name in **`ccname`**.
      required:
        - key
        - txnid
        - amount
        - productinfo
        - firstname
        - email
        - phone
        - surl
        - furl
        - hash
        - pg
        - bankcode
      properties:
        key:
          type: string
          description: Unique merchant key issued by PayU for your account (`varchar`).
          example: Your Test Key
        txnid:
          type: string
          maxLength: 25
          description: >
            Transaction ID (order id) generated at your end; used to track the
            order.

            Must be **unique** for each new attempt — reusing an id that already
            succeeded returns a duplicate order id error.
          example: fd3e847h2
        amount:
          type: string
          description: >
            Payment amount for the transaction (post as a decimal string; treat
            numerically as float at integration time).


            * May be **0 INR** for some net-banking penny flows or **≥ 1 INR**
            for cards and UPI in penny use cases (per PayU).

            * First-instalment behaviour applies only to selected flows (see
            PayU full docs).
          example: '1000'
        productinfo:
          type: string
          maxLength: 100
          description: Brief product description (`varchar`, max 100 characters).
          example: Time Magazine Subscription
        firstname:
          type: string
          maxLength: 60
          description: Customer first name (`varchar`, max 60 characters).
          example: Ashish
        email:
          type: string
          maxLength: 50
          description: >
            Customer email (`varchar`, max 50). Use a valid value — used in
            fraud/chargeback context and some issuer MIS.
          example: Ashish@test.com
        phone:
          type: string
          maxLength: 50
          description: >
            Customer phone (`varchar`, max 50). Use a valid value — used in
            fraud/chargeback context and some issuer MIS.
          example: '9843176540'
        surl:
          type: string
          format: uri
          description: Success URL — PayU redirects here when the transaction succeeds.
          example: https://admin.payu.in/test_response
        furl:
          type: string
          format: uri
          description: Failure URL — PayU redirects here when the transaction fails.
          example: https://admin.payu.in/test_response
        hash:
          type: string
          description: >
            SHA512 hash so request data is not tampered between your site and
            PayU.


            Classic-style formula (when applicable):  

            `SHA512(key|txnid|amount|productinfo|firstname|email|udf1|udf2|udf3|udf4|udf5|||si_details|SALT)`.


            For **`api_version=19`**, use PayU’s extended pipe sequence
            including `udf6`…`udf10`, `user_token`, `offer_key`,

            `offer_auto_apply`, `cart_details`, `extra_charges`, and **`phone`**
            as documented for `_payment` v19.
        pg:
          $ref: '#/components/schemas/PaymentGateway'
        bankcode:
          type: string
          description: >
            PayU code for the payment option. Must align with **`pg`**
            (Postman-style examples: **CC**+**CC**, **UPI**+**UPI**,

            **EMI**+**EMIA3**, **BNPL**+**LAZYPAY**, **TESTPG**+**TESTPGNB**).
            Card network codes: see PayU **Card number formats**

            and **Card type codes and supported banks**. Wallet/BNPL codes may
            come from **`get_checkout_details`** or your **KAM**.
          example: CC
        udf1:
          type: string
          maxLength: 255
          description: Optional user-defined field 1 (`varchar`, max 255).
        udf2:
          type: string
          maxLength: 255
          description: Optional user-defined field 2 (`varchar`, max 255).
        udf3:
          type: string
          maxLength: 255
          description: Optional user-defined field 3 (`varchar`, max 255).
        udf4:
          type: string
          maxLength: 255
          description: Optional user-defined field 4 (`varchar`, max 255).
        udf5:
          type: string
          maxLength: 255
          description: Optional user-defined field 5 (`varchar`, max 255).
        ccnum:
          type: string
          description: >
            **Cards / EMI:** card number — typically **13–19** digits (15 for
            AMEX, 13–19 for Maestro). Validate with **Luhn**.
        ccvv:
          type: string
          description: >-
            Cards / EMI: card security code (CVV). Name on card belongs in
            ccname, not ccvv.
        ccexpmon:
          type: string
          description: >
            **Cards / EMI:** expiry **month** as **two digits** (`MM`). Months
            1–9 as `01`…`09`; 10–12 as `10`, `11`, `12`.
          example: '05'
        ccexpyr:
          type: string
          description: >-
            Cards / EMI: expiry year (four digits in Postman samples; follow
            PayU field rules for your integration).
          example: '2026'
        ccname:
          type: string
          description: 'Cards / EMI: name on card as entered by the customer.'
          example: Test User
        vpa:
          type: string
          description: 'UPI: virtual payment address (VPA) collected on your site.'
          example: success@payu
        additional_info:
          type: string
          description: >
            Optional JSON string with extra transaction metadata. For
            transaction biller name on cards, include **`txnBillerName`**

            (see **AdditionalInfoTxnBiller** for the parsed shape).
          example: '{"txnBillerName":"Airtel Recharge Payment"}'
        txn_s2s_flow:
          type: string
          description: >-
            Optional flow flag as in PayU card samples (e.g. server-to-server
            oriented flows).
          example: '1'
        api_version:
          type: string
          description: >-
            When using **19**, follow PayU’s v19 hash sequence for `_payment`
            including `phone` and related fields.
