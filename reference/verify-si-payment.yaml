                        offerAvailed: null
                recurringRetry:
                  summary: Recurring Retry In Progress
                  value:
                    status: 1
                    msg: 1 out of 1 Transactions Fetched Successfully
                    transaction_details:
                      rc_613345778912516840:
                        mihpayid: null
                        request_id: null
                        bank_ref_num: null
                        amt: '1.00'
                        transaction_amount: '1.00'
                        txnid: rc_613345778912516840
                        additional_charges: '0.00'
                        productinfo: null
