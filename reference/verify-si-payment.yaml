                        unmappedstatus: null
                        Merchant_UTR: null
                        Settled_At: null
                        card_token: null
                        offerAvailed: null
        '400':
          description: Validation error or transaction not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: 0 indicates failure.
                    example: 0
                  msg:
                    type: string
                    description: Human-readable error message.
                    example: 'Invalid txnId: cannot be null or empty'
                  transaction_details:
                    type: object
                    nullable: true
                    description: Present when a txnid was supplied but not found.
                    additionalProperties:
                      type: object
                      properties:
                        mihpayid:
                          type: string
                          example: Not Found
                        status:
                          type: string
                          example: Not Found
              examples:
                nullTxnId:
                  summary: Missing or Empty var1
                  value:
                    status: 0
                    msg: 'Invalid txnId: cannot be null or empty'
                txnNotFound:
                  summary: Transaction ID Not Found
                  value:
                    status: 0
                    msg: 0 out of 1 Transactions Fetched Successfully
                    transaction_details:
                      PZT2608142058W69KM01-001:
                        mihpayid: Not Found
                        status: Not Found
      x-internal: true
