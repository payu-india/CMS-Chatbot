openapi: 3.0.0
info:
  title: Verify SI Payment API
  description: |
    Checks the status of a pre-debit or recurring payment transaction initiated
    via the Cards SI Pre-Debit and Recurring (PDN/RP) merge API.

    Use the `verify_si_payment` command with the `rc_` prefixed transaction ID
    returned by the `si_transaction` API as `var1`.

    **Hash formula:**
    ```
    SHA512(key|command|var1|SALT)
    ```

    **Status mapping:**

    | `status` | `unmappedstatus` | Transaction state |
    |----------|------------------|-------------------|
    | `pending` | `null` | Pre-Debit processed — recurring not yet executed |
    | `failure` | `null` | Pre-Debit failed |
    | `success` | `captured` | Recurring payment succeeded |
    | `failure` | `failed` | Recurring payment failed |
    | `in progress` | `null` | Recurring being retried — poll again |
  version: 1.0.0
servers:
  - url: https://info.payu.in
    description: Production Environment
  - url: https://test.payu.in
    description: Test Environment
paths:
  /merchant/postservice?form=2:
    post:
      summary: Verify SI Payment Status
      description: >
        Checks the status of a pre-debit or recurring payment transaction
        initiated

        via the Pre-Debit and Recurring API. Uses the same endpoint and request
        structure

        as the standard `verify_payment` command — the only change is setting

        `command=verify_si_payment` and passing the `rc_` prefixed transaction
        ID as `var1`.


        The outer envelope `status: 1` only means the API call was processed —
        not that

        the payment succeeded. Check `transaction_details[<txnid>].status` and

        `.unmappedstatus` for the actual payment outcome.
      tags:
        - Verify SI Payment
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - key
                - command
                - var1
                - hash
              properties:
                key:
                  type: string
                  description: The merchant key generated from the PayU dashboard.
                  example: G2ZB4r
                command:
                  type: string
                  description: Must be set to `verify_si_payment`.
                  enum:
                    - verify_si_payment
                  example: verify_si_payment
                var1:
                  type: string
                  description: >
                    The `rc_` prefixed transaction ID returned by the PDN/RP
                    merge API

                    (`si_transaction`). This is the recurring debit `txnid`
                    prefixed with `rc_`.
                  example: rc_613345778912516840
                hash:
                  type: string
                  description: >
                    SHA-512 hash generated as: SHA512(key|command|var1|SALT).
                    Use your merchant salt and the exact `var1` string posted.
                  example: >-
                    e7929823f663946bf9f54a68567901da847e505555e187412cf21a3d8e8fd18b6db1904442f62a07f77e74237398bcbf689353903415bb89d42c2ef0117fff88
            examples:
              verifyRequest:
                summary: Verify SI Payment Status
                value:
                  key: G2ZB4r
                  command: verify_si_payment
                  var1: rc_613345778912516840
                  hash: >-
                    e7929823f663946bf9f54a68567901da847e505555e187412cf21a3d8e8fd18b6db1904442f62a07f77e74237398bcbf689353903415bb89d42c2ef0117fff88
      responses:
        '200':
          description: |
            API call processed. Check `transaction_details[<txnid>].status` and
            `.unmappedstatus` for the actual payment outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: 1 = API call succeeded; 0 = API call failed.
                    example: 1
                  msg:
                    type: string
                    description: Human-readable outcome message.
                    example: 1 out of 1 Transactions Fetched Successfully
                  transaction_details:
                    type: object
                    description: >
                      Map of transaction ID → transaction detail object.

                      The key is the `rc_` prefixed transaction ID passed as
                      `var1`.
                    additionalProperties:
                      type: object
                      properties:
                        mihpayid:
                          type: string
                          nullable: true
                          description: >-
                            PayU transaction ID. Populated for completed
                            recurring transactions; null for pending/in-progress
                            states.
                          example: '30141596997'
                        bank_ref_num:
                          type: string
                          nullable: true
                          description: >-
                            Bank reference number. Populated on successful
                            recurring transactions.
                          example: '622716418717'
                        amt:
                          type: string
                          description: Mandate amount.
                          example: '1.00'
                        transaction_amount:
                          type: string
                          description: Actual transaction amount for this debit.
                          example: '1.00'
                        txnid:
                          type: string
                          description: The `rc_` prefixed transaction ID.
                          example: rc_613345778912516840
                        field9:
                          type: string
                          nullable: true
                          description: Human-readable status message from PayU.
                          example: Transaction Completed
                        error_code:
                          type: string
                          nullable: true
                          description: >-
                            PayU error code. `E000` on success; non-null on
                            failure.
                          example: E000
                        addedon:
                          type: string
                          nullable: true
                          description: >-
                            Transaction timestamp (YYYY-MM-DD HH:MM:SS). Null
                            until the recurring charge is processed.
                          example: '2026-08-15 22:00:04'
                        payment_source:
                          type: string
                          nullable: true
                          description: >-
                            `sirecurring` for recurring SI charges; null for
                            pre-debit states.
                          example: sirecurring
                        card_type:
                          type: string
                          nullable: true
                          description: Card network (VISA, MAST, etc.).
                          example: MAST
                        error_Message:
                          type: string
                          nullable: true
                          description: Human-readable error description from the bank.
                          example: NO ERROR
                        net_amount_debit:
                          nullable: true
                          description: >-
                            Net amount debited. `0.00` on failure; null when not
                            yet processed.
                          example: 1
                        mode:
                          type: string
                          description: >-
                            Payment mode. `SI` for recurring; `"null"` (string)
                            when not yet processed.
                          example: SI
                        PG_TYPE:
                          type: string
                          nullable: true
                          description: >-
                            Payment gateway type. `SI-PG` for recurring
                            transactions.
                          example: SI-PG
                        card_no:
                          type: string
                          nullable: true
                          description: Masked card number.
                          example: XXXXXXXXXXXXXXXX
                        status:
                          type: string
                          description: >
                            Transaction outcome status.

                            - `pending` — Pre-debit processed; recurring not yet
                            executed.

                            - `failure` — Pre-debit failed or recurring charge
                            failed.

                            - `success` — Recurring charge succeeded.

                            - `in progress` — Recurring charge is being retried.
                          enum:
                            - pending
                            - failure
                            - success
                            - in progress
                          example: success
                        unmappedstatus:
                          type: string
                          nullable: true
                          description: >
                            Granular payment status.

                            - `captured` — Recurring charge captured
                            successfully.

                            - `failed` — Recurring charge failed at the bank.

                            - `null` — Pre-debit states and retry state.
                          example: captured
              examples:
                preDebitSuccess:
                  summary: Pre-Debit Success (Recurring Pending)
                  value:
                    status: 1
                    msg: 1 out of 1 Transactions Fetched Successfully
                    transaction_details:
                      rc_613345778912516840:
                        mihpayid: null
                        request_id: null
                        bank_ref_num: null
                        amt: '1.00'
                        transaction_amount: '1.00'
                        txnid: rc_613345778912516840
                        additional_charges: '0.00'
                        productinfo: null
                        firstname: null
                        bankcode: null
                        field9: Request Processed Successfully
                        error_code: null
                        addedon: null
                        payment_source: null
                        card_type: null
                        error_Message: null
                        net_amount_debit: null
                        disc: '0.00'
                        mode: 'null'
                        PG_TYPE: null
                        card_no: null
                        status: pending
                        unmappedstatus: null
                        Merchant_UTR: null
                        Settled_At: null
                        card_token: null
                        offerAvailed: null
                preDebitFailed:
                  summary: Pre-Debit Failed
                  value:
                    status: 1
                    msg: 1 out of 1 Transactions Fetched Successfully
                    transaction_details:
                      rc_613345778912516840:
                        mihpayid: null
                        request_id: null
                        bank_ref_num: null
                        amt: '1.00'
                        transaction_amount: '1.00'
                        txnid: rc_613345778912516840
                        additional_charges: '0.00'
                        productinfo: null
                        firstname: null
                        bankcode: null
                        field9: Mandate is not Active
                        error_code: null
                        addedon: null
                        payment_source: null
                        card_type: null
                        error_Message: null
                        net_amount_debit: null
                        disc: '0.00'
                        mode: 'null'
                        PG_TYPE: null
                        card_no: null
                        status: failure
                        unmappedstatus: null
                        Merchant_UTR: null
                        Settled_At: null
                        card_token: null
                        offerAvailed: null
                recurringSuccess:
                  summary: Recurring Payment Succeeded
                  value:
                    status: 1
                    msg: 1 out of 1 Transactions Fetched Successfully
                    transaction_details:
                      rc_613345778912516840:
                        mihpayid: '30141596997'
                        request_id: ''
                        bank_ref_num: '622716418717'
                        amt: '0.00'
                        transaction_amount: '1.00'
                        txnid: rc_613345778912516840
                        additional_charges: '0.00'
                        productinfo: SI
                        firstname: ''
                        bankcode: CCSI
                        field2: '003773'
                        field9: Transaction Completed
                        error_code: E000
                        addedon: '2026-08-15 22:00:04'
                        payment_source: sirecurring
                        card_type: MAST
                        error_Message: NO ERROR
                        net_amount_debit: 1
                        disc: '0.00'
                        mode: SI
                        PG_TYPE: SI-PG
                        card_no: XXXXXXXXXXXXXXXX
                        status: success
                        unmappedstatus: captured
                        Merchant_UTR: null
                        Settled_At: null
                        card_token: null
                        offerAvailed: null
                recurringFailed:
                  summary: Recurring Payment Failed
                  value:
                    status: 1
                    msg: 1 out of 1 Transactions Fetched Successfully
                    transaction_details:
                      rc_613345778912516840:
                        mihpayid: '30025956801'
                        request_id: null
                        bank_ref_num: null
                        amt: '1.00'
                        transaction_amount: '1.00'
                        txnid: rc_613345778912516840
                        additional_charges: '0.00'
                        productinfo: SI
                        firstname: ''
