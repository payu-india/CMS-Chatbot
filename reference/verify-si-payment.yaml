                        card_type: VISA
                        error_Message: Unable to process the request.
                        net_amount_debit: 0
                        disc: '0.00'
                        mode: SI
                        PG_TYPE: SI-PG
                        card_no: XXXXXXXXXXXXXXXX
                        status: failure
                        unmappedstatus: failed
                        Merchant_UTR: null
