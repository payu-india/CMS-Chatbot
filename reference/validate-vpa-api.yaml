openapi: 3.0.3
info:
  title: PayU Validate VPA API
  description: >
    Validates a customer's UPI Virtual Payment Address (VPA) before initiating a
    UPI Collect

    or recurring (Autopay) payment. Call this API after the customer enters
    their VPA on your

    page; proceed with payment only when the VPA is valid.


    **Hash logic:** `sha512(key|command|var1|salt)` — see

    [Generate Merchant Key and
    Salt](https://docs.payu.in/docs/generate-merchant-key-and-salt-on-payu-dashboard)

    (production) or

    [Generate Test Merchant Key and
    Salt](https://docs.payu.in/docs/generate-test-merchant-key-and-salt)

    (test).
  version: 1.0.0
  contact:
    url: https://docs.payu.in/reference/validate_vpa_api
servers:
  - url: https://test.payu.in/merchant
    description: Test environment
  - url: https://info.payu.in/merchant
    description: Production environment
paths:
  /postservice.php:
    post:
      summary: Validate a VPA
      description: Validate whether a VPA is valid.
      operationId: validateVPA
      tags:
        - UPI
      parameters:
        - name: form
          in: query
          required: true
          description: This value should always be `2` for command APIs.
          schema:
            type: integer
            example: 2
            default: '2'
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/x-www-form-urlencoded
            example: application/x-www-form-urlencoded
        - name: accept
          in: header
          required: false
          schema:
            type: string
            example: application/json
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - key
                - command
                - var1
                - hash
              properties:
                key:
                  type: string
                  description: The unique Merchant Key provided by PayU for your account.
                  example: BmTY3G
                  enum:
                    - BmTY3G
                command:
                  type: string
                  description: The command API follows. Here, it should be `validateVPA`.
                  example: validateVPA
                  enum:
                    - validateVPA
                var1:
                  type: string
                  description: >-
                    You should pass the UPI VPA you want to validate as a value
                    here.
                  example: 9999999999@upi
                  enum:
                    - 9999999999@upi
                  default: 9999999999@upi
                hash:
                  type: string
                  description: >
                    The generated hash value. You should generate the hash using
                    the `sha512(key|command|var1|salt)` logic. Alternatively,
                    you can use the button in the [Generate
                    Hash](https://docs.payu.in/reference/validate-vpa#generate-hash)
                    section above to generate the hash.
                  example: >-
                    d415188799f49f554a24064752bd6ce4d8a18c075b7b88b534e3150f253c09ae28a48554d2d1ba4be66b8441b2cbc364491d26bcead605c5fcecf4eaf622e224
                var2:
                  type: object
                  description: |
                    Use this parameter only for UPI autopay validation. 
                  example: '{"validateAutoPayVPA":"1"}'
                  properties:
                    validateAutoPayVPA:
                      type: integer
                      description: >-
                        Pass the value as `1` to check recurring-payment
                        eligibility.
                      enum:
                        - 1
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: |-
                      Determines the status of the API command. Possible values:
                      - `Successful`
                      - `Failure`
                    example: SUCCESS
                    enum:
                      - Successful
                      - Failure
                  vpa:
                    type: string
                    description: The UPI VPA that was validated.
                    example: 9999999999@upi
                    enum:
                      - 9999999999@upi
                  isVPAValid:
                    type: integer
                    description: |-
                      Determines whether the VPA is valid. Possible values:
                      - `1`: The VPA is valid. 
                      - `0`: The VPA is invalid.
                    example: 1
                    enum:
                      - 1
                      - 0
                  isAutoPayVPAValid:
                    type: integer
                    description: >
                      Determines whether the VPA is registered for recurring
                      payments. This parameter is returned only if you request
                      autopay validation by sending `var2`. Possible values:

                      - `1`: The VPA is registered for recurring payments.

                      - `0`: The VPA is not registered for recurring payments.
                    example: 1
                    enum:
                      - 1
                      - 0
                  isAutoPayBankValid:
                    type: string
                    description: >-
                      Determines whether the corresponding bank account is
                      registered for recurring payments or autopay. Possible
                      values:

                      - `1`: Indicates that the bank account is registered for
                      Recurring Payments.

                      - `0`: Indicates that the bank account is not registered
                      for Recurring Payments.
                    example: NA
                    enum:
                      - '1'
                      - '0'
                  payerAccountName:
                    type: string
                    description: The Account holder name.
                    example: ABC
              examples:
                validVpa:
                  summary: Valid VPA
                  value:
                    status: SUCCESS
                    vpa: 9999999999@upi
                    isVPAValid: 1
                    isAutoPayVPAValid: 1
                    isAutoPayBankValid: NA
                    payerAccountName: ABC
x-readme:
  explorer-enabled: true
  proxy-enabled: true
