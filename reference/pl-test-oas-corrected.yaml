openapi: 3.0.0
info:
  title: PayU Payment Links API
  description: Create, manage, and share payment links programmatically.
  version: 1.0.0
servers:
  - url: https://uatoneapi.payu.in
    description: Test Environment
  - url: https://oneapi.payu.in
    description: Production Environment
tags:
  - name: Payment Links
    description: Create, retrieve, update, share, and manage payment links.
paths:
  /payment-links:
    post:
      summary: Create Payment Link
      operationId: CreatePaymentLinkAPI
      description: >
        Create a shareable payment link and optionally notify the customer via
        email, SMS,

        or WhatsApp. The link type is determined by the combination of
        parameters sent —

        there is no separate `type` field.


        | Link Type | Key parameters |

        |---|---|

        | Standard (fixed amount) | `source: API`, `subAmount > 0` |

        | Open Amount | `source: API`, `isAmountFilledByCustomer: true` (omit
        `subAmount`) |

        | Partial Payment | `source: API`, `subAmount > 0`,
        `isPartialPaymentAllowed: true` |

        | SI Recurring | `source: si_payment_link`, `siDetails` object |

        | eNACH | `source: si_payment_link`, `enforcePayMethod: enach`,
        `siDetails` with `bankDetails` |


        **Required scope:** `create_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
      x-readme:
        code-samples:
          - language: curl
            name: Standard
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "subAmount": 1499,
                "description": "Order #ORD-2026-88421",
                "source": "API",
                "invoiceNumber": "ORD-2026-88421",
                "expiryDate": "2026-10-15 23:59:59",
                "viaEmail": true,
                "viaSms": true,
                "customer": {
                  "name": "Arjun Mehta",
                  "email": "arjun.mehta@example.com",
                  "phone": "9876543210"
                }
              }'
          - language: curl
            name: Open Amount
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "description": "Donation — Help us plant 1,000 trees",
                "source": "API",
                "isAmountFilledByCustomer": true,
                "invoiceNumber": "DON-2026-001",
                "viaEmail": true,
                "customer": {
                  "name": "Priya Sharma",
                  "email": "priya@example.com"
                }
              }'
          - language: curl
            name: Partial Payment
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "subAmount": 5000,
                "description": "Advance booking",
                "source": "API",
                "isPartialPaymentAllowed": true,
                "minAmountForCustomer": 1000,
                "viaEmail": true,
                "customer": {
                  "name": "Rohit Verma",
                  "email": "rohit@example.com",
                  "phone": "9988776655"
                }
              }'
          - language: curl
            name: SI Recurring
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "description": "Monthly SIP",
                "source": "si_payment_link",
                "viaEmail": true,
                "customer": {
                  "name": "Kavya Nair",
                  "email": "kavya@example.com",
                  "phone": "9871234567"
                },
                "siDetails": {
                  "billingAmount": 2000,
                  "billingCycle": "MONTHLY",
                  "billingInterval": 12,
                  "paymentStartDate": "2026-11-01",
                  "paymentEndDate": "2027-10-31",
                  "isNoExpiry": false
                }
              }'
          - language: curl
            name: eNACH
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "description": "Monthly SIP via eNACH",
                "source": "si_payment_link",
                "enforcePayMethod": "enach",
                "viaEmail": true,
                "customer": {
                  "name": "Suresh Pillai",
                  "email": "suresh@example.com",
                  "phone": "9988001122"
                },
                "siDetails": {
                  "billingAmount": 2000,
                  "billingCycle": "MONTHLY",
                  "billingInterval": 12,
                  "paymentStartDate": "2026-11-01",
                  "paymentEndDate": "2027-10-31",
                  "isNoExpiry": false,
                  "bankDetails": {
                    "bankCode": "SBIIN",
                    "bankAccountNumber": "1234567890",
                    "ifsc": "SBIN0001234",
                    "accountType": "SAVINGS"
                  }
                }
              }'
        explorer-enabled: true
        parameter-ordering:
          - header
          - body
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StandardPaymentLinkRequest'
                - $ref: '#/components/schemas/OpenAmountPaymentLinkRequest'
                - $ref: '#/components/schemas/PartialPaymentLinkRequest'
                - $ref: '#/components/schemas/SIRecurringPaymentLinkRequest'
                - $ref: '#/components/schemas/ENACHPaymentLinkRequest'
            example:
              subAmount: 1499
              description: 'Order #ORD-2026-88421 — Wireless Headphones'
              source: API
              invoiceNumber: ORD-2026-88421
              expiryDate: '2026-10-15 23:59:59'
              currency: INR
              tax: 0
              shippingCharge: 0
              discount: 0
              maxPaymentsAllowed: 1
              isAmountFilledByCustomer: false
              isPartialPaymentAllowed: false
              minAmountForCustomer: 500
              viaEmail: true
              viaSms: true
              viaWhatsapp: false
              successURL: https://yourstore.com/payment/success
              failureURL: https://yourstore.com/payment/failure
              enforcePayMethod: cc|dc
              dropCategory: EMI
              customer:
                name: Arjun Mehta
                email: arjun.mehta@example.com
                phone: '9876543210'
              address:
                line1: 42 MG Road
                line2: Indiranagar
                city: Bengaluru
                state: Karnataka
                zipCode: '560038'
              udf:
                udf1: electronics
                udf2: app-checkout
                udf3: null
                udf4: null
                udf5: null
              siDetails:
                billingAmount: 2000
                billingCycle: MONTHLY
                billingInterval: 12
                paymentStartDate: '2026-11-01'
                paymentEndDate: '2027-10-31'
                isNoExpiry: false
                isFreeTrial: false
                remarks: SIP — mutual fund folio 9104927822
                bankDetails:
                  bankCode: SBIIN
                  bankAccountNumber: '1234567890'
                  ifsc: SBIN0001234
                  accountType: SAVINGS
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    description: Human-readable response message.
                    example: paymentLink generated
                  result:
                    type: object
                    nullable: true
                    description: The created Payment Link object.
                    properties:
                      invoiceNumber:
                        type: string
                        description: >-
                          Unique identifier. Use as the path parameter in Fetch,
                          Update, Share, and Cancel.
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        description: The shareable URL to send to your customer.
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount:
                        type: integer
                        description: >-
                          `subAmount + tax + shippingCharge`. `null` for Open
                          Amount and SI/eNACH links.
                        example: 1499
                      active:
                        type: boolean
                        description: '`true` if the link is live and accepting payment.'
                        example: true
                      expiryDate:
                        type: string
                        description: Link expiry in `YYYY-MM-DD HH:mm:ss`.
                        example: '2026-10-15 23:59:59'
                  errorCode:
                    type: string
                    nullable: true
                    example: null
              examples:
                success:
                  summary: Link created successfully
                  value:
                    status: 0
                    message: paymentLink generated
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount: 1499
                      active: true
                      expiryDate: '2026-10-15 23:59:59'
                    errorCode: null
        '400':
          description: >
            Validation or business-rule failure. The response body uses:

            - `status: -1`

            - `message` with a human-readable description

            - `result: null`


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents the error body patterns returned when `status: -1`.


            **Request errors** *(no error code — match on `message`)*


            <details>

            <summary>description is required</summary>


            - **Code:** *(none)*

            - **Cause:** The `description` field was omitted from the request
            body.

            - **Recommended fix:** Include a non-empty `description` string (max
            255 characters) describing the payment purpose.


            </details>


            <details>

            <summary>source is required</summary>


            - **Code:** *(none)*

            - **Cause:** The `source` field was omitted.

            - **Recommended fix:** Set `source` to `"API"` for standard links or
            `"si_payment_link"` for SI Recurring and eNACH links.


            </details>


            <details>

            <summary>subAmount must be greater than 0</summary>


            - **Code:** *(none)*

            - **Cause:** `subAmount` was 0 or a negative value.

            - **Recommended fix:** Pass a positive integer for `subAmount`. For
            open-amount links, omit `subAmount` entirely and set
            `isAmountFilledByCustomer: true`.


            </details>


            <details>

            <summary>Invoice Number already exists</summary>


            - **Code:** *(none)*

            - **Cause:** A payment link with the same `invoiceNumber` already
            exists under this merchant account.

            - **Recommended fix:** Use a unique `invoiceNumber` per link, or
            omit the field to let PayU auto-generate one.


            </details>


            <details>

            <summary>Invalid date format for expiryDate / expiryDate must be a
            future date</summary>


            - **Code:** *(none)*

            - **Cause:** `expiryDate` is either in the wrong format or is a past
            datetime.

            - **Recommended fix:** Use the exact format `YYYY-MM-DD HH:mm:ss`
            (e.g. `2026-10-15 23:59:59`) and ensure the value is in the future.


            </details>


            <details>

            <summary>customer email is required when viaEmail is true</summary>


            - **Code:** *(none)*

            - **Cause:** `viaEmail` was `true` but `customer.email` was not
            provided.

            - **Recommended fix:** Include `customer.email` whenever `viaEmail:
            true`.


            </details>


            <details>

            <summary>customer phone is required when viaSms or viaWhatsapp is
            true</summary>


            - **Code:** *(none)*

            - **Cause:** `viaSms` or `viaWhatsapp` was `true` but
            `customer.phone` was not provided.

            - **Recommended fix:** Include a 10-digit `customer.phone` whenever
            `viaSms: true` or `viaWhatsapp: true`.


            </details>


            **SI Recurring / eNACH errors**


            <details>

            <summary>siDetails is required when source is
            si_payment_link</summary>


            - **Code:** *(none)*

            - **Cause:** `source` was set to `"si_payment_link"` but the
            `siDetails` object was omitted.

            - **Recommended fix:** Include `siDetails` with `billingAmount`,
            `billingCycle`, `billingInterval`, `paymentStartDate`, and
            `paymentEndDate`.


            </details>


            <details>

            <summary>bankDetails is required when enforcePayMethod is
            enach</summary>


            - **Code:** *(none)*

            - **Cause:** `enforcePayMethod` was `"enach"` but
            `siDetails.bankDetails` was omitted.

            - **Recommended fix:** Include `siDetails.bankDetails` with
            `bankCode`, `bankAccountNumber`, `ifsc`, and `accountType`.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Always `-1` for error responses.
                    example: -1
                  message:
                    type: string
                    description: Human-readable error message.
                    example: description is required.
                  result:
                    nullable: true
                    description: Always `null` for error responses.
                    example: null
                  errorCode:
                    type: string
                    nullable: true
                    description: Error code, when applicable.
                    example: null
              examples:
                missingDescription:
                  summary: Missing description
                  value:
                    status: -1
                    message: description is required.
                    result: null
                    errorCode: null
                duplicateInvoice:
                  summary: Duplicate invoiceNumber
                  value:
                    status: -1
                    message: >-
                      Invoice Number already exists. Please enter new invoice
                      number.
                    result: null
                    errorCode: null
                missingPhone:
                  summary: Phone required for SMS
                  value:
                    status: -1
                    message: >-
                      customer phone is required when viaSms or viaWhatsapp is
                      true.
                    result: null
                    errorCode: null
        '401':
          description: >
            Authentication failure.


            <details>

            <summary><code>invalid_token</code>: Access token is invalid or has
            expired</summary>


            - **Code:** `invalid_token`

            - **Cause:** The Bearer token is missing, malformed, expired, or has
            been revoked.

            - **Recommended fix:** Generate a new token via `POST /oauth/token`
            and retry.


            </details>


            <details>

            <summary><code>insufficient_scope</code>: Token missing required
            scope</summary>


            - **Code:** `insufficient_scope`

            - **Cause:** The token was issued without the scope required by this
            endpoint.

            - **Recommended fix:** Re-generate the token including the correct
            scope. See the Authentication overview for scope requirements per
            endpoint.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
components:
  schemas:
    StandardPaymentLinkRequest:
      title: Standard Payment Link
      type: object
      required:
        - description
        - source
        - subAmount
      properties:
        subAmount:
          type: integer
          description: >
            Base payment amount in whole INR.


            - **Standard / Partial Payment:** Required. Must be greater than 0.

            - **Open Amount:** Omit — set `isAmountFilledByCustomer: true`
            instead.

            - **SI Recurring / eNACH:** Omit — use `siDetails.billingAmount` for
            the per-cycle debit.
          example: 1499
        description:
          type: string
          description: >-
            Purpose of the payment. Shown to the customer on the checkout page.
            Maximum 255 characters.
          example: 'Order #ORD-2026-88421 — Wireless Headphones'
        source:
          type: string
          description: >
            Identifies the link category.


            - `"API"` — Standard, Open Amount, or Partial Payment links.

            - `"si_payment_link"` — SI Recurring and eNACH mandate registration
            links.
          enum:
            - API
            - si_payment_link
          example: API
        invoiceNumber:
          type: string
          description: >
            Your unique reference ID for this link. Alphanumeric, maximum 25
            characters.

            Auto-generated by PayU if omitted. Used as the path parameter in all
            subsequent

            Fetch, Update, Share, and Cancel calls.
          example: ORD-2026-88421
        expiryDate:
          type: string
          description: >
            Link expiry in `YYYY-MM-DD HH:mm:ss` format. After this datetime the
            link stops

            accepting payments. Defaults to 7 days from creation.
          example: '2026-10-15 23:59:59'
        currency:
          type: string
          description: ISO 4217 currency code. Defaults to `INR`.
          example: INR
        tax:
          type: integer
          description: Tax amount in INR added to `subAmount`. Defaults to 0.
          example: 0
        shippingCharge:
          type: integer
          description: Shipping charge in INR added to `subAmount`. Defaults to 0.
          example: 0
        discount:
          type: integer
          description: Discount amount in INR subtracted from `subAmount`. Defaults to 0.
          example: 0
        maxPaymentsAllowed:
          type: integer
          description: Maximum successful payment attempts allowed. Defaults to 1.
          example: 1
        viaEmail:
          type: boolean
          description: >-
            Send the link to `customer.email` via email on creation. Requires
            `customer.email`.
          example: true
        viaSms:
          type: boolean
          description: >-
            Send the link to `customer.phone` via SMS on creation. Requires
            `customer.phone`.
          example: true
        viaWhatsapp:
          type: boolean
          description: >-
            Send the link to `customer.phone` via WhatsApp on creation. Requires
            `customer.phone`.
          example: false
        successURL:
          type: string
          description: URL to redirect the customer after a successful payment.
          example: https://yourstore.com/payment/success
        failureURL:
          type: string
          description: URL to redirect the customer after a failed or cancelled payment.
          example: https://yourstore.com/payment/failure
        enforcePayMethod:
          type: string
          description: >
            Restrict checkout to specific payment methods. Separate multiple
            values with `|`.


            - **eNACH links:** Must be `"enach"` — renders the bank mandate
            registration flow.

            - **Other links:** e.g. `"cc|dc"` (cards only), `"upi"` (UPI only),
            `"nb"` (net banking only).
          example: cc|dc
        dropCategory:
          type: string
          description: >
            Hide specific payment categories from checkout. Separate values with
            `|`.

            Example: `"EMI"` hides the EMI option.
          example: EMI
        customer:
          type: object
          description: >-
            Customer contact details. Required when using `viaEmail`, `viaSms`,
            or `viaWhatsapp`.
          properties:
            name:
              type: string
              description: Customer's full name. Shown on the checkout page.
              example: Arjun Mehta
            email:
              type: string
              description: Customer's email address. Required when `viaEmail` is `true`.
              example: arjun.mehta@example.com
            phone:
              type: string
              description: >-
                Customer's 10-digit mobile number. Required when `viaSms` or
                `viaWhatsapp` is `true`.
              example: '9876543210'
        address:
          type: object
          description: >-
            Customer billing address. Stored against the link and passed through
            to webhooks.
          properties:
            line1:
              type: string
              example: 42 MG Road
            line2:
              type: string
              example: Indiranagar
            city:
              type: string
              example: Bengaluru
            state:
              type: string
              example: Karnataka
            zipCode:
              type: string
              example: '560038'
        udf:
          type: object
          description: >
            User-defined fields 1–5. Stored against the link and passed through
            unchanged to

            webhook callbacks. Use for internal order IDs, customer segments, or
            campaign codes.
          properties:
            udf1:
              type: string
              example: electronics
            udf2:
              type: string
              example: app-checkout
            udf3:
              type: string
            udf4:
              type: string
            udf5:
              type: string
    OpenAmountPaymentLinkRequest:
      title: Open Amount Payment Link
      type: object
      required:
        - description
        - source
        - isAmountFilledByCustomer
      properties:
        description:
          type: string
          description: >-
            Purpose of the payment. Shown to the customer on the checkout page.
            Maximum 255 characters.
          example: 'Order #ORD-2026-88421 — Wireless Headphones'
        source:
          type: string
          description: >
            Identifies the link category.


            - `"API"` — Standard, Open Amount, or Partial Payment links.

            - `"si_payment_link"` — SI Recurring and eNACH mandate registration
            links.
          enum:
            - API
            - si_payment_link
          example: API
        isAmountFilledByCustomer:
          type: boolean
          description: >
            **Open Amount links only.** Set to `true` to let the customer enter
            their own

            payment amount at checkout. Mutually exclusive with
            `isPartialPaymentAllowed`.

            When `true`, omit `subAmount`.
          example: false
        invoiceNumber:
          type: string
          description: >
            Your unique reference ID for this link. Alphanumeric, maximum 25
            characters.

            Auto-generated by PayU if omitted. Used as the path parameter in all
            subsequent

            Fetch, Update, Share, and Cancel calls.
          example: ORD-2026-88421
        expiryDate:
          type: string
          description: >
            Link expiry in `YYYY-MM-DD HH:mm:ss` format. After this datetime the
            link stops

            accepting payments. Defaults to 7 days from creation.
          example: '2026-10-15 23:59:59'
        currency:
          type: string
          description: ISO 4217 currency code. Defaults to `INR`.
          example: INR
        maxPaymentsAllowed:
          type: integer
          description: Maximum successful payment attempts allowed. Defaults to 1.
          example: 1
        viaEmail:
          type: boolean
          description: >-
            Send the link to `customer.email` via email on creation. Requires
            `customer.email`.
          example: true
        viaSms:
          type: boolean
          description: >-
            Send the link to `customer.phone` via SMS on creation. Requires
            `customer.phone`.
          example: true
        viaWhatsapp:
          type: boolean
          description: >-
            Send the link to `customer.phone` via WhatsApp on creation. Requires
            `customer.phone`.
          example: false
        successURL:
          type: string
          description: URL to redirect the customer after a successful payment.
          example: https://yourstore.com/payment/success
        failureURL:
          type: string
          description: URL to redirect the customer after a failed or cancelled payment.
          example: https://yourstore.com/payment/failure
        dropCategory:
          type: string
          description: >
            Hide specific payment categories from checkout. Separate values with
            `|`.

            Example: `"EMI"` hides the EMI option.
          example: EMI
        customer:
          type: object
          description: >-
            Customer contact details. Required when using `viaEmail`, `viaSms`,
            or `viaWhatsapp`.
          properties:
            name:
              type: string
              description: Customer's full name. Shown on the checkout page.
              example: Arjun Mehta
            email:
              type: string
              description: Customer's email address. Required when `viaEmail` is `true`.
              example: arjun.mehta@example.com
            phone:
              type: string
              description: >-
                Customer's 10-digit mobile number. Required when `viaSms` or
                `viaWhatsapp` is `true`.
              example: '9876543210'
        address:
          type: object
          description: >-
            Customer billing address. Stored against the link and passed through
            to webhooks.
          properties:
            line1:
              type: string
              example: 42 MG Road
            line2:
              type: string
              example: Indiranagar
            city:
              type: string
              example: Bengaluru
            state:
              type: string
              example: Karnataka
            zipCode:
              type: string
              example: '560038'
        udf:
          type: object
          description: >
            User-defined fields 1–5. Stored against the link and passed through
            unchanged to

            webhook callbacks. Use for internal order IDs, customer segments, or
            campaign codes.
          properties:
            udf1:
              type: string
              example: electronics
            udf2:
              type: string
              example: app-checkout
            udf3:
              type: string
            udf4:
              type: string
            udf5:
              type: string
    PartialPaymentLinkRequest:
      title: Partial Payment Link
      type: object
      required:
        - description
        - source
        - subAmount
        - isPartialPaymentAllowed
      properties:
        subAmount:
          type: integer
          description: >
            Base payment amount in whole INR.


            - **Standard / Partial Payment:** Required. Must be greater than 0.

            - **Open Amount:** Omit — set `isAmountFilledByCustomer: true`
            instead.

            - **SI Recurring / eNACH:** Omit — use `siDetails.billingAmount` for
            the per-cycle debit.
          example: 1499
        description:
          type: string
          description: >-
            Purpose of the payment. Shown to the customer on the checkout page.
            Maximum 255 characters.
          example: 'Order #ORD-2026-88421 — Wireless Headphones'
        source:
          type: string
          description: >
            Identifies the link category.


            - `"API"` — Standard, Open Amount, or Partial Payment links.

            - `"si_payment_link"` — SI Recurring and eNACH mandate registration
            links.
          enum:
            - API
            - si_payment_link
          example: API
        isPartialPaymentAllowed:
          type: boolean
          description: >
            **Partial Payment links only.** Set to `true` to allow the customer
            to pay less

            than the total amount. Requires `subAmount`. Mutually exclusive with

            `isAmountFilledByCustomer`.
          example: false
        minAmountForCustomer:
          type: integer
          description: >
            **Partial Payment links only.** Minimum amount (INR) the customer
            must pay in

            the first transaction. Ignored unless `isPartialPaymentAllowed` is
            `true`.
          example: 500
        invoiceNumber:
          type: string
          description: >
            Your unique reference ID for this link. Alphanumeric, maximum 25
            characters.

            Auto-generated by PayU if omitted. Used as the path parameter in all
            subsequent

            Fetch, Update, Share, and Cancel calls.
          example: ORD-2026-88421
        expiryDate:
          type: string
          description: >
            Link expiry in `YYYY-MM-DD HH:mm:ss` format. After this datetime the
            link stops

            accepting payments. Defaults to 7 days from creation.
          example: '2026-10-15 23:59:59'
        currency:
          type: string
          description: ISO 4217 currency code. Defaults to `INR`.
          example: INR
        tax:
          type: integer
          description: Tax amount in INR added to `subAmount`. Defaults to 0.
          example: 0
        shippingCharge:
          type: integer
          description: Shipping charge in INR added to `subAmount`. Defaults to 0.
          example: 0
        discount:
          type: integer
          description: Discount amount in INR subtracted from `subAmount`. Defaults to 0.
          example: 0
        maxPaymentsAllowed:
          type: integer
          description: Maximum successful payment attempts allowed. Defaults to 1.
          example: 1
        viaEmail:
          type: boolean
          description: >-
            Send the link to `customer.email` via email on creation. Requires
            `customer.email`.
          example: true
        viaSms:
          type: boolean
          description: >-
            Send the link to `customer.phone` via SMS on creation. Requires
            `customer.phone`.
          example: true
        viaWhatsapp:
          type: boolean
          description: >-
            Send the link to `customer.phone` via WhatsApp on creation. Requires
            `customer.phone`.
          example: false
        successURL:
          type: string
          description: URL to redirect the customer after a successful payment.
          example: https://yourstore.com/payment/success
        failureURL:
          type: string
          description: URL to redirect the customer after a failed or cancelled payment.
          example: https://yourstore.com/payment/failure
        enforcePayMethod:
          type: string
          description: >
            Restrict checkout to specific payment methods. Separate multiple
            values with `|`.


            - **eNACH links:** Must be `"enach"` — renders the bank mandate
            registration flow.

            - **Other links:** e.g. `"cc|dc"` (cards only), `"upi"` (UPI only),
            `"nb"` (net banking only).
          example: cc|dc
        dropCategory:
          type: string
          description: >
            Hide specific payment categories from checkout. Separate values with
            `|`.

            Example: `"EMI"` hides the EMI option.
          example: EMI
        customer:
          type: object
          description: >-
            Customer contact details. Required when using `viaEmail`, `viaSms`,
            or `viaWhatsapp`.
          properties:
            name:
              type: string
              description: Customer's full name. Shown on the checkout page.
              example: Arjun Mehta
            email:
              type: string
              description: Customer's email address. Required when `viaEmail` is `true`.
              example: arjun.mehta@example.com
            phone:
              type: string
              description: >-
                Customer's 10-digit mobile number. Required when `viaSms` or
                `viaWhatsapp` is `true`.
              example: '9876543210'
        address:
          type: object
          description: >-
            Customer billing address. Stored against the link and passed through
            to webhooks.
          properties:
            line1:
              type: string
              example: 42 MG Road
            line2:
              type: string
              example: Indiranagar
            city:
              type: string
              example: Bengaluru
            state:
              type: string
              example: Karnataka
            zipCode:
              type: string
              example: '560038'
        udf:
          type: object
          description: >
            User-defined fields 1–5. Stored against the link and passed through
            unchanged to

            webhook callbacks. Use for internal order IDs, customer segments, or
            campaign codes.
          properties:
            udf1:
              type: string
              example: electronics
            udf2:
              type: string
              example: app-checkout
            udf3:
              type: string
            udf4:
              type: string
            udf5:
              type: string
