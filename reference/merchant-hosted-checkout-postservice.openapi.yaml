openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-payu-error-code-datasets:
  developer_guide_page: reference/Collect Payment/error-codes.md
  published_error_codes: https://docs.payu.in/reference/error-codes
  searchable_table_json:
    payment_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/payment-error-codes.json
    other_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/other-error-codes.json
    issuer_decline_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/issuer-decline-error-codes.json
    field7_card_payments: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/field7-card-payments.json
    auth_n_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/auth-n-error-codes.json
    auth_z_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/auth-z-error-codes.json
    alt_id_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/alt-id-error-codes.json
    netbanking_wallets: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/netbanking-wallets.json
    upi_error_codes: >-
      https://raw.githubusercontent.com/palgunams21/payu-docs-assets/refs/heads/main/data/upi-error-codes.json
info:
  title: Merchant Hosted Checkout — merchant/postservice and postservice.php
  version: 1.0.0
  description: >
    OpenAPI 3.1 for **all** `postservice` / `postservice.php` command requests
    in

    `Postman Collection/Merchant Hosted Checkout.postman_collection (1).json` on
    host `test.payu.in`.


    **Path 1 —** `POST /merchant/postservice` with query **`form=2`**
    (required): BIN and EMI helpers

    plus **verify_payment** (same body as in the Verify Payment API Reference,
    which uses this URL).


    **Path 2 —** `POST /merchant/postservice.php`: **getNetBankingStatus**,
    **get_checkout_details** (no `form` in Postman),

    and **verify_payment** with **`form=2`** (as in Postman).


    Discriminate requests with **`command`** + **`allOf`** + **`oneOf`** (same
    pattern as

    `API Collection/merchant-hosted-card-postservice-form2.openapi.yaml`).


    Error catalogues: `x-payu-error-code-datasets` and
    `components.examples.CuratedCardBinHashRelatedErrorCodes`.
externalDocs:
  description: PayU India API Reference (introduction)
  url: https://docs.payu.in/reference/introduction-api-reference
servers:
  - url: https://test.payu.in
    description: Test environment
  - url: https://info.payu.in
    description: Production environment (per PayU General APIs documentation)
tags:
  - name: MerchantHostedPostservice
    description: >-
      Merchant Hosted Checkout — postservice (form=2) and postservice.php
      commands from the Postman collection
    externalDocs:
      description: PayU error codes (API Reference)
      url: https://docs.payu.in/reference/error-codes
paths:
  /merchant/postservice:
    post:
      operationId: merchantPostserviceForm2Checkout
      summary: General APIs for Cards
      description: >
        `application/x-www-form-urlencoded`. Query **`form=2`** is **required**.


        Postman: Cards and EMI helpers; **verify_payment** samples in API
        Reference use this path (Postman duplicate under `.php` is described on
        `POST /merchant/postservice.php`).


        References: `reference/General/bin-apis/get_bin_info_api.md`,
        `reference/General/bin-apis/check_is_domestic_api.md`,

        `reference/General/emi-apis/get_emi_according_to_interest_api/index.md`,
        `reference/General/emi-apis/eligiblebinsforemi.md`,

        `reference/General/check-transaction-apis/verify_payment_api.md`.
      tags:
        - MerchantHostedPostservice
      parameters:
        - name: form
          in: query
          required: true
          description: Must be `2`.
          schema:
            type: string
            const: '2'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/PostserviceForm2CommandSelector'
                - type: object
                  oneOf:
                    - $ref: '#/components/schemas/GetBinInfoFormBody'
                    - $ref: '#/components/schemas/CheckIsDomesticFormBody'
                    - $ref: >-
                        #/components/schemas/GetEmiAmountAccordingToInterestFormBody
                    - $ref: '#/components/schemas/EligibleBinsForEmiFormBody'
                    - $ref: '#/components/schemas/VerifyPaymentFormBody'
                  discriminator:
                    propertyName: command
                    mapping:
                      getBinInfo: '#/components/schemas/GetBinInfoFormBody'
                      check_isDomestic: '#/components/schemas/CheckIsDomesticFormBody'
                      getEmiAmountAccordingToInterest: >-
                        #/components/schemas/GetEmiAmountAccordingToInterestFormBody
                      eligibleBinsForEMI: '#/components/schemas/EligibleBinsForEmiFormBody'
                      verify_payment: '#/components/schemas/VerifyPaymentFormBody'
            examples:
              getBinInfo:
                summary: getBinInfo (Postman — Cards)
                value:
                  command: getBinInfo
                  key: '{{merchant_key}}'
                  var1: '2'
                  var2: '512345'
                  var3: ''
                  var4: ''
                  var5: '1'
                  hash: '{{server_generated_hash}}'
              check_isDomestic:
                summary: check_isDomestic (Postman — Cards)
                value:
                  command: check_isDomestic
                  key: '{{merchant_key}}'
                  var1: '462273'
                  hash: '{{server_generated_hash}}'
              getEmiAmountAccordingToInterest:
                summary: getEmiAmountAccordingToInterest (Postman — EMI)
                value:
                  command: getEmiAmountAccordingToInterest
                  key: '{{merchant_key}}'
                  var1: '20000'
                  hash: '{{server_generated_hash}}'
              verify_payment:
                summary: verify_payment (API Reference URL — same path without .php)
                value:
                  command: verify_payment
                  key: '{{merchant_key}}'
                  var1: '{{txnid}}'
                  hash: '{{server_generated_hash}}'
              eligibleBinsForEMI:
                summary: eligibleBinsForEMI (Postman — EMI)
                value:
                  command: eligibleBinsForEMI
                  key: '{{merchant_key}}'
                  var1: Bin
                  var2: '512345'
                  hash: '{{server_generated_hash}}'
      responses:
        '200':
          description: Command-specific JSON or text; see each API Reference page.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GetBinInfoResponseWrapper'
                  - $ref: '#/components/schemas/CheckIsDomesticResponse'
                  - $ref: '#/components/schemas/PostserviceGenericJsonResponse'
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request.
        '401':
          description: Authentication or hash failure.
        '500':
          description: Server error.
  /merchant/postservice.php:
    post:
      operationId: merchantPostservicePhpCheckout
      summary: General APIs for Net Banking
      description: >
        `application/x-www-form-urlencoded`. Postman uses this path for
        **getNetBankingStatus** and

        **get_checkout_details** without `form`, and **verify_payment** with
        **`form=2`**.


        References:
        `reference/General/health-check-apis/get_net_banking_status_api.md`,

        `reference/General/get_checkout_details/index.md`,

        `reference/General/check-transaction-apis/verify_payment_api.md`.
      tags:
        - MerchantHostedPostservice
      parameters:
        - name: form
          in: query
          required: false
          description: >
            Use **`2`** for **verify_payment** (Postman). Omit for
            **getNetBankingStatus** and **get_checkout_details** in the
            collection.
          schema:
            type: string
            enum:
              - '2'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - $ref: '#/components/schemas/PostservicePhpCommandSelector'
                - type: object
                  oneOf:
                    - $ref: '#/components/schemas/GetNetBankingStatusFormBody'
                    - $ref: '#/components/schemas/GetCheckoutDetailsFormBody'
                    - $ref: '#/components/schemas/VerifyPaymentFormBody'
                  discriminator:
                    propertyName: command
                    mapping:
                      getNetBankingStatus: '#/components/schemas/GetNetBankingStatusFormBody'
                      get_checkout_details: '#/components/schemas/GetCheckoutDetailsFormBody'
                      verify_payment: '#/components/schemas/VerifyPaymentFormBody'
            examples:
              getNetBankingStatus:
                summary: getNetBankingStatus (Postman — Net Banking)
                value:
                  command: getNetBankingStatus
                  key: '{{merchant_key}}'
                  var1: default
                  hash: '{{server_generated_hash}}'
              get_checkout_details:
                summary: get_checkout_details (Postman — EMI / BNPL)
                value:
                  command: get_checkout_details
                  key: '{{merchant_key}}'
                  var1: >-
                    {"transactionDetails":{"amount":"100.00","txnid":"asdusucbshb"},"usecase":{"checkDownStatus":"true"},"requestId":"yegdyyshds"}
                  hash: '{{server_generated_hash}}'
              verify_payment:
                summary: verify_payment (Postman — Net Banking / Cards / UPI / Wallets)
                value:
                  command: verify_payment
                  key: '{{merchant_key}}'
                  var1: '{{txnid}}'
                  hash: '{{server_generated_hash}}'
      responses:
        '200':
          description: Command-specific response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostserviceGenericJsonResponse'
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request.
        '401':
          description: Authentication or hash failure.
        '500':
          description: Server error.
components:
  examples:
    CuratedCardBinHashRelatedErrorCodes:
      summary: >-
        Curated payu-docs-assets error rows (see x-payu-error-code-datasets for
        full tables).
      value:
        - errors: E000
          error_message: No Error
          error_description: Successful transaction
          title: NO_ERROR
        - errors: E700
          error_message: Validation of secure hash failed
          error_description: SECURE_HASH_FAILURE
          title: SECURE_HASH_FAILURE
        - errors: E908
          error_message: International cards not allowed
          error_description: UNKNOWN_BINS_NO_ACTIVE_PG_ASSIGNED
          title: UNKNOWN_BINS_NO_ACTIVE_PG_ASSIGNED
        - errors: E4934
          error_message: Invalid BIN
          error_description: Bin Not Found
          title: INVALID_BIN
        - errors: E306
          error_message: Card authentication failure
          error_description: TRANSACTION_INVALID_PG
          title: TRANSACTION_INVALID_PG
        - errors: E335
          error_message: Transaction failed due to incomplete authentication process
          error_description: The cardholder is enrolled in Payer Authentication. Please authe
          title: AUTHENTICATION_INCOMPLETE
        - errors: E303
          error_message: Payer could not be authenticated
          error_description: Encountered a Payer Authentication problem. Payer could not be a
          title: AUTHENTICATION_ERROR
        - errors: E500
          error_message: Bank failed to authenticate the customer
          error_description: UNKNOWN_ERROR_PG
          title: UNKNOWN_ERROR_PG
        - errors: E910
          error_message: EMI is not supported on this card
          error_description: INVALID_EMI_CARD_BIN
          title: INVALID_EMI_CARD_BIN
        - errors: EX014
          error_message: 'Merchant Param: Key not supplied'
          error_description: MERCHANT_PARAM_KEY_EMPTY
          title: 'Merchant Param: Key not supplied'
        - errors: EX023
          error_message: Verifier hash mismatch
          error_description: VERIFIER_MISMATCH
          title: Verifier hash mismatch
        - errors: EX013
          error_message: Insufficient Input
          error_description: INSUFFICIENT_INPUT
          title: Insufficient Input
        - errors: EX025
          error_message: Merchant not found
          error_description: MERCHANT_NOT_FOUND
          title: Merchant not found
  schemas:
    PostserviceForm2CommandSelector:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - getBinInfo
            - check_isDomestic
            - getEmiAmountAccordingToInterest
            - eligibleBinsForEMI
            - verify_payment
          description: >
            Commands using **`/merchant/postservice?form=2`** (this OpenAPI file
            omits **validateVPA**; use the Validate VPA API Reference if you
            need that command).
    PostservicePhpCommandSelector:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - getNetBankingStatus
            - get_checkout_details
            - verify_payment
          description: >
            Commands using **`/merchant/postservice.php`** in the Postman
            collection.

            Some API Reference samples use **`getNetbankingStatus`** casing;
            Postman uses **`getNetBankingStatus`** — use the spelling your
            integration was built against.
    PayUSearchableErrorTableJSON:
      type: object
      required:
        - headers
        - codeColumns
        - rows
      properties:
        headers:
          type: array
          items:
            type: string
        codeColumns:
          type: array
          items:
            type: integer
        rows:
          type: array
          items:
            type: array
            items:
              type: string
    GetNetBankingStatusFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - hash
      properties:
        key:
          type: string
        command:
          type: string
          enum:
            - getNetBankingStatus
          description: >-
            Postman value; see also get_net_banking_status_api.md for alternate
            casing in samples.
        var1:
          type: string
          description: >-
            Use `default` for all banks or a net banking bank code (see Net
            Banking Codes in docs).
        hash:
          type: string
          description: >-
            SHA-512: `sha512(key|command|var1|salt)` per Get Net Banking Status
            API.
    GetCheckoutDetailsFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - hash
      properties:
        key:
          type: string
        command:
          type: string
          enum:
            - get_checkout_details
        var1:
          type: string
          description: >-
            JSON string for transaction details, use case, requestId, etc. See
            `reference/General/get_checkout_details/index.md`.
        hash:
          type: string
          description: >-
            Request integrity hash per Get Checkout Details documentation
            (generate per PayU hashing rules for this command).
    VerifyPaymentFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - hash
      properties:
        key:
          type: string
        command:
          type: string
          enum:
            - verify_payment
        var1:
          type: string
          description: >-
            Transaction id(s) — txnid from your server; pipe-separated for
            multiple (see verify_payment_api.md).
        hash:
          type: string
          description: >-
            SHA-512: `sha512(key|command|var1|salt)` per Verify Payment API
            Reference.
    GetBinInfoFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - hash
      properties:
        key:
          type: string
          description: >
            Merchant key provided by PayU for authentication. For key and salt
            generation see

            Production: Generate Merchant Key and Salt on PayU Dashboard; Test:
            Generate Test Merchant Key and Salt

            (linked from the API Reference pages).
        command:
          type: string
          enum:
            - getBinInfo
          description: >-
            Must be `getBinInfo` for the Get BIN Info API (see
            `PostserviceForm2CommandSelector.command`).
        var1:
          type: string
          description: >
            Mode selector:

            - **1** — Single BIN-level information (output for one BIN only).

            - **2** — Feature-level information; returns BIN lists for the
            chosen feature in `var2`.

            - **3** — All BINs and their information (paginate with `var3` /
            `var4`).

            See `reference/General/bin-apis/get_bin_info_api.md` (use-case table
            for var1–var5 combinations).
          enum:
            - '1'
            - '2'
            - '3'
        var2:
          type: string
          description: >
            Interpretation depends on `var1`:

            - If `var1` = **1**, pass the BIN (typically 6–9 digits; 9-digit BIN
            recommended for accuracy).

            - If `var1` = **2**, pass **1** for ATM PIN support BIN list, or
            **2** for OTP-on-the-fly (IVR) BIN list.

            - If `var1` = **3**, leave empty (invalid to pass a BIN in `var2`
            when `var1` is 3).
        var3:
          type: string
          description: >
            Start index for paginated / list modes. Defaults to **0** when
            omitted (per API Reference).

            Used when requesting multiple cards (e.g. `var1` = 2 or 3).
        var4:
          type: string
          description: >
            Page size / offset (number of BIN records per page). Default **100**
            when omitted.

            Adjust with `var3` for pagination (see use-case table in Get BIN
            Info API Reference).
        var5:
          type: string
          description: >
            When `var1` = **1** and `var5` = **1**, the response can include
            extra fields

            `is_zero_redirect_supported` and `is_si_supported`. For `var1` =
            **2** or **3**,

            use **0** or **1** per the Get BIN Info API Reference; extra SI /
            zero-redirect flags

            are not returned the same way as for single-BIN mode. Optional
            `var7` (not modelled here)

            can be used to receive `messageVersion` in the response when enabled
            — contact your

            PayU Key Account Manager (KAM) for `additionalCardType` / related
            enablement.
        hash:
          type: string
          description: >
            SHA-512 checksum for request integrity. **Sequence:**
            `sha512(key|command|var1|salt)`

            (pipe-separated, then hash with merchant salt). Regenerate when any
            hashed field changes.
    CheckIsDomesticFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - hash
      properties:
        key:
          type: string
        command:
          type: string
          enum:
            - check_isDomestic
        var1:
          type: string
          pattern: ^[0-9]{6}$
        hash:
          type: string
          description: 'SHA-512: `sha512(key|command|var1|salt)`.'
    GetEmiAmountAccordingToInterestFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - hash
      properties:
        key:
          type: string
        command:
          type: string
          enum:
            - getEmiAmountAccordingToInterest
        var1:
          type: string
        hash:
          type: string
          description: 'SHA-512: `sha512(key|command|var1|salt)`.'
    EligibleBinsForEmiFormBody:
      type: object
      required:
        - key
        - command
        - var1
        - var2
        - hash
      properties:
        key:
          type: string
        command:
          type: string
          enum:
            - eligibleBinsForEMI
        var1:
          type: string
          description: '`Bin` or `NET` per Eligible BINs for EMI API.'
        var2:
          type: string
        var3:
          type: string
          description: Optional bank name filter.
        hash:
          type: string
          description: 'SHA-512: `sha512(key|command|var1|salt)` per eligiblebinsforemi.md.'
    GetBinInfoResponseWrapper:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: integer
          enum:
            - 0
            - 1
          description: 1 success; 0 failure (see Get BIN Info API Reference).
        data:
          description: >-
            BIN payload or error message string when status is 0 — see Get BIN
            Info API Reference.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
    CheckIsDomesticResponse:
      type: object
      required:
        - isDomestic
        - issuingBank
        - cardType
        - cardCategory
      properties:
        isDomestic:
          type: string
          enum:
            - 'Y'
            - 'N'
        issuingBank:
          type: string
        cardType:
          type: string
        cardCategory:
          type: string
          enum:
            - CC
            - DC
    PostserviceGenericJsonResponse:
      type: object
      additionalProperties: true
