openapi: 3.0.0
info:
  title: Pre-debit and Recurring Payments Transaction
  description: API for creating pre-debit notifications and recurring payment transactions.
  version: 1.0.0
servers:
  - url: https://info.payu.in
    description: Production
  - url: https://test.payu.in
    description: Test
tags:
  - name: Subscription APIs
    description: APIs for pre-debit notifications and recurring payments.
paths:
  /merchant/postservice.php:
    post:
      operationId: createPredebitAndRecurringTransaction
      summary: Create a Pre-debit Notification and Recurring Payments Transaction
      description: |
        Creates a pre-debit notification or initiates a recurring payment
        transaction using the PayU subscription API.
      tags:
        - Subscription APIs
      parameters:
        - name: form
          in: query
          required: true
          description: Specifies the request form.
          schema:
            type: integer
            enum:
              - 2
            example: 2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - key
                - hash
                - command
                - var1
              properties:
                key:
                  type: string
                  description: PayU merchant key.
                  example: YOUR_MERCHANT_KEY
                hash:
                  type: string
                  description: |
                    SHA-512 hash generated using the parameters and hashing
                    sequence specified in the PayU integration documentation.
                  example: YOUR_GENERATED_HASH
                command:
                  type: string
                  description: PayU API command for the requested operation.
                  example: predebit
                var1:
                  type: string
                  description: |
                    JSON-formatted request data, URL-encoded as a form field.
                    Use the parameters required for the selected command.
                  example: '{"txnid":"YOUR_TRANSACTION_ID"}'
            encoding:
              var1:
                contentType: application/json
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: 1
                msg: Request processed successfully
        '400':
          description: Bad request. One or more parameters may be invalid or missing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: 0
                msg: Invalid request
        '401':
          description: Authentication failed or the supplied credentials are invalid.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      x-internal: true
