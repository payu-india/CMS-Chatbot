openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: PayU Payment Links API
  description: >
    Create, manage, and share payment links programmatically. Payment links are

    shareable URLs that let customers pay without a checkout integration.
    Supports

    fixed-amount, open-amount, partial payment, recurring (SI), and eNACH link
    types.

    See the [Payment Links product
    guide](https://docs.payu.in/docs/payment-links-overview).
  contact:
    name: PayU Developer Support
    url: https://developers.payu.in
  version: '1.0'
externalDocs:
  description: Payment Links — Product Guide
  url: https://docs.payu.in/docs/payment-links-overview
servers:
  - url: https://uatoneapi.payu.in
    description: Test (UAT)
  - url: https://oneapi.payu.in
    description: Production
paths:
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Get Access Token
      operationId: GetAccessTokenAPI
      description: >
        Exchange your `client_id` and `client_secret` for a short-lived Bearer
        token.

        Pass the returned `access_token` as `Authorization: Bearer
        {access_token}` in

        every subsequent Payment Links API call. A single token can carry up to
        three

        scopes simultaneously (space-separated).


        **Scopes:**

        - `create_payment_links` — Create Payment Link

        - `update_payment_links` — Update / Cancel Payment Link

        - `read_payment_links` — Fetch Payment Link · Fetch All · Share · Get
        Transaction Details
      deprecated: false
      security: []
      servers:
        - url: https://uat-accounts.payu.in
          description: Test (UAT)
        - url: https://accounts.payu.in
          description: Production
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
            examples:
              createLinks:
                summary: Token for creating payment links
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  grant_type: client_credentials
                  scope: create_payment_links
              allScopes:
                summary: Token with all three scopes
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  grant_type: client_credentials
                  scope: create_payment_links update_payment_links read_payment_links
      responses:
        '200':
          description: Token generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
              examples:
                success:
                  summary: Success – token returned
                  value:
                    access_token: >-
                      ea4ed864b4d2a04b90c1e987a5d25a5da1d43fa5f7d123be6814a1e973f196c4
                    token_type: Bearer
                    expires_in: 7200
                    scope: >-
                      create_payment_links update_payment_links
                      read_payment_links
                    created_at: 1763036368
        '401':
          description: Client authentication failure or invalid scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
              examples:
                invalidClient:
                  summary: Invalid client credentials
                  value:
                    error: invalid_client
                    error_description: >-
                      Client authentication failed due to unknown client, no
                      client authentication included, or unsupported
                      authentication method.
                invalidScope:
                  summary: Invalid scope
                  value:
                    error: invalid_scope
                    error_description: The requested scope is invalid, unknown, or malformed.
                unauthorizedClient:
                  summary: Unauthorized client
                  value:
                    error: unauthorized_client
                    error_description: >-
                      The authenticated client is not authorized to use this
                      authorization grant type.
                rateLimitExceeded:
                  summary: Rate limit exceeded
                  value:
                    error: rate_limit_exceeded
                    error_description: Too many requests. Please retry after some time.
                    retry_after: 60
                serverError:
                  summary: Server error
                  value:
                    error: server_error
                    error_description: >-
                      The authorization server encountered an unexpected
                      condition.
      x-readme:
        code-samples:
          - language: curl
            name: cURL
            code: >
              curl --location --request POST
              'https://uat-accounts.payu.in/oauth/token' \

              --header 'Content-Type: application/x-www-form-urlencoded' \

              --data-urlencode 'client_id={{client_id}}' \

              --data-urlencode 'client_secret={{client_secret}}' \

              --data-urlencode 'grant_type=client_credentials' \

              --data-urlencode 'scope=create_payment_links update_payment_links
              read_payment_links'
          - language: python
            name: Python
            code: |
              import requests

              response = requests.post(
                  "https://uat-accounts.payu.in/oauth/token",
                  data={
                      "client_id":     "{{client_id}}",
                      "client_secret": "{{client_secret}}",
                      "grant_type":    "client_credentials",
                      "scope":         "create_payment_links update_payment_links read_payment_links"
                  }
              )
              access_token = response.json()["access_token"]
          - language: php
            name: PHP
            code: |
              <?php
              $ch = curl_init('https://uat-accounts.payu.in/oauth/token');
              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_POST           => true,
                  CURLOPT_POSTFIELDS     => http_build_query([
                      'client_id'     => '{{client_id}}',
                      'client_secret' => '{{client_secret}}',
                      'grant_type'    => 'client_credentials',
                      'scope'         => 'create_payment_links update_payment_links read_payment_links'
                  ]),
                  CURLOPT_HTTPHEADER => ['Content-Type: application/x-www-form-urlencoded']
              ]);
              $data = json_decode(curl_exec($ch), true);
              echo $data['access_token'];
          - language: node
            name: Node.js
            code: |
              const axios = require('axios');
              const qs = require('querystring');

              const { data } = await axios.post(
                'https://uat-accounts.payu.in/oauth/token',
                qs.stringify({
                  client_id:     '{{client_id}}',
                  client_secret: '{{client_secret}}',
                  grant_type:    'client_credentials',
                  scope:         'create_payment_links update_payment_links read_payment_links'
                }),
                { headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }
              );
              const { access_token, expires_in } = data;
  /oauth/revoke:
    post:
      tags:
        - Authentication
      summary: Revoke Token API
      operationId: RevokeTokenAPI
      description: >
        Invalidate an existing Bearer token immediately, before its natural
        expiry.

        Use this when rotating credentials or when a token may have been
        exposed.


        A successful revocation returns **HTTP 200 with an empty body**. Any

        subsequent call using the revoked token will return `invalid_token`.
      deprecated: false
      security: []
      servers:
        - url: https://uat-accounts.payu.in
          description: Test (UAT)
        - url: https://accounts.payu.in
          description: Production
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthRevokeRequest'
            examples:
              basic:
                summary: Revoke a token
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  token: '{{access_token}}'
      responses:
        '200':
          description: >
            Token revoked successfully. Response body is empty.

            Any API call using the revoked token will now return
            `invalid_token`.
        '401':
          description: Invalid client credentials or token already invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
              examples:
                invalidClient:
                  summary: Invalid client credentials
                  value:
                    error: invalid_client
                    error_description: >-
                      Client authentication failed due to unknown client, no
                      client authentication included, or unsupported
                      authentication method.
                invalidToken:
                  summary: Token already invalid or revoked
                  value:
                    error: invalid_token
                    error_description: The token is invalid or has already been revoked.
      x-readme:
        code-samples:
          - language: curl
            name: cURL
            code: >
              curl --location --request POST
              'https://uat-accounts.payu.in/oauth/revoke' \

              --header 'Content-Type: application/x-www-form-urlencoded' \

              --data-urlencode 'client_id={{client_id}}' \

              --data-urlencode 'client_secret={{client_secret}}' \

              --data-urlencode 'token={{access_token}}'
          - language: python
            name: Python
            code: |
              import requests

              response = requests.post(
                  "https://uat-accounts.payu.in/oauth/revoke",
                  data={
                      "client_id":     "{{client_id}}",
                      "client_secret": "{{client_secret}}",
                      "token":         "{{access_token}}"
                  }
              )
              print(response.status_code)  # 200 = success
          - language: node
            name: Node.js
            code: |
              const axios = require('axios');
              const qs = require('querystring');

              const response = await axios.post(
                'https://uat-accounts.payu.in/oauth/revoke',
                qs.stringify({
                  client_id:     '{{client_id}}',
                  client_secret: '{{client_secret}}',
                  token:         '{{access_token}}'
                }),
                { headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }
              );
              console.log(response.status); // 200
  /payment-links:
    post:
      tags:
        - Payment Links
      summary: Create Payment Link
      operationId: CreatePaymentLinkAPI
      description: >
        Create Payment Link generates a new shareable payment link that you can

        send to your customer via SMS, email, or WhatsApp. Supports
        fixed-amount,

        open-amount, partial payment, recurring (SI), and eNACH link types.
      deprecated: false
      externalDocs:
        description: Payment Links product guide
        url: https://docs.payu.in/docs/payment-links-overview
      security:
        - httpBearer: []
      parameters:
        - name: merchantId
          in: header
          required: true
          description: >-
            Your PayU Merchant ID. Find this in the PayU Dashboard under Account
            Settings.
          schema:
            type: string
            example: '505678'
      requestBody:
        required: true
        description: >-
          Payment link creation parameters. `description` and `source` are
          always required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLinkRequest'
            examples:
              basic:
                summary: Basic fixed-amount link
                value:
                  subAmount: 1499
                  description: 'Order #ORD-2026-88421 – Wireless Headphones'
                  source: API
                  invoiceNumber: ORD-2026-88421
                  expiryDate: '2026-10-15 23:59:59'
                  customer:
                    name: Arjun Mehta
                    email: arjun.mehta@example.com
                    phone: '9876543210'
                  udf:
                    udf1: electronics
                    udf2: app-checkout
                  viaEmail: true
                  viaSms: true
                  isPartialPaymentAllowed: false
              openAmount:
                summary: Open-amount link (customer enters amount)
                value:
                  description: Donation – Help us plant trees
                  source: API
                  isAmountFilledByCustomer: true
                  customer:
                    name: Priya Sharma
                    email: priya.sharma@example.com
                    phone: '9123456789'
                  viaEmail: true
              partialPayment:
                summary: Partial payment link
                value:
                  subAmount: 5000
                  description: Advance booking – Photography session
                  source: API
                  isPartialPaymentAllowed: true
                  minAmountForCustomer: 1000
                  customer:
                    name: Rahul Gupta
                    email: rahul.gupta@example.com
                    phone: '9988776655'
                  viaSms: true
              enach:
                summary: eNACH recurring payment link
                value:
                  description: Monthly SIP – ₹2000
                  source: si_payment_link
                  enforcePayMethod: enach
                  customer:
                    name: Deepa Nair
                    email: deepa.nair@example.com
                    phone: '9000011111'
                  siDetails:
                    billingAmount: 2000
                    billingCycle: MONTHLY
                    billingInterval: 1
                    paymentStartDate: '2026-11-01'
                    paymentEndDate: '2027-10-31'
                    isNoExpiry: false
                    bankDetails:
                      bankCode: SBIIN
                      bankAccountNumber: XXXX1234
                      ifsc: SBIN0001234
                      accountType: SAVINGS
                      authenticationMethod: DEBIT_CARD
      responses:
        '200':
          description: >
            PayU always returns HTTP 200. Check `status`: `0` = success, `-1` =
            failure.

            The `message` field contains the plain-English reason for failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentLinkResponse'
              examples:
                success:
                  summary: Success – link created
                  value:
                    status: 0
                    message: paymentLink generated
                    result:
                      subAmount: 1499
                      tax: 0
                      shippingCharge: 0
                      totalAmount: 1499
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      description: 'Order #ORD-2026-88421 – Wireless Headphones'
                      active: true
                      isPartialPaymentAllowed: false
                      expiryDate: '2026-10-15 23:59:59'
                      udf:
                        udf1: electronics
                        udf2: app-checkout
                        udf3: null
                        udf4: null
                        udf5: null
                      address:
                        line1: null
                        line2: null
                        city: null
                        state: null
                        country: null
                        zipCode: null
                      emailStatus: sent
                      smsStatus: sent
                    errorCode: null
                    guid: null
                failureDuplicate:
                  summary: Failure – duplicate invoiceNumber
                  value:
                    status: -1
                    message: >-
                      Invoice Number already exists. Please enter new invoice
                      number.
                    result: null
                    errorCode: null
                    guid: null
                failureMissingParam:
                  summary: Failure – missing required parameter
                  value:
                    status: -1
                    message: description is required.
                    result: null
                    errorCode: null
                    guid: null
                failureAmount:
                  summary: Failure – zero or missing amount
                  value:
                    status: -1
                    message: Amount must be greater than 0.
                    result: null
                    errorCode: null
                    guid: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-readme:
        code-samples:
          - language: curl
            name: cURL
            code: >
              curl --location --request POST
              'https://uatoneapi.payu.in/payment-links' \

              --header 'Authorization: Bearer {{access_token}}' \

              --header 'merchantId: {{merchantId}}' \

              --header 'Content-Type: application/json' \

              --data-raw '{
                "subAmount": 1499,
                "description": "Order #ORD-2026-88421 – Wireless Headphones",
                "source": "API",
                "invoiceNumber": "ORD-2026-88421",
                "expiryDate": "2026-10-15 23:59:59",
                "customer": {
                  "name": "Arjun Mehta",
                  "email": "arjun.mehta@example.com",
                  "phone": "9876543210"
                },
                "udf": {
                  "udf1": "electronics",
                  "udf2": "app-checkout"
                },
                "viaEmail": true,
                "viaSms": true,
                "isPartialPaymentAllowed": false
              }'
          - language: python
            name: Python
            code: |
              import requests

              url = "https://uatoneapi.payu.in/payment-links"
              headers = {
                  "Authorization": "Bearer {{access_token}}",
                  "merchantId": "{{merchantId}}",
                  "Content-Type": "application/json"
              }
              payload = {
                  "subAmount": 1499,
                  "description": "Order #ORD-2026-88421 – Wireless Headphones",
                  "source": "API",
                  "invoiceNumber": "ORD-2026-88421",
                  "expiryDate": "2026-10-15 23:59:59",
                  "customer": {
                      "name": "Arjun Mehta",
                      "email": "arjun.mehta@example.com",
                      "phone": "9876543210"
                  },
                  "udf": {
                      "udf1": "electronics",
                      "udf2": "app-checkout"
                  },
                  "viaEmail": True,
                  "viaSms": True,
                  "isPartialPaymentAllowed": False
              }
              response = requests.post(url, headers=headers, json=payload)
              print(response.json())
          - language: php
            name: PHP
            code: |
              <?php
              $url = "https://uatoneapi.payu.in/payment-links";
              $payload = json_encode([
                  "subAmount"               => 1499,
                  "description"             => "Order #ORD-2026-88421 – Wireless Headphones",
                  "source"                  => "API",
                  "invoiceNumber"           => "ORD-2026-88421",
                  "expiryDate"              => "2026-10-15 23:59:59",
                  "customer"                => [
                      "name"  => "Arjun Mehta",
                      "email" => "arjun.mehta@example.com",
                      "phone" => "9876543210"
                  ],
                  "udf"                     => [
                      "udf1" => "electronics",
                      "udf2" => "app-checkout"
                  ],
                  "viaEmail"                => true,
                  "viaSms"                  => true,
                  "isPartialPaymentAllowed" => false
              ]);
              $ch = curl_init($url);
              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_POST           => true,
                  CURLOPT_POSTFIELDS     => $payload,
                  CURLOPT_HTTPHEADER     => [
                      "Authorization: Bearer {{access_token}}",
                      "merchantId: {{merchantId}}",
                      "Content-Type: application/json"
                  ]
              ]);
              echo curl_exec($ch);
              curl_close($ch);
          - language: node
            name: Node.js
            code: |
              const axios = require('axios');

              const response = await axios.post(
                'https://uatoneapi.payu.in/payment-links',
                {
                  subAmount: 1499,
                  description: 'Order #ORD-2026-88421 – Wireless Headphones',
                  source: 'API',
                  invoiceNumber: 'ORD-2026-88421',
                  expiryDate: '2026-10-15 23:59:59',
                  customer: {
                    name: 'Arjun Mehta',
                    email: 'arjun.mehta@example.com',
                    phone: '9876543210'
                  },
                  udf: { udf1: 'electronics', udf2: 'app-checkout' },
                  viaEmail: true,
                  viaSms: true,
                  isPartialPaymentAllowed: false
                },
                {
                  headers: {
                    'Authorization': 'Bearer {{access_token}}',
                    'merchantId': '{{merchantId}}',
                    'Content-Type': 'application/json'
                  }
                }
              );
              console.log(response.data);
      x-internal: true
    get:
      tags:
        - Payment Links
      summary: Fetch All Payment Links
      operationId: FetchAllPaymentLinksAPI
      description: >-
        Fetch All Payment Links retrieves a paginated list of payment links with
        optional filters.
      deprecated: false
      security:
        - httpBearer: []
      parameters:
        - name: merchantId
          in: header
          required: true
          schema:
            type: string
            example: '505678'
        - name: status
          in: query
          required: false
          description: Filter by link status.
          schema:
            type: string
            enum:
              - active
              - expired
              - cancelled
        - name: pageNumber
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check `status`: `0` = success, `-1` =
            failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentLinksResponse'
              examples:
                success:
                  summary: Success – results returned
                  value:
                    status: 0
                    message: success
                    result:
                      total: 3
                      pageNumber: 1
                      pageSize: 10
                      data:
                        - invoiceNumber: ORD-2026-88421
                          paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                          description: 'Order #ORD-2026-88421 – Wireless Headphones'
                          totalAmount: 1499
                          active: true
                          expiryDate: '2026-10-15 23:59:59'
                    errorCode: null
                    guid: null
                empty:
                  summary: Success – no results
                  value:
                    status: 0
                    message: No records found
                    result:
                      total: 0
                      pageNumber: 1
                      pageSize: 10
                      data: []
                    errorCode: null
                    guid: null
                failure:
                  summary: Failure – invalid filter value
                  value:
                    status: -1
                    message: Invalid status value.
                    result: null
                    errorCode: null
                    guid: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-readme:
        code-samples:
          - language: curl
            name: cURL
            code: >
              curl --location
              'https://uatoneapi.payu.in/payment-links?status=active&pageNumber=1&pageSize=10'
              \

              --header 'Authorization: Bearer {{access_token}}' \

              --header 'merchantId: {{merchantId}}'
          - language: python
            name: Python
            code: |
              import requests

              response = requests.get(
                  "https://uatoneapi.payu.in/payment-links",
                  headers={"Authorization": "Bearer {{access_token}}", "merchantId": "{{merchantId}}"},
                  params={"status": "active", "pageNumber": 1, "pageSize": 10}
              )
              print(response.json())
          - language: php
            name: PHP
            code: >
              <?php

              $ch =
              curl_init("https://uatoneapi.payu.in/payment-links?status=active&pageNumber=1&pageSize=10");

              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_HTTPHEADER     => [
                      "Authorization: Bearer {{access_token}}",
                      "merchantId: {{merchantId}}"
                  ]
              ]);

              echo curl_exec($ch);

              curl_close($ch);
          - language: node
            name: Node.js
            code: |
              const axios = require('axios');
              const response = await axios.get(
                'https://uatoneapi.payu.in/payment-links',
                {
                  params: { status: 'active', pageNumber: 1, pageSize: 10 },
                  headers: { 'Authorization': 'Bearer {{access_token}}', 'merchantId': '{{merchantId}}' }
                }
              );
              console.log(response.data);
      x-internal: true
  /payment-links/{invoiceNumber}:
    get:
      tags:
        - Payment Links
      summary: Fetch Payment Link
      operationId: FetchPaymentLinkAPI
      description: >-
        Fetch Payment Link retrieves the current state of a payment link using
        its invoiceNumber.
      deprecated: false
      security:
        - httpBearer: []
      parameters:
        - name: invoiceNumber
          in: path
          required: true
          description: The unique invoiceNumber of the payment link to retrieve.
          schema:
            type: string
            example: ORD-2026-88421
        - name: merchantId
          in: header
          required: true
          schema:
            type: string
            example: '505678'
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check `status`: `0` = success, `-1` =
            failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FetchPaymentLinkResponse'
              examples:
                success:
                  summary: Success
                  value:
                    status: 0
                    message: success
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      description: 'Order #ORD-2026-88421 – Wireless Headphones'
                      subAmount: 1499
                      tax: 0
                      shippingCharge: 0
                      totalAmount: 1499
                      active: true
                      isPartialPaymentAllowed: false
                      expiryDate: '2026-10-15 23:59:59'
                      emailStatus: not opted
                      smsStatus: not opted
                    errorCode: null
                    guid: null
                notFound:
                  summary: Failure – link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
                    errorCode: null
                    guid: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-readme:
        code-samples:
          - language: curl
            name: cURL
            code: >
              curl --location
              'https://uatoneapi.payu.in/payment-links/ORD-2026-88421' \

              --header 'Authorization: Bearer {{access_token}}' \

              --header 'merchantId: {{merchantId}}'
          - language: python
            name: Python
            code: |
              import requests
              response = requests.get(
                  "https://uatoneapi.payu.in/payment-links/ORD-2026-88421",
                  headers={"Authorization": "Bearer {{access_token}}", "merchantId": "{{merchantId}}"}
              )
              print(response.json())
          - language: php
            name: PHP
            code: >
              <?php

              $ch =
              curl_init("https://uatoneapi.payu.in/payment-links/ORD-2026-88421");

              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_HTTPHEADER     => [
                      "Authorization: Bearer {{access_token}}",
                      "merchantId: {{merchantId}}"
                  ]
              ]);

              echo curl_exec($ch);

              curl_close($ch);
          - language: node
            name: Node.js
            code: |
              const axios = require('axios');
              const response = await axios.get(
                'https://uatoneapi.payu.in/payment-links/ORD-2026-88421',
                { headers: { 'Authorization': 'Bearer {{access_token}}', 'merchantId': '{{merchantId}}' } }
              );
              console.log(response.data);
    put:
      tags:
        - Payment Links
      summary: Update Payment Link
      operationId: UpdatePaymentLinkAPI
      description: >-
        Update Payment Link modifies the configuration of an existing active
        payment link.
      deprecated: false
      security:
        - httpBearer: []
      parameters:
        - name: invoiceNumber
          in: path
          required: true
          description: The invoiceNumber of the payment link to update.
          schema:
            type: string
            example: ORD-2026-88421
        - name: merchantId
          in: header
          required: true
          schema:
            type: string
            example: '505678'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentLinkRequest'
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check `status`: `0` = success, `-1` =
            failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePaymentLinkResponse'
              examples:
                success:
                  summary: Success
                  value:
                    status: 0
                    message: Payment link updated successfully
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      description: 'Order #ORD-2026-88421 – Wireless Headphones'
                      subAmount: 1999
                      tax: 0
                      shippingCharge: 0
                      totalAmount: 1999
                      active: true
                      expiryDate: '2026-11-30 23:59:59'
                    errorCode: null
                    guid: null
                notFound:
                  summary: Failure – link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
                    errorCode: null
                    guid: null
                alreadyPaid:
                  summary: Failure – link already paid
                  value:
                    status: -1
                    message: Cannot update a payment link that has already been paid.
                    result: null
                    errorCode: null
                    guid: null
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-readme:
        code-samples:
          - language: curl
            name: cURL
            code: >
              curl --location --request PUT
              'https://uatoneapi.payu.in/payment-links/ORD-2026-88421' \

              --header 'Authorization: Bearer {{access_token}}' \

              --header 'merchantId: {{merchantId}}' \

              --header 'Content-Type: application/json' \

              --data-raw '{
                "expiryDate": "2026-11-30 23:59:59",
                "subAmount": 1999
              }'
          - language: python
            name: Python
            code: |
              import requests
              response = requests.put(
                  "https://uatoneapi.payu.in/payment-links/ORD-2026-88421",
                  headers={"Authorization": "Bearer {{access_token}}", "merchantId": "{{merchantId}}", "Content-Type": "application/json"},
                  json={"expiryDate": "2026-11-30 23:59:59", "subAmount": 1999}
              )
              print(response.json())
          - language: php
            name: PHP
            code: >
              <?php

              $ch =
              curl_init("https://uatoneapi.payu.in/payment-links/ORD-2026-88421");

              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_CUSTOMREQUEST  => "PUT",
                  CURLOPT_POSTFIELDS     => json_encode(["expiryDate" => "2026-11-30 23:59:59", "subAmount" => 1999]),
                  CURLOPT_HTTPHEADER     => [
                      "Authorization: Bearer {{access_token}}",
                      "merchantId: {{merchantId}}",
                      "Content-Type: application/json"
                  ]
              ]);

              echo curl_exec($ch);

              curl_close($ch);
          - language: node
            name: Node.js
