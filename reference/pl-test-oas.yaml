  /payment-links/{invoiceNumber}/transactions:
    get:
      summary: Get Transaction Details
      operationId: GetTransactionDetailsAPI
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token with read_payment_links scope. Format: Bearer
            {access_token}
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The invoiceNumber of the payment link to fetch transactions for.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check status: 0 = success, -1 =
            failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  result:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        txnid:
                          type: string
                          description: PayU transaction ID.
                          example: '7019203456789'
                        amount:
                          type: number
                          description: Amount paid in this transaction.
                          example: 1499
                        status:
                          type: string
                          description: 'Transaction status: success, failure, pending'
                          example: success
                        mode:
                          type: string
                          description: Payment mode used (UPI, CC, DC, NB, etc.)
                          example: UPI
                        paymentSource:
                          type: string
                          example: PaymentLink
                        addedon:
                          type: string
                          description: Timestamp when the transaction was recorded.
                          example: '2026-09-23 14:32:11'
              examples:
                success:
                  summary: Success - transaction found
                  value:
                    status: 0
                    message: success
                    result:
                      - txnid: '7019203456789'
                        amount: 1499
                        status: success
                        mode: UPI
                        paymentSource: PaymentLink
                        addedon: '2026-09-23 14:32:11'
                noTransactions:
                  summary: Success - no transactions yet
                  value:
                    status: 0
                    message: success
                    result: []
                notFound:
                  summary: Failure - link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
        '401':
          description: Invalid or expired Bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
