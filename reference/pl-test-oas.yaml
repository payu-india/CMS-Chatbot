      summary: Update Payment Link
      operationId: UpdatePaymentLinkAPI
      description: >
        Modify the configuration of an existing active payment link. Only send
        the fields

        you want to change — omitted fields retain their current values.


        **Restrictions:**

        - Cannot update a cancelled link (`active: false`).

        - Cannot update a link that has been fully paid.

        - Cannot reduce `subAmount` below the amount already collected on a
        partial payment link.


        **Required scope:** `update_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Only pass the fields you want to change. All fields are
                optional.
              properties:
                subAmount:
                  type: integer
                  description: >
                    Updated base amount in whole INR.


                    Cannot be reduced below any amount already collected on a
                    partial payment link.
                  example: 1999
                description:
                  type: string
                  description: Updated payment purpose description. Maximum 255 characters.
                  example: Updated — Wireless Headphones (revised price)
                expiryDate:
                  type: string
                  description: >-
                    Updated link expiry in `YYYY-MM-DD HH:mm:ss` format. Must be
                    a future datetime.
                  example: '2026-11-30 23:59:59'
                isPartialPaymentAllowed:
                  type: boolean
                  description: Enable or disable partial payment on the link.
                  example: true
                minAmountForCustomer:
                  type: integer
                  description: Updated minimum partial payment amount in INR.
                  example: 500
                viaEmail:
                  type: boolean
                  description: Resend the link to the customer's email address on record.
                  example: true
                viaSms:
                  type: boolean
                  description: Resend the link to the customer's phone number via SMS.
                  example: false
                viaWhatsapp:
                  type: boolean
                  description: Resend the link to the customer's phone number via WhatsApp.
                  example: false
            example:
              expiryDate: '2026-11-30 23:59:59'
              subAmount: 1999
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: Payment link updated successfully
                  result:
                    type: object
                    nullable: true
                    properties:
                      invoiceNumber:
                        type: string
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount:
                        type: integer
                        example: 1999
                      active:
                        type: boolean
                        example: true
                      expiryDate:
                        type: string
                        example: '2026-11-30 23:59:59'
              examples:
                success:
                  summary: Link updated successfully
                  value:
                    status: 0
                    message: Payment link updated successfully
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount: 1999
                      active: true
                      expiryDate: '2026-11-30 23:59:59'
        '400':
          description: >
            Validation or business-rule failure. The response body uses:

            - `status: -1`

            - `message`


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.


            **Update errors**


            <details>

            <summary>Payment link not found</summary>


            - **Code:** *(none)*

            - **Cause:** No link with the supplied `invoiceNumber` exists under
            this merchant account.

            - **Recommended fix:** Verify the `invoiceNumber` and environment
            (test vs. production).


            </details>


            <details>

            <summary>Cannot update a cancelled payment link</summary>


            - **Code:** *(none)*

            - **Cause:** The link has `active: false` — it was previously
