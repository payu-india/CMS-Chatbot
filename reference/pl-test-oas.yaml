  /payment-links/{invoiceNumber}:
    get:
      summary: Fetch Payment Link
      operationId: FetchPaymentLinkAPI
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token with read_payment_links scope. Format: Bearer
            {access_token}
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The unique invoiceNumber of the payment link to retrieve.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check status: 0 = success, -1 =
            failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: success
                  result:
                    type: object
                    nullable: true
                    properties:
                      invoiceNumber:
                        type: string
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      description:
                        type: string
                        example: 'Order #ORD-2026-88421 - Wireless Headphones'
                      subAmount:
                        type: integer
                        example: 1499
                      totalAmount:
                        type: integer
                        example: 1499
                      active:
                        type: boolean
                        example: true
                      isPartialPaymentAllowed:
                        type: boolean
                        example: false
                      expiryDate:
                        type: string
                        example: '2026-10-15 23:59:59'
                      emailStatus:
                        type: string
                        example: not opted
                      smsStatus:
                        type: string
                        example: not opted
              examples:
                success:
                  summary: Success
                  value:
                    status: 0
                    message: success
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      description: 'Order #ORD-2026-88421 - Wireless Headphones'
                      subAmount: 1499
                      totalAmount: 1499
                      active: true
                      isPartialPaymentAllowed: false
                      expiryDate: '2026-10-15 23:59:59'
                      emailStatus: not opted
                      smsStatus: not opted
                notFound:
                  summary: Failure - link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
        '401':
          description: Invalid or expired Bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
    put:
      summary: Update Payment Link
      operationId: UpdatePaymentLinkAPI
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token with update_payment_links scope. Format: Bearer
            {access_token}
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The invoiceNumber of the payment link to update.
          schema:
            type: string
            example: ORD-2026-88421
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Only pass the fields you want to change.
              properties:
                subAmount:
                  type: integer
                  description: Updated base amount in whole INR.
                  example: 1999
                expiryDate:
                  type: string
                  description: >-
                    Updated expiry date in YYYY-MM-DD HH:mm:ss format. Must be a
                    future date.
                  example: '2026-11-30 23:59:59'
                description:
                  type: string
                  description: Updated purpose description.
                  example: Updated order description
                isPartialPaymentAllowed:
                  type: boolean
                  description: Update whether partial payments are allowed.
                  example: true
                minAmountForCustomer:
                  type: integer
                  description: Updated minimum partial payment amount.
                  example: 500
                viaEmail:
                  type: boolean
                  description: Resend the link via email.
                  example: true
                viaSms:
                  type: boolean
                  description: Resend the link via SMS.
                  example: false
            example:
              expiryDate: '2026-11-30 23:59:59'
              subAmount: 1999
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check status: 0 = success, -1 =
            failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Payment link updated successfully
                  result:
                    type: object
                    nullable: true
                    properties:
                      invoiceNumber:
                        type: string
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount:
                        type: integer
                        example: 1999
                      active:
                        type: boolean
                        example: true
              examples:
                success:
                  summary: Success
                  value:
                    status: 0
                    message: Payment link updated successfully
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount: 1999
                      active: true
                notFound:
                  summary: Failure - link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
                alreadyPaid:
                  summary: Failure - link already paid
                  value:
                    status: -1
                    message: Cannot update a payment link that has already been paid.
                    result: null
        '401':
          description: Invalid or expired Bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
    delete:
      summary: Cancel Payment Link
      operationId: CancelPaymentLinkAPI
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token with update_payment_links scope. Format: Bearer
            {access_token}
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The invoiceNumber of the payment link to cancel.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: >-
            PayU always returns HTTP 200. Check status: 0 = success, -1 =
            failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 0
                  message:
                    type: string
                    example: Payment link cancelled successfully
                  result:
                    nullable: true
                    example: null
              examples:
                success:
                  summary: Success
                  value:
                    status: 0
                    message: Payment link cancelled successfully
                    result: null
                alreadyCancelled:
                  summary: Failure - already cancelled
                  value:
                    status: -1
                    message: Payment link is already cancelled.
                    result: null
                alreadyPaid:
                  summary: Failure - link already paid
                  value:
                    status: -1
                    message: Cannot cancel a payment link that has already been paid.
                    result: null
        '401':
          description: Invalid or expired Bearer token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
