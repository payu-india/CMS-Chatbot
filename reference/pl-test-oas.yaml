        `viaEmail`,

        `viaSms`, or `viaWhatsapp` must be `true`.


        The customer's contact details are taken from the values stored on the
        link

        at creation time.


        **Required scope:** `read_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
