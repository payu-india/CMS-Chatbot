            block documents error patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link is already cancelled.
                  result:
                    nullable: true
                    example: null
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
                alreadyCancelled:
                  summary: Already cancelled
                  value:
                    status: -1
                    message: Payment link is already cancelled.
                    result: null
                alreadyPaid:
                  summary: Link already paid
                  value:
                    status: -1
                    message: Cannot cancel a payment link that has already been paid.
                    result: null
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
