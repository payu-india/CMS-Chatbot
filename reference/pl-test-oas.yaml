openapi: 3.0.0
info:
  title: PayU Payment Links API
  description: Create, manage, and share payment links programmatically.
  version: 1.0.0
servers:
  - url: https://uatoneapi.payu.in
    description: Test Environment
  - url: https://oneapi.payu.in
    description: Production Environment
tags:
  - name: Authentication
    description: Generate and revoke OAuth 2.0 Bearer tokens.
  - name: Payment Links
    description: Create, retrieve, update, share, and manage payment links.
paths:
  /oauth/revoke:
    post:
      summary: Revoke Token API
      operationId: RevokeTokenAPI
      description: >
        Invalidate a Bearer token before its natural expiry.


        Use this when rotating credentials or if you suspect a token has been
        exposed.

        The revoked token becomes invalid immediately. After revoking, generate
        a new

        token via `POST /oauth/token`.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - token
              properties:
                client_id:
                  type: string
                  description: The `client_id` of the OAuth app that issued the token.
                  example: '{{client_id}}'
                client_secret:
                  type: string
                  description: The `client_secret` of the OAuth app that issued the token.
                  example: '{{client_secret}}'
                token:
                  type: string
                  description: The `access_token` value to invalidate.
                  example: '{{access_token}}'
            examples:
              basic:
                summary: Revoke a token
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  token: '{{access_token}}'
      responses:
        '200':
          description: Token revoked successfully. Response body is empty.
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client
                  error_description:
                    type: string
                    example: Client authentication failed.
              examples:
                invalidClient:
                  summary: Invalid credentials
                  value:
                    error: invalid_client
                    error_description: >-
                      Client authentication failed due to unknown client, no
                      client authentication included, or unsupported
                      authentication method.
                invalidToken:
                  summary: Token already invalid
                  value:
                    error: invalid_token
                    error_description: The token is invalid or has already been revoked.
      servers:
        - url: https://uat-accounts.payu.in
          description: Test Environment
        - url: https://accounts.payu.in
          description: Production Environment
      security: []
  /payment-links:
    post:
      summary: Create Payment Link
      operationId: CreatePaymentLinkAPI
      description: ''
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - source
              properties:
                subAmount:
                  type: integer
                  description: >
                    Base payment amount in whole INR.


                    - **Standard / Partial Payment:** Required. Must be greater
                    than 0.

                    - **Open Amount:** Omit — set `isAmountFilledByCustomer:
                    true` instead.

                    - **SI Recurring / eNACH:** Omit — use
                    `siDetails.billingAmount` for the per-cycle debit.
                  example: 1499
                description:
                  type: string
                  description: >-
                    Purpose of the payment. Shown to the customer on the
                    checkout page. Maximum 255 characters.
                  example: 'Order #ORD-2026-88421 — Wireless Headphones'
                source:
                  type: string
                  description: >
                    Identifies the link category.


                    - `"API"` — Standard, Open Amount, or Partial Payment links.

                    - `"si_payment_link"` — SI Recurring and eNACH mandate
                    registration links.
                  enum:
                    - API
                    - si_payment_link
                  example: API
                invoiceNumber:
                  type: string
                  description: >
                    Your unique reference ID for this link. Alphanumeric,
                    maximum 25 characters.

                    Auto-generated by PayU if omitted. Used as the path
                    parameter in all subsequent

                    Fetch, Update, Share, and Cancel calls.
                  example: ORD-2026-88421
                expiryDate:
                  type: string
                  description: >
                    Link expiry in `YYYY-MM-DD HH:mm:ss` format. After this
                    datetime the link stops

                    accepting payments. Defaults to 7 days from creation.
                  example: '2026-10-15 23:59:59'
                currency:
                  type: string
                  description: ISO 4217 currency code. Defaults to `INR`.
                  example: INR
                tax:
                  type: integer
                  description: Tax amount in INR added to `subAmount`. Defaults to 0.
                  example: 0
                shippingCharge:
                  type: integer
                  description: Shipping charge in INR added to `subAmount`. Defaults to 0.
                  example: 0
                discount:
                  type: integer
                  description: >-
                    Discount amount in INR subtracted from `subAmount`. Defaults
                    to 0.
                  example: 0
                maxPaymentsAllowed:
                  type: integer
                  description: Maximum successful payment attempts allowed. Defaults to 1.
                  example: 1
                isAmountFilledByCustomer:
                  type: boolean
                  description: >
                    **Open Amount links only.** Set to `true` to let the
                    customer enter their own

                    payment amount at checkout. Mutually exclusive with
                    `isPartialPaymentAllowed`.

                    When `true`, omit `subAmount`.
                  example: false
                isPartialPaymentAllowed:
                  type: boolean
                  description: >
                    **Partial Payment links only.** Set to `true` to allow the
                    customer to pay less

                    than the total amount. Requires `subAmount`. Mutually
                    exclusive with

                    `isAmountFilledByCustomer`.
                  example: false
                minAmountForCustomer:
                  type: integer
                  description: >
                    **Partial Payment links only.** Minimum amount (INR) the
                    customer must pay in

                    the first transaction. Ignored unless
                    `isPartialPaymentAllowed` is `true`.
                  example: 500
                viaEmail:
                  type: boolean
                  description: >-
                    Send the link to `customer.email` via email on creation.
                    Requires `customer.email`.
                  example: true
                viaSms:
                  type: boolean
                  description: >-
                    Send the link to `customer.phone` via SMS on creation.
                    Requires `customer.phone`.
                  example: true
                viaWhatsapp:
                  type: boolean
                  description: >-
                    Send the link to `customer.phone` via WhatsApp on creation.
                    Requires `customer.phone`.
                  example: false
                successURL:
                  type: string
                  description: URL to redirect the customer after a successful payment.
                  example: https://yourstore.com/payment/success
                failureURL:
                  type: string
                  description: >-
                    URL to redirect the customer after a failed or cancelled
                    payment.
                  example: https://yourstore.com/payment/failure
                enforcePayMethod:
                  type: string
                  description: >
                    Restrict checkout to specific payment methods. Separate
                    multiple values with `|`.


                    - **eNACH links:** Must be `"enach"` — renders the bank
                    mandate registration flow.

                    - **Other links:** e.g. `"cc|dc"` (cards only), `"upi"` (UPI
                    only), `"nb"` (net banking only).
                  example: cc|dc
                dropCategory:
                  type: string
                  description: >
                    Hide specific payment categories from checkout. Separate
                    values with `|`.

                    Example: `"EMI"` hides the EMI option.
                  example: EMI
                customer:
                  type: object
                  description: >-
                    Customer contact details. Required when using `viaEmail`,
                    `viaSms`, or `viaWhatsapp`.
                  properties:
                    name:
                      type: string
                      description: Customer's full name. Shown on the checkout page.
                      example: Arjun Mehta
                    email:
                      type: string
                      description: >-
                        Customer's email address. Required when `viaEmail` is
                        `true`.
                      example: arjun.mehta@example.com
                    phone:
                      type: string
                      description: >-
                        Customer's 10-digit mobile number. Required when
                        `viaSms` or `viaWhatsapp` is `true`.
                      example: '9876543210'
                address:
                  type: object
                  description: >-
                    Customer billing address. Stored against the link and passed
                    through to webhooks.
                  properties:
                    line1:
                      type: string
                      example: 42 MG Road
                    line2:
                      type: string
                      example: Indiranagar
                    city:
                      type: string
                      example: Bengaluru
                    state:
                      type: string
                      example: Karnataka
                    zipCode:
                      type: string
                      example: '560038'
                udf:
                  type: object
                  description: >
                    User-defined fields 1–5. Stored against the link and passed
                    through unchanged to

                    webhook callbacks. Use for internal order IDs, customer
                    segments, or campaign codes.
                  properties:
                    udf1:
                      type: string
                      example: electronics
                    udf2:
                      type: string
                      example: app-checkout
                    udf3:
                      type: string
                    udf4:
                      type: string
                    udf5:
                      type: string
                siDetails:
                  type: object
                  description: >
                    **Required for SI Recurring and eNACH links** (`source:
                    "si_payment_link"`).

                    Defines the recurring billing schedule. Omit for Standard,
                    Open Amount, and

                    Partial Payment links.
                  properties:
                    billingAmount:
                      type: integer
                      description: Amount to debit on each billing cycle, in whole INR.
                      example: 2000
                    billingCycle:
                      type: string
                      description: |
                        Frequency of recurring debits.

                        Possible values: `DAILY`, `WEEKLY`, `MONTHLY`, `YEARLY`,
                        `BI_MONTHLY`, `QUARTERLY`, `HALF_YEARLY`, `AS_PRESENTED`
                      enum:
                        - DAILY
                        - WEEKLY
                        - MONTHLY
                        - YEARLY
                        - BI_MONTHLY
                        - QUARTERLY
                        - HALF_YEARLY
                        - AS_PRESENTED
                      example: MONTHLY
                    billingInterval:
                      type: integer
                      description: >-
                        Total number of billing cycles. E.g. `12` for a 12-month
                        monthly SIP.
                      example: 12
                    paymentStartDate:
                      type: string
                      description: Date of the first debit in `YYYY-MM-DD` format.
                      example: '2026-11-01'
                    paymentEndDate:
                      type: string
                      description: >-
                        Date of the last debit in `YYYY-MM-DD` format. Ignored
                        when `isNoExpiry` is `true`.
                      example: '2027-10-31'
                    isNoExpiry:
                      type: boolean
                      description: >
                        Set to `true` for an open-ended mandate with no fixed
                        end date.

                        When `true`, `paymentEndDate` is ignored.
                      example: false
                    isFreeTrial:
                      type: boolean
                      description: >-
                        Set to `true` to register the mandate without charging
                        the first instalment.
                      example: false
                    remarks:
                      type: string
                      description: >-
                        Merchant-facing notes for this subscription. Not shown
                        to the customer.
                      example: SIP — mutual fund folio 9104927822
                    bankDetails:
                      type: object
                      description: >
                        **Required for eNACH links** (`enforcePayMethod:
                        "enach"`).

                        Pre-fills the customer's bank details on the eNACH
                        registration form.

                        Omit for SI Recurring links.
                      properties:
                        bankCode:
                          type: string
                          description: >-
                            Bank identifier code. E.g. `SBIIN` for State Bank of
                            India.
                          example: SBIIN
                        bankAccountNumber:
                          type: string
                          description: Customer's bank account number.
                          example: '1234567890'
                        ifsc:
                          type: string
                          description: IFSC code of the specific branch.
                          example: SBIN0001234
                        accountType:
                          type: string
                          description: Type of bank account.
                          enum:
                            - SAVINGS
                            - CURRENT
                          example: SAVINGS
                    billingCurrency:
                      type: string
                      description: >-
                        ISO 4217 currency code for recurring billing. Defaults
                        to `INR`.
                      example: INR
                paymentDeadline:
                  type: string
                  description: >-
                    Payment deadline independent of `expiryDate`. Format:
                    `YYYY-MM-DD HH:mm:ss`.
                  example: '2026-10-15 23:59:59'
                reminder:
                  type: object
                  description: >-
                    **Use case 6 — Payment Reminder.** Schedule a notification
                    before or after the `paymentDeadline`. Set `isScheduled:
                    true`, pick timing with `type` (`0` = before deadline, `1` =
                    after), and list channels (`email`, `phone`).
                  properties:
                    isScheduled:
                      type: boolean
                      description: Whether a reminder is scheduled.
                      example: true
                    type:
                      type: integer
                      description: >-
                        `0` = before payment deadline; `1` = after payment
                        deadline.
                      example: 0
                    channels:
                      type: array
                      items:
                        type: string
                      description: 'Reminder channels. Supported values: `email`, `phone`.'
                      example:
                        - email
                        - phone
                whatsappRecipients:
                  type: array
                  description: >-
                    **Use case 7 — Multiple WhatsApp recipients.** Send the link
                    to up to 4 WhatsApp numbers at creation. Use with
                    `viaWhatsapp: true` and `whatsappTemplateName`. Each entry
                    must contain a `phone` field (10-15 digits).
                  items:
                    type: object
                    properties:
                      phone:
                        type: string
                        description: 10-15 digit mobile number.
                        example: '9876543210'
                whatsappTemplateName:
                  type: string
                  description: >-
                    WhatsApp notification template name. Used with `viaWhatsapp:
                    true`.
                  example: '{{whatsappTemplateName}}'
                offerKey:
                  type: string
                  description: >-
                    **Use case 8 — Offer or coupon.** Pass the offer or coupon
                    identifier to attach a promotional discount to this payment
                    link. Maximum 255 characters.
                  example: '{{offerKey}}'
                blockDaysForPreAuthorizeLinks:
                  type: integer
                  description: >-
                    **Use case 9 — Pre-authorisation.** Number of days to hold a
                    pre-authorisation on the customer payment method before
                    capture.
                  example: 7
                beneficiarydetail:
                  type: object
                  description: >-
                    **Use case 10 — Payout beneficiaries.** Specify up to 4
                    bank-account beneficiaries for NEFT or IMPS payout flows.
                    All four arrays must have the same entry count; each index
                    position represents one beneficiary.
                  properties:
                    beneficiaryAccountNumber:
                      type: array
                      items:
                        type: string
                      description: Bank account numbers. Maximum 4 entries.
                    ifscCode:
                      type: array
                      items:
                        type: string
                      description: IFSC codes. Count must match `beneficiaryAccountNumber`.
                    beneficiaryName:
                      type: array
                      items:
                        type: string
                      description: Account-holder names.
                    beneficiaryAccountType:
                      type: array
                      items:
                        type: string
                      description: >-
                        Account types. Each value must be `SAVINGS` or
                        `CURRENT`.
                adjustment:
                  type: integer
                  description: Adjustment amount in INR applied to the total.
                  example: 0
                batchId:
                  type: string
                  description: >-
                    Batch identifier for grouping multiple payment links created
                    together.
                  example: BATCH-2026-001
                scheduledFor:
                  type: string
                  description: Reason or reference note for scheduling this payment link.
                emailTemplateName:
                  type: string
                  description: >-
                    Custom email template name to use when sending the link via
                    email.
                smsTemplateName:
                  type: string
                  description: >-
                    Custom SMS template name to use when sending the link via
                    SMS.
                timeUnit:
                  type: string
                  description: Time unit qualifier used when specifying `expiryDate`.
                notes:
                  type: string
                  description: >-
                    Merchant-facing notes about the payment link. Not shown to
                    the customer.
                enforcePG:
                  type: string
                  description: >-
                    Enforce a specific payment gateway. E.g. `"CC"` for credit
                    card gateway.
                  example: CC
                userToken:
                  type: string
                  description: User token for token-based customer authentication flows.
                userCredentials:
                  type: string
                  description: >-
                    User credentials string for credential-based authentication
                    flows.
                transactionId:
                  type: string
                  description: >-
                    Merchant-defined transaction ID to associate with this
                    payment link.
                  example: TXN-2026-88421
                validationPeriod:
                  type: string
                  description: Validation period for the transaction.
                smsConfirm:
                  type: string
                  description: SMS confirmation reference.
                isActive:
                  type: string
                  description: Whether the payment link is active. Pass `"true"` if active.
                  example: 'true'
                cart_details:
                  type: object
                  description: >-
                    Cart details for itemised payment links including SKU
                    breakdown.
                  properties:
                    amount:
                      type: string
                      description: Total cart amount.
                    items:
                      type: string
                      description: Number of items in the cart.
                    sku_details:
                      type: array
                      description: Array of SKU detail objects.
                      items:
                        type: object
                        properties:
                          quantity:
                            type: integer
                          sku_id:
                            type: string
                          sku_name:
                            type: string
                          amount_per_sku:
                            type: integer
                          offer_key:
                            type: array
                            items:
                              type: string
                            description: One or more offer keys for this SKU.
                          offer_auto_apply:
                            type: boolean
                            description: Auto-apply the offer if `true`.
                aggregatorSplitInfo:
                  type: object
                  description: Split payment configuration for aggregator flows.
                  properties:
                    type:
                      type: string
                      description: 'Split type: `Absolute` or `Percentage`.'
                    splitInfo:
                      type: object
                      description: Split details object.
                additionalDetails:
                  type: object
                  description: Additional partner and payment configuration details.
                  properties:
                    partnerWebhookSuccessUrls:
                      type: string
                      description: >-
                        Partner webhook URL for successful payment. Separate
                        from merchant `successURL`. Maximum 512 characters.
                    partnerWebhookFailureUrls:
                      type: string
                      description: >-
                        Partner webhook URL for failed payment. Maximum 512
                        characters.
                    amountStatus:
                      type: string
                      description: Current payment status.
                      enum:
                        - UNPAID
                        - PARTIALLY_PAID
                        - FULLY_PAID
                        - OVERDUE
                    partialPaymentDeadline:
                      type: string
                      description: >-
                        Deadline for completing partial payments. Format:
                        `YYYY-MM-DD HH:mm:ss`.
                    sendWhatsapp:
                      type: boolean
                      description: Whether WhatsApp notification is enabled for this link.
                customAttributes:
                  type: array
                  description: >-
                    Array of custom key-value objects passed through to the
                    webhook payload unchanged. Useful for carrying merchant-side
                    metadata.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        description: Attribute key.
                      value:
                        type: string
                        description: Attribute value.
            example:
              subAmount: 1499
              description: 'Order #ORD-2026-88421 — Wireless Headphones'
              source: API
              invoiceNumber: ORD-2026-88421
              expiryDate: '2026-10-15 23:59:59'
              currency: INR
              tax: 0
              shippingCharge: 0
              discount: 0
              maxPaymentsAllowed: 1
              isAmountFilledByCustomer: false
              isPartialPaymentAllowed: false
              minAmountForCustomer: 500
              viaEmail: true
              viaSms: true
              viaWhatsapp: false
              successURL: https://yourstore.com/payment/success
              failureURL: https://yourstore.com/payment/failure
              enforcePayMethod: cc|dc
              dropCategory: EMI
              customer:
                name: Arjun Mehta
                email: arjun.mehta@example.com
                phone: '9876543210'
              address:
                line1: 42 MG Road
                line2: Indiranagar
                city: Bengaluru
                state: Karnataka
                zipCode: '560038'
              udf:
                udf1: electronics
                udf2: app-checkout
                udf3: null
                udf4: null
                udf5: null
              siDetails:
                billingAmount: 2000
                billingCycle: MONTHLY
                billingInterval: 12
                paymentStartDate: '2026-11-01'
                paymentEndDate: '2027-10-31'
                isNoExpiry: false
                isFreeTrial: false
                remarks: SIP — mutual fund folio 9104927822
                bankDetails:
                  bankCode: SBIIN
                  bankAccountNumber: '1234567890'
                  ifsc: SBIN0001234
                  accountType: SAVINGS
              paymentDeadline: '2026-10-20 23:59:59'
              reminder:
                isScheduled: true
                type: 0
                channels:
                  - email
                  - phone
              offerKey: null
              blockDaysForPreAuthorizeLinks: null
              whatsappRecipients: null
              whatsappTemplateName: null
              beneficiarydetail: null
              additionalDetails:
                amountStatus: UNPAID
                sendWhatsapp: false
              customAttributes: []
              batchId: null
              notes: null
              adjustment: 0
              transactionId: null
              enforcePG: null
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    description: Human-readable response message.
                    example: paymentLink generated
                  result:
                    type: object
                    nullable: true
                    description: The created Payment Link object.
                    properties:
                      invoiceNumber:
                        type: string
                        description: >-
                          Unique identifier. Use as the path parameter in Fetch,
                          Update, Share, and Cancel.
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        description: The shareable URL to send to your customer.
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount:
                        type: integer
                        description: >-
                          `subAmount + tax + shippingCharge`. `null` for Open
                          Amount and SI/eNACH links.
                        example: 1499
                      active:
                        type: boolean
                        description: '`true` if the link is live and accepting payment.'
                        example: true
                      expiryDate:
                        type: string
                        description: Link expiry in `YYYY-MM-DD HH:mm:ss`.
                        example: '2026-10-15 23:59:59'
                      subAmount:
                        type: integer
                        description: Base payment amount in INR.
                        example: 1499
                      tax:
                        type: integer
                        description: Tax amount in INR.
                        example: 0
                      shippingCharge:
                        type: integer
                        description: Shipping charge in INR.
                        example: 0
                      description:
                        type: string
                        description: Payment purpose as set at creation.
                        example: 'Order #ORD-2026-88421'
                      isPartialPaymentAllowed:
                        type: boolean
                        description: '`true` if partial payments are enabled.'
                        example: false
                      emailStatus:
                        type: string
                        description: >-
                          `sent` if email was dispatched. `not opted` if
                          `viaEmail` was false.
                        example: not opted
                      smsStatus:
                        type: string
                        description: >-
                          `sent` if SMS was dispatched. `not opted` if `viaSms`
                          was false.
                        example: not opted
                      udf:
                        type: object
                        nullable: true
                        description: >-
                          User-defined fields stored at creation. Returns `null`
                          if not provided.
                        properties:
                          udf1:
                            type: string
                            nullable: true
                          udf2:
                            type: string
                            nullable: true
                          udf3:
                            type: string
                            nullable: true
                          udf4:
                            type: string
                            nullable: true
                          udf5:
                            type: string
                            nullable: true
                      address:
                        type: object
                        nullable: true
                        description: >-
                          Address stored at creation. Returns `null` if not
                          provided.
                        properties:
                          line1:
                            type: string
                            nullable: true
                          line2:
                            type: string
                            nullable: true
                          city:
                            type: string
                            nullable: true
                          state:
                            type: string
                            nullable: true
                          zipCode:
                            type: string
                            nullable: true
                  errorCode:
                    type: string
                    nullable: true
                    example: null
                  guid:
                    type: string
                    nullable: true
                    description: Request identifier. Returns `null` if not applicable.
                    example: null
              examples:
                success:
                  summary: Link created successfully
                  value:
                    status: 0
                    message: paymentLink generated
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount: 1499
                      active: true
                      expiryDate: '2026-10-15 23:59:59'
                      subAmount: 1499
                      tax: 0
                      shippingCharge: 0
                      description: 'Order #ORD-2026-88421'
                      isPartialPaymentAllowed: false
                      emailStatus: not opted
                      smsStatus: not opted
                      udf:
                        udf1: null
                        udf2: null
                        udf3: null
                        udf4: null
                        udf5: null
                      address:
                        line1: null
                        line2: null
                        city: null
                        state: null
                        zipCode: null
                    errorCode: null
                    guid: null
        '400':
          description: >-
            Validation or business-rule failure. The response body uses `status:
            -1`, a human-readable `message`, and `result: null`.


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents the error body patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: Always `-1` for error responses.
                    example: -1
                  message:
                    type: string
                    description: Human-readable error message.
                    example: description is required.
                  result:
                    nullable: true
                    description: Always `null` for error responses.
                    example: null
                  errorCode:
