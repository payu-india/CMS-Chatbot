              --header 'merchantId: {{merchantId}}'
          - language: python
            name: Python
            code: |
              import requests
              response = requests.delete(
                  "https://uatoneapi.payu.in/payment-links/ORD-2026-88421",
                  headers={"Authorization": "Bearer {{access_token}}", "merchantId": "{{merchantId}}"}
              )
              print(response.json())
          - language: php
            name: PHP
            code: >
              <?php

              $ch =
              curl_init("https://uatoneapi.payu.in/payment-links/ORD-2026-88421");

              curl_setopt_array($ch, [
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_CUSTOMREQUEST  => "DELETE",
                  CURLOPT_HTTPHEADER     => [
                      "Authorization: Bearer {{access_token}}",
                      "merchantId: {{merchantId}}"
                  ]
              ]);

              echo curl_exec($ch);

