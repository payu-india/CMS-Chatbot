    put:
      summary: Update a Payment Link
      operationId: UpdatePaymentLinkAPI
      description: ''
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token generated by calling the Generate an Access Token API
            in the `Bearer {access_token}` format.
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your unique PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: >-
            The unique invoice number of the payment link use to fetch the
            payment link.
          schema:
            type: string
            example: ORD-2026-88421
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Only pass the fields you want to change. All fields are
                optional.
              properties:
                subAmount:
                  type: integer
                  description: >-
                    The updated base amount in INR.


                    **Note:** You cannot reduce this amount below any amount
                    already collected on a partial payment link.
                  example: 1999
                description:
                  type: string
                  description: >-
                    The updated payment purpose description. The value can
                    contain maximum of 255 characters.
                  example: Updated — Wireless Headphones (revised price)
                expiryDate:
                  type: string
                  description: >-
                    The updated link expiry in `YYYY-MM-DD HH:mm:ss` format.
                    This should be a future datetime.
                  example: '2026-11-30 23:59:59'
                isPartialPaymentAllowed:
                  type: boolean
                  description: Use to enable or disable partial payment on the link.
                  example: true
                minAmountForCustomer:
                  type: integer
                  description: The updated minimum partial payment amount in INR.
                  example: 500
                viaEmail:
                  type: boolean
                  description: Resend the link to the customer's email address on record.
                  example: true
                viaSms:
                  type: boolean
                  description: Resend the link to the customer's phone number via SMS.
                  example: false
                viaWhatsapp:
                  type: boolean
                  description: Resend the link to the customer's phone number via WhatsApp.
                  example: false
            example:
              expiryDate: '2026-11-30 23:59:59'
              subAmount: 1999
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: Payment link updated successfully
                  result:
                    type: object
                    nullable: true
                    properties:
                      invoiceNumber:
                        type: string
                        example: ORD-2026-88421
                        description: The unique invoice number of the payment link.
                      paymentLink:
                        type: string
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                        description: The URL (payment link) used to make the payment.
                      totalAmount:
                        type: integer
                        example: 1999
                        description: The total amount associated with the payment link.
                      active:
                        type: boolean
                        example: true
                        description: Indicates whether the link is active.
                      expiryDate:
                        type: string
                        example: '2026-11-30 23:59:59'
                        description: The expiry date and time of the link.
              examples:
                success:
                  summary: Link updated successfully
                  value:
                    status: 0
                    message: Payment link updated successfully
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount: 1999
                      active: true
                      expiryDate: '2026-11-30 23:59:59'
        '400':
          description: >-
            Validation or business-rule failure. The response body uses `status:
            -1` and `message`.


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
