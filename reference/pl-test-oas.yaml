  /payment-links/{invoiceNumber}/transactions:
    get:
      summary: Get Transaction Details
      operationId: GetTransactionDetailsAPI
      description: >
        Fetch all payment attempts — successful, failed, and pending — recorded
        against

        a payment link.


        Use this to verify payment completion, reconcile partial payments, or
        display

        payment history. An empty `result` array is a valid success response
        when no

        payments have been attempted yet.


        **Required scope:** `read_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: success
                  result:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        txnid:
                          type: string
                          description: PayU's unique transaction ID.
                          example: '7019203456789'
                        amount:
                          type: number
                          description: Amount paid in this transaction, in INR.
                          example: 1499
                        status:
                          type: string
                          description: >
                            Transaction outcome.


                            - `success` — Payment was captured.

                            - `failure` — Payment was declined or failed.

                            - `pending` — Awaiting bank confirmation (common for
                            net banking and UPI).
                          example: success
                        mode:
                          type: string
                          description: >-
                            Payment mode: `UPI`, `CC` (credit card), `DC` (debit
                            card), `NB` (net banking), `ENACH`, etc.
                          example: UPI
                        paymentSource:
                          type: string
                          description: >-
                            Always `PaymentLink` for transactions originating
                            from a payment link.
                          example: PaymentLink
                        addedon:
                          type: string
                          description: >-
                            Timestamp when the transaction was recorded in
                            `YYYY-MM-DD HH:mm:ss`.
                          example: '2026-09-23 14:32:11'
              examples:
                successWithTransaction:
                  summary: Payment recorded
                  value:
                    status: 0
                    message: success
                    result:
                      - txnid: '7019203456789'
                        amount: 1499
                        status: success
                        mode: UPI
                        paymentSource: PaymentLink
                        addedon: '2026-09-23 14:32:11'
                partialPayments:
                  summary: Two partial payments
                  value:
                    status: 0
                    message: success
                    result:
                      - txnid: '7019203456789'
                        amount: 1000
                        status: success
                        mode: UPI
                        paymentSource: PaymentLink
                        addedon: '2026-09-23 14:32:11'
                      - txnid: '7019203456790'
                        amount: 499
                        status: success
                        mode: CC
                        paymentSource: PaymentLink
                        addedon: '2026-09-25 09:15:44'
                noTransactions:
                  summary: No payments yet
                  value:
                    status: 0
                    message: success
                    result: []
        '400':
          description: >-
            Validation or business-rule failure. The response body uses `status:
            -1` and `message`.


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link not found.
                  result:
                    nullable: true
                    example: null
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
  /oauth/token:
    post:
      summary: Get Access Token
      operationId: GetAccessTokenAPI
      description: ''
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - grant_type
                - scope
              properties:
                client_id:
                  type: string
                  description: >
                    Your OAuth app's public identifier.

                    Find this in PayU Dashboard → **Developers** → **OAuth
                    Apps**.
                  example: '{{client_id}}'
                client_secret:
                  type: string
                  description: >
                    Your OAuth app's secret key. Never expose it in client-side
                    code or

                    public repositories — treat it like a password.
                  example: '{{client_secret}}'
                grant_type:
                  type: string
                  description: |
                    OAuth 2.0 grant type. Always pass `client_credentials` for
                    server-to-server Payment Links integrations.
                  example: client_credentials
                  default: '`client_credentials`'
                  enum:
                    - '`client_credentials`'
                scope:
                  type: string
                  description: >
                    Space-separated list of scopes the token should carry. You
                    can request all three in a single call:<br/>


                    `create_payment_links update_payment_links
                    read_payment_links`<br/>


                    | Scope | Grants access to |

                    | :--- | :--- |

                    | `create_payment_links` | Create Payment Link |

                    | `update_payment_links` | Update / Cancel Payment Link |

                    | `read_payment_links` | Fetch Payment Link · Fetch All
                    Payment Links · Share Payment Link · Get Transaction Details
                    |
                  example: create_payment_links update_payment_links read_payment_links
                  enum:
                    - >-
                      `create_payment_links update_payment_links
                      read_payment_links`
            examples:
              allScopes:
                summary: Token with all three scopes
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  grant_type: client_credentials
                  scope: create_payment_links update_payment_links read_payment_links
              createOnly:
                summary: Token for creating links only
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  grant_type: client_credentials
                  scope: create_payment_links
      responses:
        '200':
          description: Token generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: >-
                      Bearer token to use in the `Authorization` header of all
                      Payment Links API calls.
                    example: >-
                      ea4ed864b4d2a04b90c1e987a5d25a5da1d43fa5f7d123be6814a1e973f196c4
                  token_type:
                    type: string
                    description: Always `Bearer`.
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Token validity in seconds. Typically `7200` (2 hours).
                    example: 7200
                  scope:
                    type: string
                    description: The scopes granted to this token.
                    example: >-
                      create_payment_links update_payment_links
                      read_payment_links
                  created_at:
                    type: integer
                    description: |
                      Unix timestamp of token creation.
                      Token expiry = `created_at + expires_in`.
                    example: 1763036368
              examples:
                success:
                  summary: Token generated
                  value:
                    access_token: >-
                      ea4ed864b4d2a04b90c1e987a5d25a5da1d43fa5f7d123be6814a1e973f196c4
                    token_type: Bearer
                    expires_in: 7200
                    scope: >-
                      create_payment_links update_payment_links
                      read_payment_links
                    created_at: 1763036368
        '400':
          description: >-
            Invalid request parameters. The response body uses the standard
            OAuth error format.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: OAuth error code.
                    example: invalid_scope
                  error_description:
                    type: string
                    description: Human-readable error description.
                    example: The requested scope is invalid, unknown, or malformed.
              examples:
                invalidScope:
                  summary: Unknown scope value
                  value:
                    error: invalid_scope
                    error_description: The requested scope is invalid, unknown, or malformed.
                unsupportedGrant:
                  summary: Wrong grant type
                  value:
                    error: unsupported_grant_type
                    error_description: >-
                      The authorization grant type is not supported by the
                      authorization server.
        '401':
          description: Client authentication failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client
                  error_description:
                    type: string
                    example: Client authentication failed.
              examples:
                invalidClient:
                  summary: Invalid credentials
                  value:
                    error: invalid_client
                    error_description: >-
                      Client authentication failed due to unknown client, no
                      client authentication included, or unsupported
                      authentication method.
                rateLimited:
                  summary: Rate limit exceeded
                  value:
                    error: rate_limit_exceeded
                    error_description: >-
                      Too many token requests. Cache your token and retry after
                      the cooldown period.
      servers:
        - url: https://uat-accounts.payu.in
          description: Test Environment
        - url: https://accounts.payu.in
          description: Production Environment
      security: []
