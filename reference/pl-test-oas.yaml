          application/json:
            schema:
              type: object
              properties:
                viaEmail:
                  type: boolean
                  description: >-
                    Send the link to the email address stored on this payment
                    link.
                  example: true
                viaSms:
                  type: boolean
                  description: >-
                    Send the link to the phone number stored on this payment
                    link via SMS.
                  example: true
