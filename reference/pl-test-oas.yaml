    delete:
      summary: Cancel Payment Link
      operationId: CancelPaymentLinkAPI
      description: >
        Deactivate an existing payment link so it can no longer accept payments.

        Sets `active` to `false` permanently — a cancelled link cannot be
        reactivated.


        **Restrictions:**

        - Cannot cancel a link that has already been fully paid.


        **Required scope:** `update_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: Payment link cancelled successfully
                  result:
                    nullable: true
                    example: null
              examples:
                success:
                  summary: Link cancelled successfully
                  value:
                    status: 0
                    message: Payment link cancelled successfully
                    result: null
        '400':
          description: >
            Validation or business-rule failure. The response body uses:

            - `status: -1`

            - `message`


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.


            **Cancellation errors**


            <details>

            <summary>Payment link not found</summary>


            - **Code:** *(none)*

            - **Cause:** No link with the supplied `invoiceNumber` exists under
            this merchant account.

            - **Recommended fix:** Verify the `invoiceNumber` and environment
            (test vs. production).


            </details>


            <details>

            <summary>Payment link is already cancelled</summary>


            - **Code:** *(none)*

            - **Cause:** The link was previously cancelled and `active` is
            already `false`.

            - **Recommended fix:** No action needed — the link is already
            inactive.


            </details>


            <details>

            <summary>Cannot cancel a payment link that has already been
            paid</summary>


            - **Code:** *(none)*

            - **Cause:** A successful payment has been recorded against this
            link.

            - **Recommended fix:** Fully paid links cannot be cancelled. Use Get
            Transaction Details to retrieve payment information.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link is already cancelled.
                  result:
                    nullable: true
                    example: null
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
                alreadyCancelled:
                  summary: Already cancelled
                  value:
                    status: -1
                    message: Payment link is already cancelled.
                    result: null
                alreadyPaid:
