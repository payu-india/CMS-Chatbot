  /payment-links/{invoiceNumber}/notify:
    post:
      summary: Share Payment Link
      operationId: SharePaymentLinkAPI
      description: >
        Resend a payment link notification to a customer. At least one of
        `viaEmail`,

        `viaSms`, or `viaWhatsapp` must be `true`.


        The customer's contact details are taken from the values stored on the
        link

        at creation time.


        **Required scope:** `read_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                viaEmail:
                  type: boolean
                  description: >-
                    Send the link to the email address stored on this payment
                    link.
                  example: true
                viaSms:
                  type: boolean
                  description: >-
                    Send the link to the phone number stored on this payment
                    link via SMS.
                  example: true
                viaWhatsapp:
                  type: boolean
                  description: >-
                    Send the link to the phone number stored on this payment
                    link via WhatsApp.
                  example: false
            example:
              viaEmail: true
              viaSms: true
              viaWhatsapp: false
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: Notification sent successfully
              examples:
                success:
                  summary: Notification sent
                  value:
                    status: 0
                    message: Notification sent successfully
        '400':
          description: >
            Validation or business-rule failure. The response body uses:

            - `status: -1`

            - `message`


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.


            **Share errors**


            <details>

            <summary>Payment link not found</summary>


            - **Code:** *(none)*

            - **Cause:** No link with the supplied `invoiceNumber` exists under
            this merchant account.

            - **Recommended fix:** Verify the `invoiceNumber` and environment.


            </details>


            <details>

            <summary>Email address not on record</summary>


            - **Code:** *(none)*

            - **Cause:** `viaEmail` was `true` but no `customer.email` was
            stored on this link at creation.

            - **Recommended fix:** Update the link with `customer.email` via
            Update Payment Link, then retry.


            </details>


            <details>

            <summary>Phone number not on record</summary>


            - **Code:** *(none)*

            - **Cause:** `viaSms` or `viaWhatsapp` was `true` but no
            `customer.phone` was stored on this link.

            - **Recommended fix:** Update the link with `customer.phone` via
            Update Payment Link, then retry.


            </details>


            <details>

            <summary>At least one notification channel must be
            selected</summary>


            - **Code:** *(none)*

            - **Cause:** All three channel flags were `false` or omitted.

            - **Recommended fix:** Set at least one of `viaEmail`, `viaSms`, or
            `viaWhatsapp` to `true`.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link not found.
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                noEmail:
                  summary: No email on record
                  value:
                    status: -1
                    message: Email address not on record for this payment link.
                noChannel:
                  summary: No channel selected
                  value:
                    status: -1
                    message: At least one notification channel must be selected.
        '401':
          description: >
            Authentication failure.


            <details>

            <summary><code>invalid_token</code>: Access token is invalid or has
            expired</summary>


            - **Code:** `invalid_token`

            - **Cause:** The Bearer token is missing, malformed, expired, or has
            been revoked.

            - **Recommended fix:** Generate a new token via `POST /oauth/token`
            and retry.


            </details>


            <details>

            <summary><code>insufficient_scope</code>: Token missing required
            scope</summary>


            - **Code:** `insufficient_scope`

            - **Cause:** The token was issued without the scope required by this
            endpoint.

            - **Recommended fix:** Re-generate the token including the correct
            scope. See the Authentication overview for scope requirements per
            endpoint.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
  /payment-links/{invoiceNumber}/transactions:
    get:
      summary: Get Transaction Details
      operationId: GetTransactionDetailsAPI
      description: >
        Fetch all payment attempts — successful, failed, and pending — recorded
        against

        a payment link.


        Use this to verify payment completion, reconcile partial payments, or
        display

        payment history. An empty `result` array is a valid success response
        when no

        payments have been attempted yet.


        **Required scope:** `read_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: success
                  result:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        txnid:
                          type: string
                          description: PayU's unique transaction ID.
                          example: '7019203456789'
                        amount:
                          type: number
                          description: Amount paid in this transaction, in INR.
                          example: 1499
                        status:
                          type: string
                          description: >
                            Transaction outcome.


                            - `success` — Payment was captured.

                            - `failure` — Payment was declined or failed.

                            - `pending` — Awaiting bank confirmation (common for
                            net banking and UPI).
                          example: success
                        mode:
                          type: string
                          description: >-
                            Payment mode: `UPI`, `CC` (credit card), `DC` (debit
                            card), `NB` (net banking), `ENACH`, etc.
                          example: UPI
                        paymentSource:
                          type: string
                          description: >-
                            Always `PaymentLink` for transactions originating
                            from a payment link.
                          example: PaymentLink
                        addedon:
                          type: string
                          description: >-
                            Timestamp when the transaction was recorded in
                            `YYYY-MM-DD HH:mm:ss`.
                          example: '2026-09-23 14:32:11'
              examples:
                successWithTransaction:
                  summary: Payment recorded
                  value:
                    status: 0
                    message: success
                    result:
                      - txnid: '7019203456789'
                        amount: 1499
                        status: success
                        mode: UPI
                        paymentSource: PaymentLink
                        addedon: '2026-09-23 14:32:11'
                partialPayments:
                  summary: Two partial payments
                  value:
                    status: 0
                    message: success
                    result:
                      - txnid: '7019203456789'
                        amount: 1000
                        status: success
                        mode: UPI
                        paymentSource: PaymentLink
                        addedon: '2026-09-23 14:32:11'
                      - txnid: '7019203456790'
                        amount: 499
                        status: success
                        mode: CC
                        paymentSource: PaymentLink
                        addedon: '2026-09-25 09:15:44'
                noTransactions:
                  summary: No payments yet
                  value:
                    status: 0
                    message: success
                    result: []
        '400':
          description: >
            Validation or business-rule failure. The response body uses:

            - `status: -1`

            - `message`


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.


            **Lookup errors**


            <details>

            <summary>Payment link not found</summary>


            - **Code:** *(none)*

            - **Cause:** No link with the supplied `invoiceNumber` exists under
            this merchant account.

            - **Recommended fix:** Verify the `invoiceNumber` and environment
            (test vs. production).


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link not found.
                  result:
                    nullable: true
                    example: null
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
        '401':
          description: >
            Authentication failure.


            <details>

            <summary><code>invalid_token</code>: Access token is invalid or has
            expired</summary>


            - **Code:** `invalid_token`

            - **Cause:** The Bearer token is missing, malformed, expired, or has
            been revoked.

            - **Recommended fix:** Generate a new token via `POST /oauth/token`
            and retry.


            </details>


            <details>

