    get:
      summary: Fetch All Payment Links
      operationId: FetchAllPaymentLinksAPI
      description: >
        Retrieve a paginated list of payment links for your merchant account,

        sorted by creation date (newest first). Use the `status` filter to
        narrow

        results to active, expired, or cancelled links.


        **Required scope:** `read_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: status
          in: query
          required: false
          description: |
            Filter links by their current state.

            - `active` — Links that are live and can still accept payment.
            - `expired` — Links whose `expiryDate` has passed.
            - `cancelled` — Links deactivated by the merchant.

            Omit to return all links regardless of state.
          schema:
            type: string
            enum:
              - active
              - expired
              - cancelled
        - name: pageNumber
          in: query
          required: false
          description: Page number (1-indexed). Defaults to `1`.
          schema:
            type: integer
            default: 1
            example: 1
        - name: pageSize
          in: query
          required: false
          description: Records per page. Minimum `1`, maximum `50`. Defaults to `10`.
          schema:
            type: integer
            default: 10
            example: 10
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: success
                  result:
                    type: object
                    nullable: true
                    properties:
                      total:
                        type: integer
                        description: Total number of matching links across all pages.
                        example: 42
                      pageNumber:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            invoiceNumber:
                              type: string
                              example: ORD-2026-88421
                            paymentLink:
                              type: string
                              example: https://pp72.pmny.in/WxYzAbCdEfGh
                            description:
                              type: string
                              example: 'Order #ORD-2026-88421'
                            totalAmount:
                              type: integer
                              example: 1499
                            active:
                              type: boolean
                              example: true
                            expiryDate:
                              type: string
                              example: '2026-10-15 23:59:59'
              examples:
                success:
                  summary: Results returned
                  value:
                    status: 0
                    message: success
                    result:
                      total: 2
                      pageNumber: 1
                      pageSize: 10
                      data:
                        - invoiceNumber: ORD-2026-88421
                          paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                          description: 'Order #ORD-2026-88421'
                          totalAmount: 1499
                          active: true
                          expiryDate: '2026-10-15 23:59:59'
                        - invoiceNumber: DON-2026-001
                          paymentLink: https://pp72.pmny.in/DonAbCdEf
                          description: Donation — Help us plant 1,000 trees
                          totalAmount: null
                          active: true
                          expiryDate: '2026-12-31 23:59:59'
                empty:
                  summary: No results
                  value:
                    status: 0
                    message: No records found
                    result:
                      total: 0
                      pageNumber: 1
                      pageSize: 10
                      data: []
        '400':
          description: >-
            Validation failure. The response body uses `status: -1` and
            `message`.


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Invalid pageSize. Must be between 1 and 50.
                  result:
                    nullable: true
                    example: null
              examples:
                invalidPageSize:
                  summary: Invalid pageSize
                  value:
                    status: -1
                    message: Invalid pageSize. Must be between 1 and 50.
                    result: null
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
  /payment-links/{invoiceNumber}:
    get:
      summary: Fetch Payment Link
      operationId: FetchPaymentLinkAPI
      description: >
        Retrieve the current state and all details of a payment link by its
        `invoiceNumber`.


        Use this to check whether a link is active, verify its amount and
        configuration,

        or poll for status after a customer interaction.


        **Required scope:** `read_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: success
                  result:
                    type: object
                    nullable: true
                    description: The Payment Link object.
                    properties:
                      invoiceNumber:
                        type: string
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      description:
                        type: string
                        example: 'Order #ORD-2026-88421 — Wireless Headphones'
                      subAmount:
                        type: integer
                        example: 1499
                      tax:
                        type: integer
                        example: 0
                      shippingCharge:
                        type: integer
                        example: 0
                      totalAmount:
                        type: integer
                        example: 1499
                      active:
                        type: boolean
                        description: '`true` if the link is live and accepting payment.'
                        example: true
                      isPartialPaymentAllowed:
                        type: boolean
                        example: false
                      expiryDate:
                        type: string
                        example: '2026-10-15 23:59:59'
                      source:
                        type: string
                        example: API
                      emailStatus:
                        type: string
                        description: >-
                          `sent` if email was dispatched at creation. `not
                          opted` if `viaEmail` was false.
                        example: sent
                      smsStatus:
                        type: string
                        description: >-
                          `sent` if SMS was dispatched at creation. `not opted`
                          if `viaSms` was false.
                        example: not opted
              examples:
                success:
                  summary: Link found
                  value:
                    status: 0
                    message: success
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      description: 'Order #ORD-2026-88421 — Wireless Headphones'
                      subAmount: 1499
                      tax: 0
                      shippingCharge: 0
                      totalAmount: 1499
                      active: true
                      isPartialPaymentAllowed: false
                      expiryDate: '2026-10-15 23:59:59'
                      source: API
                      emailStatus: sent
                      smsStatus: not opted
        '400':
          description: >-
            Validation or business-rule failure. The response body uses `status:
            -1` and `message`.


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link not found.
                  result:
                    nullable: true
                    example: null
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
    put:
      summary: Update Payment Link
      operationId: UpdatePaymentLinkAPI
      description: >
        Modify the configuration of an existing active payment link. Only send
        the fields

        you want to change — omitted fields retain their current values.


        **Restrictions:**

        - Cannot update a cancelled link (`active: false`).

        - Cannot update a link that has been fully paid.

        - Cannot reduce `subAmount` below the amount already collected on a
        partial payment link.


        **Required scope:** `update_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
        - name: invoiceNumber
          in: path
          required: true
          description: The `invoiceNumber` of the payment link.
          schema:
            type: string
            example: ORD-2026-88421
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Only pass the fields you want to change. All fields are
                optional.
              properties:
                subAmount:
                  type: integer
                  description: >
                    Updated base amount in whole INR.


                    Cannot be reduced below any amount already collected on a
                    partial payment link.
                  example: 1999
                description:
                  type: string
                  description: Updated payment purpose description. Maximum 255 characters.
                  example: Updated — Wireless Headphones (revised price)
                expiryDate:
                  type: string
                  description: >-
                    Updated link expiry in `YYYY-MM-DD HH:mm:ss` format. Must be
                    a future datetime.
                  example: '2026-11-30 23:59:59'
                isPartialPaymentAllowed:
                  type: boolean
                  description: Enable or disable partial payment on the link.
                  example: true
                minAmountForCustomer:
                  type: integer
                  description: Updated minimum partial payment amount in INR.
                  example: 500
                viaEmail:
                  type: boolean
                  description: Resend the link to the customer's email address on record.
                  example: true
                viaSms:
                  type: boolean
                  description: Resend the link to the customer's phone number via SMS.
                  example: false
                viaWhatsapp:
                  type: boolean
                  description: Resend the link to the customer's phone number via WhatsApp.
                  example: false
            example:
              expiryDate: '2026-11-30 23:59:59'
              subAmount: 1999
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: '`0` = success.'
                    example: 0
                  message:
                    type: string
                    example: Payment link updated successfully
                  result:
                    type: object
                    nullable: true
                    properties:
                      invoiceNumber:
                        type: string
                        example: ORD-2026-88421
                      paymentLink:
                        type: string
                        example: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount:
                        type: integer
                        example: 1999
                      active:
                        type: boolean
                        example: true
                      expiryDate:
                        type: string
                        example: '2026-11-30 23:59:59'
              examples:
                success:
                  summary: Link updated successfully
                  value:
                    status: 0
                    message: Payment link updated successfully
                    result:
                      invoiceNumber: ORD-2026-88421
                      paymentLink: https://pp72.pmny.in/WxYzAbCdEfGh
                      totalAmount: 1999
                      active: true
                      expiryDate: '2026-11-30 23:59:59'
        '400':
          description: >-
            Validation or business-rule failure. The response body uses `status:
            -1` and `message`.


            > **Note:** PayU Payment Links API always returns HTTP 200. This
            block documents error patterns returned when `status: -1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: -1
                  message:
                    type: string
                    example: Payment link not found.
                  result:
                    nullable: true
                    example: null
              examples:
                notFound:
                  summary: Link not found
                  value:
                    status: -1
                    message: Payment link not found.
                    result: null
                alreadyPaid:
                  summary: Link already paid
                  value:
                    status: -1
                    message: Cannot update a payment link that has already been paid.
                    result: null
                alreadyCancelled:
                  summary: Link already cancelled
                  value:
                    status: -1
                    message: Cannot update a cancelled payment link.
                    result: null
        '401':
          description: Authentication failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_token
                  error_description:
                    type: string
                    example: The access token is invalid or has expired.
              examples:
                expiredToken:
                  summary: Token expired or revoked
                  value:
                    error: invalid_token
                    error_description: The access token is invalid or has expired.
                insufficientScope:
                  summary: Missing required scope
                  value:
                    error: insufficient_scope
                    error_description: The access token does not have the required scope.
    delete:
      summary: Cancel Payment Link
      operationId: CancelPaymentLinkAPI
      description: >
        Deactivate an existing payment link so it can no longer accept payments.

        Sets `active` to `false` permanently — a cancelled link cannot be
        reactivated.


        **Restrictions:**

        - Cannot cancel a link that has already been fully paid.


        **Required scope:** `update_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
