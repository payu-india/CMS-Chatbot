openapi: 3.0.0
info:
  title: PayU Payment Links API
  description: Create, manage, and share payment links programmatically.
  version: 1.0.0
servers:
  - url: https://uatoneapi.payu.in
    description: Test Environment
  - url: https://oneapi.payu.in
    description: Production Environment
tags:
  - name: Authentication
    description: Generate and revoke OAuth 2.0 Bearer tokens.
  - name: Payment Links
    description: Create, retrieve, update, share, and manage payment links.
paths:
  /oauth/token:
    post:
      summary: Get Access Token
      operationId: GetAccessTokenAPI
      description: >
        Exchange your `client_id` and `client_secret` for a Bearer token scoped
        to the

        Payment Links operations you need. Call this endpoint once and cache the
        token —

        do not generate a new token before every API call.


        Token validity is returned as `expires_in` seconds (typically 7200 — 2
        hours).

        Calculate expiry as `created_at + expires_in` and regenerate before that
        moment.


        **Scopes**


        | Scope | Grants access to |

        |---|---|

        | `create_payment_links` | Create Payment Link |

        | `update_payment_links` | Update Payment Link · Cancel Payment Link |

        | `read_payment_links` | Fetch All · Fetch Single · Share · Get
        Transactions |
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - grant_type
                - scope
              properties:
                client_id:
                  type: string
                  description: >
                    Your OAuth app's public identifier.

                    Find this in PayU Dashboard → **Developers** → **OAuth
                    Apps**.
                  example: '{{client_id}}'
                client_secret:
                  type: string
                  description: >
                    Your OAuth app's secret key. Never expose it in client-side
                    code or

                    public repositories — treat it like a password.
                  example: '{{client_secret}}'
                grant_type:
                  type: string
                  description: |
                    OAuth 2.0 grant type. Always pass `client_credentials` for
                    server-to-server Payment Links integrations.
                  example: client_credentials
                scope:
                  type: string
                  description: >
                    Space-separated list of scopes the token should carry.

                    You can request all three in a single call:


                    `create_payment_links update_payment_links
                    read_payment_links`
                  example: create_payment_links update_payment_links read_payment_links
            examples:
              allScopes:
                summary: Token with all three scopes
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  grant_type: client_credentials
                  scope: create_payment_links update_payment_links read_payment_links
              createOnly:
                summary: Token for creating links only
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  grant_type: client_credentials
                  scope: create_payment_links
      responses:
        '200':
          description: Token generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: >-
                      Bearer token to use in the `Authorization` header of all
                      Payment Links API calls.
                    example: >-
                      ea4ed864b4d2a04b90c1e987a5d25a5da1d43fa5f7d123be6814a1e973f196c4
                  token_type:
                    type: string
                    description: Always `Bearer`.
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Token validity in seconds. Typically `7200` (2 hours).
                    example: 7200
                  scope:
                    type: string
                    description: The scopes granted to this token.
                    example: >-
                      create_payment_links update_payment_links
                      read_payment_links
                  created_at:
                    type: integer
                    description: |
                      Unix timestamp of token creation.
                      Token expiry = `created_at + expires_in`.
                    example: 1763036368
              examples:
                success:
                  summary: Token generated
                  value:
                    access_token: >-
                      ea4ed864b4d2a04b90c1e987a5d25a5da1d43fa5f7d123be6814a1e973f196c4
                    token_type: Bearer
                    expires_in: 7200
                    scope: >-
                      create_payment_links update_payment_links
                      read_payment_links
                    created_at: 1763036368
        '400':
          description: >
            Invalid request parameters. The response body uses the standard
            OAuth error format.


            **Request errors**


            <details>

            <summary><code>invalid_scope</code>: Requested scope is invalid or
            unknown</summary>


            - **Code:** `invalid_scope`

            - **Cause:** One or more scope values are misspelled or not
            permitted for your OAuth app.

            - **Recommended fix:** Check scope values — they are case-sensitive.
            Valid values: `create_payment_links`, `update_payment_links`,
            `read_payment_links`. Separate multiple scopes with a single space.


            </details>


            <details>

            <summary><code>unsupported_grant_type</code>: Grant type is not
            supported</summary>


            - **Code:** `unsupported_grant_type`

            - **Cause:** `grant_type` was not `client_credentials`.

            - **Recommended fix:** Always send `grant_type=client_credentials`
            for server-to-server Payment Links integration.


            </details>


            <details>

            <summary><code>unauthorized_client</code>: App not permitted for
            this grant type</summary>


            - **Code:** `unauthorized_client`

            - **Cause:** The OAuth app is not configured to use the
            `client_credentials` grant type.

            - **Recommended fix:** Contact PayU Support to verify your OAuth app
            configuration.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: OAuth error code.
                    example: invalid_scope
                  error_description:
                    type: string
                    description: Human-readable error description.
                    example: The requested scope is invalid, unknown, or malformed.
              examples:
                invalidScope:
                  summary: Unknown scope value
                  value:
                    error: invalid_scope
                    error_description: The requested scope is invalid, unknown, or malformed.
                unsupportedGrant:
                  summary: Wrong grant type
                  value:
                    error: unsupported_grant_type
                    error_description: >-
                      The authorization grant type is not supported by the
                      authorization server.
        '401':
          description: >
            Client authentication failed.


            <details>

            <summary><code>invalid_client</code>: client_id or client_secret is
            wrong</summary>


            - **Code:** `invalid_client`

            - **Cause:** `client_id` or `client_secret` is incorrect, missing,
            or belongs to a different environment (test vs. live).

            - **Recommended fix:** Verify your credentials in PayU Dashboard →
            **Developers** → **OAuth Apps**. Confirm you are using test
            credentials against `uat-accounts.payu.in` and live credentials
            against `accounts.payu.in`.


            </details>


            <details>

            <summary><code>rate_limit_exceeded</code>: Too many token
            requests</summary>


            - **Code:** `rate_limit_exceeded`

            - **Cause:** Token generation requests exceeded the allowed rate.

            - **Recommended fix:** Cache the token and reuse it until it
            expires. Do not call this endpoint before every API request.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client
                  error_description:
                    type: string
                    example: Client authentication failed.
              examples:
                invalidClient:
                  summary: Invalid credentials
                  value:
                    error: invalid_client
                    error_description: >-
                      Client authentication failed due to unknown client, no
                      client authentication included, or unsupported
                      authentication method.
                rateLimited:
                  summary: Rate limit exceeded
                  value:
                    error: rate_limit_exceeded
                    error_description: >-
                      Too many token requests. Cache your token and retry after
                      the cooldown period.
      servers:
        - url: https://uat-accounts.payu.in
          description: Test Environment
        - url: https://accounts.payu.in
          description: Production Environment
      security: []
  /oauth/revoke:
    post:
      summary: Revoke Token API
      operationId: RevokeTokenAPI
      description: >
        Invalidate a Bearer token before its natural expiry.


        Use this when rotating credentials or if you suspect a token has been
        exposed.

        The revoked token becomes invalid immediately. After revoking, generate
        a new

        token via `POST /oauth/token`.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - client_secret
                - token
              properties:
                client_id:
                  type: string
                  description: The `client_id` of the OAuth app that issued the token.
                  example: '{{client_id}}'
                client_secret:
                  type: string
                  description: The `client_secret` of the OAuth app that issued the token.
                  example: '{{client_secret}}'
                token:
                  type: string
                  description: The `access_token` value to invalidate.
                  example: '{{access_token}}'
            examples:
              basic:
                summary: Revoke a token
                value:
                  client_id: '{{client_id}}'
                  client_secret: '{{client_secret}}'
                  token: '{{access_token}}'
      responses:
        '200':
          description: Token revoked successfully. Response body is empty.
        '401':
          description: >
            Authentication failure.


            <details>

            <summary><code>invalid_client</code>: client_id or client_secret is
            wrong</summary>


            - **Code:** `invalid_client`

            - **Cause:** `client_id` or `client_secret` does not match the OAuth
            app that issued the token.

            - **Recommended fix:** Verify your credentials match the OAuth app
            that originally issued the token.


            </details>


            <details>

            <summary><code>invalid_token</code>: Token not found or already
            revoked</summary>


            - **Code:** `invalid_token`

            - **Cause:** The token is not found, has already expired, or was
            previously revoked.

            - **Recommended fix:** This is a no-op if the token is already
            invalid. No action needed unless you are troubleshooting a different
            issue.


            </details>
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client
                  error_description:
                    type: string
                    example: Client authentication failed.
              examples:
                invalidClient:
                  summary: Invalid credentials
                  value:
                    error: invalid_client
                    error_description: >-
                      Client authentication failed due to unknown client, no
                      client authentication included, or unsupported
                      authentication method.
                invalidToken:
                  summary: Token already invalid
                  value:
                    error: invalid_token
                    error_description: The token is invalid or has already been revoked.
      servers:
        - url: https://uat-accounts.payu.in
          description: Test Environment
        - url: https://accounts.payu.in
          description: Production Environment
      security: []
  /payment-links:
    post:
      summary: Create Payment Link
      operationId: CreatePaymentLinkAPI
      description: >
        Create a shareable payment link and optionally notify the customer via
        email, SMS,

        or WhatsApp. The link type is determined by the combination of
        parameters sent —

        there is no separate `type` field.


        | Link Type | Key parameters |

        |---|---|

        | Standard (fixed amount) | `source: API`, `subAmount > 0` |

        | Open Amount | `source: API`, `isAmountFilledByCustomer: true` (omit
        `subAmount`) |

        | Partial Payment | `source: API`, `subAmount > 0`,
        `isPartialPaymentAllowed: true` |

        | SI Recurring | `source: si_payment_link`, `siDetails` object |

        | eNACH | `source: si_payment_link`, `enforcePayMethod: enach`,
        `siDetails` with `bankDetails` |


        **Required scope:** `create_payment_links`
      tags:
        - Payment Links
      parameters:
        - name: Authorization
          in: header
          required: true
          description: >-
            Bearer token obtained from `POST /oauth/token`. Format: `Bearer
            {access_token}`
          schema:
            type: string
            example: Bearer {{access_token}}
        - name: merchantId
          in: header
          required: true
          description: Your PayU Merchant ID.
          schema:
            type: string
            example: '{{merchantId}}'
      x-readme:
        code-samples:
          - language: curl
            name: Standard
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "subAmount": 1499,
                "description": "Order #ORD-2026-88421",
                "source": "API",
                "invoiceNumber": "ORD-2026-88421",
                "expiryDate": "2026-10-15 23:59:59",
                "viaEmail": true,
                "viaSms": true,
                "customer": {
                  "name": "Arjun Mehta",
                  "email": "arjun.mehta@example.com",
                  "phone": "9876543210"
                }
              }'
          - language: curl
            name: Open Amount
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "description": "Donation — Help us plant 1,000 trees",
                "source": "API",
                "isAmountFilledByCustomer": true,
                "invoiceNumber": "DON-2026-001",
                "viaEmail": true,
                "customer": {
                  "name": "Priya Sharma",
                  "email": "priya@example.com"
                }
              }'
          - language: curl
            name: Partial Payment
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "subAmount": 5000,
                "description": "Advance booking",
                "source": "API",
                "isPartialPaymentAllowed": true,
                "minAmountForCustomer": 1000,
                "viaEmail": true,
                "customer": {
                  "name": "Rohit Verma",
                  "email": "rohit@example.com",
                  "phone": "9988776655"
                }
              }'
          - language: curl
            name: SI Recurring
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "description": "Monthly SIP",
                "source": "si_payment_link",
                "viaEmail": true,
                "customer": {
                  "name": "Kavya Nair",
                  "email": "kavya@example.com",
                  "phone": "9871234567"
                },
                "siDetails": {
                  "billingAmount": 2000,
                  "billingCycle": "MONTHLY",
                  "billingInterval": 12,
                  "paymentStartDate": "2026-11-01",
                  "paymentEndDate": "2027-10-31",
                  "isNoExpiry": false
                }
              }'
          - language: curl
            name: eNACH
            code: |
              curl --location 'https://uatoneapi.payu.in/payment-links' \
              --header 'Authorization: Bearer {{access_token}}' \
              --header 'merchantId: {{merchantId}}' \
              --header 'Content-Type: application/json' \
              --data '{
                "description": "Monthly SIP via eNACH",
                "source": "si_payment_link",
                "enforcePayMethod": "enach",
                "viaEmail": true,
                "customer": {
                  "name": "Suresh Pillai",
                  "email": "suresh@example.com",
                  "phone": "9988001122"
                },
                "siDetails": {
                  "billingAmount": 2000,
                  "billingCycle": "MONTHLY",
                  "billingInterval": 12,
                  "paymentStartDate": "2026-11-01",
                  "paymentEndDate": "2027-10-31",
                  "isNoExpiry": false,
                  "bankDetails": {
                    "bankCode": "SBIIN",
                    "bankAccountNumber": "1234567890",
                    "ifsc": "SBIN0001234",
                    "accountType": "SAVINGS"
                  }
                }
              }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - description
                - source
              properties:
                subAmount:
                  type: integer
                  description: >
                    Base payment amount in whole INR.


                    - **Standard / Partial Payment:** Required. Must be greater
                    than 0.

                    - **Open Amount:** Omit — set `isAmountFilledByCustomer:
                    true` instead.

                    - **SI Recurring / eNACH:** Omit — use
                    `siDetails.billingAmount` for the per-cycle debit.
                  example: 1499
                description:
                  type: string
                  description: >-
                    Purpose of the payment. Shown to the customer on the
                    checkout page. Maximum 255 characters.
                  example: 'Order #ORD-2026-88421 — Wireless Headphones'
                source:
                  type: string
                  description: >
                    Identifies the link category.


                    - `"API"` — Standard, Open Amount, or Partial Payment links.

                    - `"si_payment_link"` — SI Recurring and eNACH mandate
                    registration links.
                  enum:
                    - API
                    - si_payment_link
                  example: API
                invoiceNumber:
                  type: string
                  description: >
                    Your unique reference ID for this link. Alphanumeric,
                    maximum 25 characters.

                    Auto-generated by PayU if omitted. Used as the path
                    parameter in all subsequent

                    Fetch, Update, Share, and Cancel calls.
                  example: ORD-2026-88421
                expiryDate:
                  type: string
                  description: >
                    Link expiry in `YYYY-MM-DD HH:mm:ss` format. After this
                    datetime the link stops

                    accepting payments. Defaults to 7 days from creation.
                  example: '2026-10-15 23:59:59'
                currency:
                  type: string
                  description: ISO 4217 currency code. Defaults to `INR`.
                  example: INR
                tax:
                  type: integer
                  description: Tax amount in INR added to `subAmount`. Defaults to 0.
                  example: 0
                shippingCharge:
                  type: integer
                  description: Shipping charge in INR added to `subAmount`. Defaults to 0.
                  example: 0
                discount:
                  type: integer
                  description: >-
                    Discount amount in INR subtracted from `subAmount`. Defaults
                    to 0.
                  example: 0
                maxPaymentsAllowed:
                  type: integer
                  description: Maximum successful payment attempts allowed. Defaults to 1.
                  example: 1
                isAmountFilledByCustomer:
                  type: boolean
                  description: >
                    **Open Amount links only.** Set to `true` to let the
                    customer enter their own

                    payment amount at checkout. Mutually exclusive with
                    `isPartialPaymentAllowed`.

                    When `true`, omit `subAmount`.
                  example: false
                isPartialPaymentAllowed:
                  type: boolean
                  description: >
                    **Partial Payment links only.** Set to `true` to allow the
                    customer to pay less

                    than the total amount. Requires `subAmount`. Mutually
                    exclusive with

                    `isAmountFilledByCustomer`.
                  example: false
                minAmountForCustomer:
                  type: integer
                  description: >
                    **Partial Payment links only.** Minimum amount (INR) the
                    customer must pay in

                    the first transaction. Ignored unless
                    `isPartialPaymentAllowed` is `true`.
                  example: 500
                viaEmail:
                  type: boolean
                  description: >-
                    Send the link to `customer.email` via email on creation.
                    Requires `customer.email`.
                  example: true
                viaSms:
                  type: boolean
                  description: >-
                    Send the link to `customer.phone` via SMS on creation.
                    Requires `customer.phone`.
                  example: true
                viaWhatsapp:
                  type: boolean
                  description: >-
                    Send the link to `customer.phone` via WhatsApp on creation.
                    Requires `customer.phone`.
                  example: false
                successURL:
                  type: string
                  description: URL to redirect the customer after a successful payment.
                  example: https://yourstore.com/payment/success
                failureURL:
                  type: string
                  description: >-
                    URL to redirect the customer after a failed or cancelled
                    payment.
                  example: https://yourstore.com/payment/failure
                enforcePayMethod:
                  type: string
                  description: >
                    Restrict checkout to specific payment methods. Separate
                    multiple values with `|`.


                    - **eNACH links:** Must be `"enach"` — renders the bank
                    mandate registration flow.

                    - **Other links:** e.g. `"cc|dc"` (cards only), `"upi"` (UPI
                    only), `"nb"` (net banking only).
                  example: cc|dc
                dropCategory:
                  type: string
                  description: >
                    Hide specific payment categories from checkout. Separate
                    values with `|`.

                    Example: `"EMI"` hides the EMI option.
                  example: EMI
                customer:
                  type: object
                  description: >-
                    Customer contact details. Required when using `viaEmail`,
                    `viaSms`, or `viaWhatsapp`.
                  properties:
                    name:
                      type: string
                      description: Customer's full name. Shown on the checkout page.
                      example: Arjun Mehta
                    email:
                      type: string
                      description: >-
                        Customer's email address. Required when `viaEmail` is
                        `true`.
                      example: arjun.mehta@example.com
                    phone:
                      type: string
                      description: >-
                        Customer's 10-digit mobile number. Required when
                        `viaSms` or `viaWhatsapp` is `true`.
                      example: '9876543210'
                address:
                  type: object
                  description: >-
                    Customer billing address. Stored against the link and passed
                    through to webhooks.
                  properties:
                    line1:
                      type: string
                      example: 42 MG Road
                    line2:
                      type: string
                      example: Indiranagar
                    city:
                      type: string
                      example: Bengaluru
                    state:
                      type: string
                      example: Karnataka
                    zipCode:
                      type: string
                      example: '560038'
                udf:
                  type: object
                  description: >
                    User-defined fields 1–5. Stored against the link and passed
                    through unchanged to

                    webhook callbacks. Use for internal order IDs, customer
                    segments, or campaign codes.
                  properties:
                    udf1:
                      type: string
                      example: electronics
                    udf2:
                      type: string
                      example: app-checkout
                    udf3:
                      type: string
                    udf4:
                      type: string
                    udf5:
                      type: string
                siDetails:
                  type: object
                  description: >
                    **Required for SI Recurring and eNACH links** (`source:
                    "si_payment_link"`).

                    Defines the recurring billing schedule. Omit for Standard,
                    Open Amount, and

                    Partial Payment links.
                  properties:
                    billingAmount:
                      type: integer
                      description: Amount to debit on each billing cycle, in whole INR.
                      example: 2000
                    billingCycle:
                      type: string
                      description: |
                        Frequency of recurring debits.

                        Possible values: `DAILY`, `WEEKLY`, `MONTHLY`, `YEARLY`,
                        `BI_MONTHLY`, `QUARTERLY`, `HALF_YEARLY`, `AS_PRESENTED`
                      enum:
                        - DAILY
                        - WEEKLY
                        - MONTHLY
                        - YEARLY
                        - BI_MONTHLY
                        - QUARTERLY
                        - HALF_YEARLY
                        - AS_PRESENTED
                      example: MONTHLY
                    billingInterval:
                      type: integer
                      description: >-
                        Total number of billing cycles. E.g. `12` for a 12-month
                        monthly SIP.
                      example: 12
                    paymentStartDate:
                      type: string
                      description: Date of the first debit in `YYYY-MM-DD` format.
                      example: '2026-11-01'
                    paymentEndDate:
                      type: string
                      description: >-
                        Date of the last debit in `YYYY-MM-DD` format. Ignored
                        when `isNoExpiry` is `true`.
                      example: '2027-10-31'
                    isNoExpiry:
                      type: boolean
                      description: >
                        Set to `true` for an open-ended mandate with no fixed
                        end date.

                        When `true`, `paymentEndDate` is ignored.
                      example: false
                    isFreeTrial:
                      type: boolean
                      description: >-
                        Set to `true` to register the mandate without charging
                        the first instalment.
                      example: false
                    remarks:
                      type: string
                      description: >-
                        Merchant-facing notes for this subscription. Not shown
                        to the customer.
                      example: SIP — mutual fund folio 9104927822
                    bankDetails:
                      type: object
                      description: >
                        **Required for eNACH links** (`enforcePayMethod:
                        "enach"`).

                        Pre-fills the customer's bank details on the eNACH
                        registration form.

                        Omit for SI Recurring links.
                      properties:
                        bankCode:
                          type: string
                          description: >-
                            Bank identifier code. E.g. `SBIIN` for State Bank of
                            India.
                          example: SBIIN
                        bankAccountNumber:
                          type: string
                          description: Customer's bank account number.
                          example: '1234567890'
                        ifsc:
                          type: string
                          description: IFSC code of the specific branch.
                          example: SBIN0001234
                        accountType:
                          type: string
                          description: Type of bank account.
                          enum:
                            - SAVINGS
                            - CURRENT
                          example: SAVINGS
            example:
              subAmount: 1499
              description: 'Order #ORD-2026-88421 — Wireless Headphones'
              source: API
              invoiceNumber: ORD-2026-88421
              expiryDate: '2026-10-15 23:59:59'
              currency: INR
              tax: 0
              shippingCharge: 0
              discount: 0
              maxPaymentsAllowed: 1
              isAmountFilledByCustomer: false
              isPartialPaymentAllowed: false
              minAmountForCustomer: 500
              viaEmail: true
              viaSms: true
              viaWhatsapp: false
              successURL: https://yourstore.com/payment/success
              failureURL: https://yourstore.com/payment/failure
              enforcePayMethod: cc|dc
              dropCategory: EMI
              customer:
                name: Arjun Mehta
